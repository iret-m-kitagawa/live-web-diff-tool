        jumpControls.style.display = show ? 'flex' : 'none';
      }

      // ---- HTML View: aligning the left/right pane heights ----
      // The same idea as the Markdown View's alignSplitPanes (align corresponding blocks'
      // heights so 2 columns fit into a single scroll area). The difference: since the iframe
      // has no allow-same-origin, the parent can neither measure its contents directly nor
      // insert padding into it. Instead, the ANCHOR_SCRIPT injected into each iframe is given
      // the job of "measure and report to the parent" / "insert padding as told by the parent"
      // (defined on the ANCHOR_SCRIPT side); this code's only job is to match up the numbers
      // that arrive from both sides and issue instructions.
      let htmlSplitActive = false;   // whether side-by-side is showing. While false, this whole
                                      // section passes straight through (the same treatment as
                                      // realignMdSplit when mdSplitLeftPane is null).
      let htmlAlignSeq = 0;           // generation number, used to ignore stale replies
      let htmlAlignMeasured = null;   // { left, right }; move to the next stage once both arrive
      let htmlAlignTotals = null;     // { left, right }; finalize the height once both arrive
      let htmlRealignQueued = false;
      let htmlLastAlignWidth = 0;
      let htmlSyncMaxDepth = 0;       // max depth of "flows" in the current mapping (set in openHtmlView)
      let htmlAlignLevel = 0;         // depth being processed this cycle (order: htmlSyncMaxDepth -> 0)
      // Reconciliation after each stage's processing finishes. Measured values alone can't get
      // this fully aligned (inserting padding can break margin collapsing, making the box grow
      // by more than the padding added), so actual arrived positions are compared and nudged
      // over a few rounds.
      let htmlAlignPositions = null;  // { left, right }; compute the difference once both arrive
      let htmlAlignRound = 0;         // number of reconciliation rounds so far
      const HTML_ALIGN_MAX_ROUNDS = 3;
      const HTML_ALIGN_TOLERANCE = 2; // don't close a gap this small or smaller (closing it would just make it jitter)

      // Send instructions via postMessage into the sandboxed iframe.
      // targetOrigin is fixed to '*' (the other side is an opaque origin with no
      // allow-same-origin, so specifying the real origin would never match exactly and the
      // message would never arrive).
      function postToHtmlFrame(frame, msg) {
        if (!frame.contentWindow) return;
        msg.__htmlAlign = true;
        frame.contentWindow.postMessage(msg, '*');
      }

      // Tell both iframes to "clear any padding you have, remeasure, and report back," starting
      // a cycle that aligns from the deepest flow outward. Every scenario that "needs a
      // realign" -- width changed, theme changed, font size changed, an image finished lazy
      // loading -- converges here. Advancing the generation number lets a reply from a stale
      // generation (e.g. another trigger fired partway through the previous cycle) be safely
      // ignored.
      function requestHtmlRealign() {
        if (!htmlSplitActive) return;
        htmlAlignSeq += 1;
        htmlAlignLevel = htmlSyncMaxDepth;
        htmlAlignMeasured = { left: null, right: null };
        htmlAlignTotals = null;
        htmlAlignPositions = null;
        htmlAlignRound = 0;
        postToHtmlFrame(htmlDiffFrameLeft, { type: 'remeasure', seq: htmlAlignSeq, level: htmlAlignLevel, first: true });
        postToHtmlFrame(htmlDiffFrameRight, { type: 'remeasure', seq: htmlAlignSeq, level: htmlAlignLevel, first: true });
      }

      // Remeasure just one stage's worth (the current htmlAlignLevel). A deep flow's container
      // height changes as a result of padding inserted into the flows inside it, so this is
      // called again after finishing each stage, moving on to a shallower flow (a container
      // laid out side by side is itself a unit of its parent flow and also holds other flows
      // inside it, so processing in the reverse order would let the contents grow after the
      // container's height is measured, throwing off the amount compensated for -- this is why
      // the deepest flow is processed first). Padding is not cleared here (data.first is not set).
      function requestHtmlRealignLevel() {
        htmlAlignMeasured = { left: null, right: null };
        htmlAlignTotals = null;
        postToHtmlFrame(htmlDiffFrameLeft, { type: 'remeasure', seq: htmlAlignSeq, level: htmlAlignLevel });
        postToHtmlFrame(htmlDiffFrameRight, { type: 'remeasure', seq: htmlAlignSeq, level: htmlAlignLevel });
      }

      // Coalesce events that fire repeatedly in quick succession (the left and right iframes
      // loading one after another, etc) into a single frame before realigning. Same idea as
      // the Markdown View's scheduleMdRealign.
      function scheduleHtmlRealign() {
        if (!htmlSplitActive) return;
        if (htmlRealignQueued) return;
        htmlRealignQueued = true;
        requestAnimationFrame(() => { htmlRealignQueued = false; requestHtmlRealign(); });
      }
      // Bridge this so the theme / font-size change handler (defined earlier than this script)
      // can trigger a realign (the same mechanism as the Markdown View's mdRealignHook).
      htmlRealignHook = scheduleHtmlRealign;

      // When the container's width changes, the pasted page's own line wrapping changes, and
      // so does its height. Watch #htmlSplitContainer's own width with a ResizeObserver and
      // realign (while single-column is showing, htmlSplitActive is false, so this passes
      // straight through on the scheduleHtmlRealign side).
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => {
          if (!htmlSplitActive) return;
          if (htmlSplitContainer.clientWidth === htmlLastAlignWidth) return;
          scheduleHtmlRealign();
        }).observe(htmlSplitContainer);
      }

      // Called when leaving side-by-side (going back to single-column / back to Monaco). No
      // stray subscription is left behind (the event listeners are attached permanently to
      // these 2 iframe elements only, and removing srcdoc wipes out the scripts inside along
      // with it), but the state and the iframe height overrides are explicitly reset anyway.
      function resetHtmlAlignState() {
        htmlSplitActive = false;
        htmlAlignSeq += 1; // invalidate every reply from the cycle in progress
        htmlAlignMeasured = null;
        htmlAlignTotals = null;
        htmlAlignLevel = 0;
        htmlRealignQueued = false;
        htmlLastAlignWidth = 0;
        htmlDiffFrameLeft.style.height = '';
        htmlDiffFrameRight.style.height = '';
        htmlSplitDivider.style.height = '';
      }

      // Because of the sandbox, an incoming message's origin is always "null," so origin can't
      // be used to check legitimacy. Instead, check only whether event.source is one of the
      // contentWindows of the 2 iframes this code created, and ignore anything else (a window
      // of unknown provenance).
      window.addEventListener('message', (e) => {
        const side = e.source === htmlDiffFrameLeft.contentWindow ? 'left'
          : e.source === htmlDiffFrameRight.contentWindow ? 'right' : null;
        if (!side) return;
        const data = e.data;
        if (!data || data.__htmlAlign !== true) return;
        if (!htmlSplitActive) return;

        if (data.type === 'settled') {
          // A notification that the height inside the iframe changed on its own, e.g. an image
          // finished lazy loading. Advance the generation and remeasure both sides.
          scheduleHtmlRealign();
          return;
        }
        if (data.seq !== htmlAlignSeq) return; // ignore a reply from an earlier generation
        // Only apply the stage (depth) check to stage-scoped exchanges. The reconciliation
        // exchange (positions / corrected) doesn't belong to a stage, so rejecting it here
        // would discard every reply.
        if ((data.type === 'measured' || data.type === 'aligned')
          && data.level !== htmlAlignLevel) return;

        if (data.type === 'measured') {
          if (!htmlAlignMeasured) return;
          htmlAlignMeasured[side] = { total: data.total, blocks: data.blocks || {} };
          if (htmlAlignMeasured.left && htmlAlignMeasured.right) {
            // Both sides' measurements are in. Pass each side's values straight to its
            // counterpart, leaving the decision of exactly where to insert padding to each
            // iframe (applyLevelAlign).
            const leftBlocks = htmlAlignMeasured.left.blocks;
            const rightBlocks = htmlAlignMeasured.right.blocks;
            htmlAlignTotals = { left: null, right: null };
            postToHtmlFrame(htmlDiffFrameLeft, { type: 'apply', seq: htmlAlignSeq, level: htmlAlignLevel, counterpart: rightBlocks });
            postToHtmlFrame(htmlDiffFrameRight, { type: 'apply', seq: htmlAlignSeq, level: htmlAlignLevel, counterpart: leftBlocks });
          }
        } else if (data.type === 'aligned') {
          if (!htmlAlignTotals) return;
          htmlAlignTotals[side] = data.total;
          if (htmlAlignTotals.left != null && htmlAlignTotals.right != null) {
            if (htmlAlignLevel > 0) {
              // A shallower flow still remains. The container may have grown by the amount of
              // padding just inserted at this stage, so start the next shallower stage over
              // from remeasuring.
              htmlAlignLevel -= 1;
              requestHtmlRealignLevel();
            } else {
              // Every flow up to the topmost has finished. Move into reconciliation from here.
              requestHtmlPositions();
            }
          }
        } else if (data.type === 'positions') {
          console.log('DBG positions from ' + side, !!htmlAlignPositions);
          if (!htmlAlignPositions) return;
          htmlAlignPositions[side] = data.tops || {};
          if (htmlAlignPositions.left && htmlAlignPositions.right) {
            const L = htmlAlignPositions.left, R = htmlAlignPositions.right;
            // Walk only the blocks present on both sides, in order of their left-side position
            // (= document order).
            const keys = Object.keys(L).filter(k => R[k] !== undefined)
              .sort((a, b) => L[a] - L[b]);
            // Everything after gets shifted down by the padding added earlier. Carry that
            // accumulated amount forward and subtract it from the "currently observed
            // difference." Even a miss that crosses a flow boundary gets closed, since the
            // next round remeasures.
            let shiftL = 0, shiftR = 0, worst = 0;
            const fixL = [], fixR = [];
            for (const k of keys) {
              const d = (L[k] + shiftL) - (R[k] + shiftR);
              if (Math.abs(d) > worst) worst = Math.abs(d);
              if (Math.abs(d) <= HTML_ALIGN_TOLERANCE) continue;
              const [flow, index] = k.split(':');
              if (d > 0) { fixR.push({ flow, index, delta: Math.round(d) }); shiftR += d; }
              else { fixL.push({ flow, index, delta: Math.round(-d) }); shiftL += -d; }
            }
            htmlAlignPositions = null;
            if (worst <= HTML_ALIGN_TOLERANCE || htmlAlignRound >= HTML_ALIGN_MAX_ROUNDS) {
              finalizeHtmlAlign();
            } else {
              htmlAlignRound += 1;
              htmlAlignTotals = { left: null, right: null };
              postToHtmlFrame(htmlDiffFrameLeft, { type: 'correct', seq: htmlAlignSeq, list: fixL });
              postToHtmlFrame(htmlDiffFrameRight, { type: 'correct', seq: htmlAlignSeq, list: fixR });
            }
          }
        } else if (data.type === 'corrected') {
          if (!htmlAlignTotals) return;
          htmlAlignTotals[side] = data.total;
          if (htmlAlignTotals.left != null && htmlAlignTotals.right != null) {
            requestHtmlPositions(); // remeasure once more after closing the gap
          }
        }
      });

      // Start one round trip of reconciliation.
      function requestHtmlPositions() {
        if (!htmlSplitActive) return;
        htmlAlignPositions = { left: null, right: null };
        postToHtmlFrame(htmlDiffFrameLeft, { type: 'positions', seq: htmlAlignSeq });
        postToHtmlFrame(htmlDiffFrameRight, { type: 'positions', seq: htmlAlignSeq });
      }

      // Don't let the iframes themselves scroll, and keep a single scrollbar on the
      // #htmlSplitContainer side, by fitting each iframe's height exactly to its content height.
      function finalizeHtmlAlign() {
        if (!htmlAlignTotals) return;
        const h = Math.max(htmlAlignTotals.left || 0, htmlAlignTotals.right || 0) + 'px';
        htmlDiffFrameLeft.style.height = h;
        htmlDiffFrameRight.style.height = h;
        htmlSplitDivider.style.height = h;
        htmlLastAlignWidth = htmlSplitContainer.clientWidth;
      }

      // Each time it switches to side-by-side, the iframe reloads (renderHtmlView swaps out
      // srcdoc). Each time a load finishes (= each time the injected script inside becomes able
      // to run), treat that as a trigger to realign. During single-column display, or on a
      // transition to an empty about:blank, this is rejected by htmlSplitActive.
      htmlDiffFrameLeft.addEventListener('load', () => scheduleHtmlRealign());
      htmlDiffFrameRight.addEventListener('load', () => scheduleHtmlRealign());

      const restoreMonacoView = () => {
        // Restore Monaco's display (this doesn't cause a bug since it's not restoring from display: none)
        diffEditorContainer.style.position = '';
        diffEditorContainer.style.left = '';
        diffEditorContainer.style.visibility = '';

        richDiffViewer.style.display = 'none';
        hideMdToc(); // Also clear the TOC; don't leave its scroll subscription behind either
        htmlDiffFrame.style.display = 'none';
        htmlDiffFrame.removeAttribute('srcdoc');
        htmlSplitContainer.classList.remove('visible');
        htmlDiffFrameLeft.removeAttribute('srcdoc');
        htmlDiffFrameRight.removeAttribute('srcdoc');
        resetHtmlAlignState();

        if (typeof mdResizers !== 'undefined') {
          mdResizers.forEach(r => r.style.display = 'none');
        }

        changeActionsContainer.style.display = 'block';
        richDiffBtn.classList.remove('active');
        htmlViewBtn.classList.remove('active');
        isRichDiffView = false;
        richViewMode = null;
        updateJumpControlsVisibility();

        // Recompute layout just in case
        if (typeof diffEditor !== 'undefined' && diffEditor) {
          diffEditor.layout();
        }

        rebuildChangeActions();
        saveAutoSave();
      };

      // Run the ported rich-html-diff engine (buildDiff / DIFF_CSS etc.) against the raw
      // BEFORE/AFTER text of the pasted HTML, then assemble the result document as the
      // htmlDiffFrame srcdoc.
      // Render the HTML into a hidden measurement iframe to get a document with CSS
      // resolved. sandbox is 'allow-same-origin' only: the parent needs to read
      // contentDocument / getComputedStyle, but the pasted page's own scripts must
      // never run in this measurement frame (only the display frame runs them).
      // sandbox="" would make the frame an opaque origin and contentDocument unreadable.
      function stageDocument(html) {
        return new Promise((resolve, reject) => {
          const f = document.createElement('iframe');
          f.setAttribute('sandbox', 'allow-same-origin');
          f.setAttribute('aria-hidden', 'true');
          f.setAttribute('tabindex', '-1');
          f.style.cssText = 'position:absolute;left:-99999px;top:0;width:1200px;height:800px;border:0;visibility:hidden;';
          // Set srcdoc before inserting into the DOM. Setting it after insertion lets the
          // about:blank load's load event fire first, grabbing a document that's still
          // empty (this is what caused output to be truncated to 1.3KB in practice).
          f.srcdoc = html;

          const wantsContent = !!(html && html.trim());
          const deadline = Date.now() + 8000;
          const ready = () => {
            const doc = f.contentDocument;
            if (!doc || doc.readyState !== 'complete' || !doc.body) return false;
            // If content is expected but the doc is still empty, assume it's still at the about:blank stage and wait
            return !wantsContent || doc.body.children.length > 0 || !!doc.body.textContent.trim();
          };
          const poll = () => {
            if (ready()) { resolve({ frame: f, doc: f.contentDocument }); return; }
            if (!f.contentDocument) { removeStage(f); reject(new Error('staged document is not readable')); return; }
            if (Date.now() > deadline) { removeStage(f); reject(new Error('staging timed out')); return; }
            setTimeout(poll, 16);
          };
          document.body.appendChild(f);
          poll();
        });
      }
      function removeStage(f) { if (f && f.parentNode) f.parentNode.removeChild(f); }

      async function renderHtmlDiffDocument(bText, aText) {
        let oldStage = null, newStage = null;
        try {
          oldStage = await stageDocument(bText);
          newStage = await stageDocument(aText);
          const oldDoc = oldStage.doc, newDoc = newStage.doc;

          boundaryEls = new Set();
          classifiedDocs = new Set();
          classifyBlockBoundaries(oldDoc);
          classifyBlockBoundaries(newDoc);

          return buildHtmlDiffOutput(oldDoc, newDoc);
        } finally {
          boundaryEls = null;
          classifiedDocs = null;
          removeStage(oldStage && oldStage.frame);
          removeStage(newStage && newStage.frame);
        }
      }

      // Decide whether this is a "just stacks things top to bottom" vertical container
      // that we may treat as a valid corresponding block. If true, we may descend into
      // it, counting its children as belonging to "the same flow as now". Tables (table,
      // thead/tbody/tfoot, caption, cells) just stack rows vertically, so we treat them
      // as vertical stacking here too (only td/th inside a tr sit side by side).
      function isVerticalHtmlContainer(el) {
        const win = el.ownerDocument.defaultView;
        let d = null;
        try { d = win ? win.getComputedStyle(el).display : null; } catch (e) {}
        if (!d) return true; // if we can't read it, just trust source order
        if (d === 'flex' || d === 'inline-flex') {
          let fd = 'row';
          try { fd = win.getComputedStyle(el).flexDirection || 'row'; } catch (e) {}
          return fd.indexOf('column') === 0;
        }
        if (d === 'grid' || d === 'inline-grid' || d === 'table-row'
          || d === 'inline' || d === 'inline-block' || d === 'none') return false;
        if (d.indexOf('table') === 0) return true; // table/thead/tbody/tfoot/caption/cells
        return true;
      }

      // Decide whether this is a side-by-side container (a grid, a flex row, or a table
      // row). A true container emits itself as "one block of the current flow" in the
      // correspondence table, then descends into each child as the start of a new flow
      // (see the comment on collectHtmlSyncUnits). The rest, where
      // isVerticalHtmlContainer returns false (inline, inline-block, none, or anything
      // we can't determine), can't be treated as side-by-side either, so it stays a
      // single block we don't descend into, as before (the case where both
      // isVerticalHtmlContainer and isHtmlSplitContainer return false is exactly this
      // "give up" case).
      function isHtmlSplitContainer(el) {
        const win = el.ownerDocument.defaultView;
        let d = null;
        try { d = win ? win.getComputedStyle(el).display : null; } catch (e) {}
        if (!d) return false;
        if (d === 'flex' || d === 'inline-flex') {
          let fd = 'row';
          try { fd = win.getComputedStyle(el).flexDirection || 'row'; } catch (e) {}
          return fd.indexOf('column') !== 0;
        }
        if (d === 'grid' || d === 'inline-grid' || d === 'table-row') return true;
        return false;
      }

      // Detect the root of a table: a literal <table>, or an element styled to look like
      // one (display: table / inline-table), so a CSS table built from divs is caught too.
      // Used by collectHtmlSyncUnits to stop descent at the table (see the comment there
      // for why).
      function isHtmlTableRoot(el) {
        if (el.tagName === 'TABLE') return true;
        const win = el.ownerDocument.defaultView;
        let d = null;
        try { d = win ? win.getComputedStyle(el).display : null; } catch (e) {}
        return d === 'table' || d === 'inline-table';
      }

      // A block check dedicated to this section, used to compute "the text this element
      // directly owns". The diff engine's isBlockEl trusts the snapshot (boundaryEls)
      // taken before buildDiff runs, so it wrongly treats elements that appear only
      // after that check -- such as clones of deleted blocks that buildDiff inserts
      // later -- as "not a block" (measured: the deleted section's entire contents
      // leaked into main/nav's "own text", making hasOwnText true and stopping further
      // recursion). The block check here uses the same live getComputedStyle-based
      // criterion as isVerticalHtmlContainer/isHtmlSplitContainer to cut off this leak.
      // BLOCKISH_DISPLAY/BLOCK_TAGS are just read as-is from the constants already
      // defined on the diff engine side (the values used for the check are unchanged);
      // we don't touch the diff engine's own computation.
      function htmlSyncIsBlockish(el) {
        const win = el.ownerDocument.defaultView;
        let d = null;
        try { d = win ? win.getComputedStyle(el).display : null; } catch (e) {}
        return d ? BLOCKISH_DISPLAY.has(d) : BLOCK_TAGS.has(el.tagName);
      }
      function htmlSyncOwnText(el) {
        let text = '';
        for (let c = el.firstChild; c; c = c.nextSibling) {
          if (c.nodeType === 3) { text += c.data; continue; }
          if (c.nodeType !== 1) continue;
          const t = c.tagName;
          if (t === 'SCRIPT' || t === 'STYLE') continue;
          if (c.dataset && c.dataset.diff === 'del') continue; // don't count del blocks we inserted ourselves
          if (htmlSyncIsBlockish(c)) continue; // a nested block is its own unit, so exclude it
          text += htmlSyncOwnText(c);
        }
        return text;
      }

      // Recursively descend from body only into containers that can "safely be broken
      // apart vertically", and treat any element we can't descend into further as one
      // corresponding-block unit. The Markdown View's markSyncIndex only needs to look
      // at the pane's direct children (marked.parse's output is already a flat list of
      // blocks laid out vertically from the start), but pasted HTML often just wraps
      // everything directly under body in a single div, so looking only at direct
      // children collapses it to effectively one block (no per-section correspondence).
      // Descend wherever we can, down to the unit we actually want to match up.
      //
      // The "flow" concept: adding padding to equalize height only works between blocks
      // that sit in the same vertical flow (when `A | B` sit side by side, padding added
      // below A doesn't push B down -- this is a legitimate existing concern, and we
      // preserve it here too). So a vertical-stacking container descends into its
      // children, still counting them as the same flow, while a side-by-side container
      // (a grid, a flex row, a table row) emits itself as one block of its parent's
      // flow, then descends into each child as the start of a new flow. This way, nav
      // and main inside a grid each become independent flows, sections within main stay
      // properly aligned in the same flow so padding works correctly on them, and cards
      // laid out side by side each become their own independent flow so they don't drag
      // their neighbors along.
      //
      // The flow is recorded as data-sync-flow (left and right are built from the same
      // tree, so walking in a fixed order gives the same numbers on both sides), and the
      // running index within a flow (recounted from 0) is recorded as data-sync-index.
      // The side that aligns heights (ANCHOR_SCRIPT) must process deeper flows first,
      // because a side-by-side container's height changes as padding is added within its
      // inner flows; that depth is recorded in data-sync-depth.
      function collectHtmlSyncUnits(el, flow, depth, state) {
        if (depth > state.maxDepth) state.maxDepth = depth;
        const kids = [];
        for (let c = el.firstElementChild; c; c = c.nextElementSibling) {
          if (c.tagName === 'SCRIPT' || c.tagName === 'STYLE') continue;
          kids.push(c);
        }
        // If this element itself has inline content (child elements mixed with text),
        // don't break it apart any further. Breaking an element like
        // <p>text<ins>added</ins>more</p> down to just the <ins> would lose the
        // paragraph's position as a whole. The check here uses htmlSyncOwnText
        // (dedicated to this section, see the comment above).
        const hasOwnText = kids.length > 0 && norm(htmlSyncOwnText(el)) !== '';
        if (kids.length === 0 || hasOwnText) {
          markHtmlSyncUnit(el, flow, depth, state);
        } else if (isHtmlTableRoot(el)) {
          // A table used to be descended into like any other vertical container --
          // isVerticalHtmlContainer treats table/thead/tbody/tfoot/caption/cells as
          // "just stacks rows vertically" -- so each <tr> became a numbered unit in the
          // surrounding flow. Measured on diff-testcases/all-cases-before.html /
          // all-cases-after.html, section "表：行の増減": a row deleted only on the left
          // (index 40) grows a spacer after itself correctly, but a row inserted only on
          // the right (index 43) needs its spacer BEFORE it -- and climbLastChildChain,
          // walking the last-child chain to find where to plant that spacer, climbs
          // straight out of the table and plants it after the table instead of before the
          // new row inside it. The two tables ended up 206px (left) vs 279px (right) tall,
          // with the misplaced spacer sitting outside the table it "belongs" to, and the
          // correction pass patching the leftover gap back inside the table afterward. So
          // a table is now one block: never descended into, and no element inside it is
          // ever numbered, so no spacer can land inside one either. The table's own top
          // edge still lines up with its counterpart (it's a single unit of the
          // surrounding flow, same as a paragraph); the height difference is absorbed by
          // a spacer placed after the table, outside it, where nothing shows. Trade-off:
          // in a long table with an early insertion or deletion, later rows no longer
          // line up row-for-row between the panes -- accepted, since the point is to stop
          // rows being padded or table heights being fudged to force a match.
          markHtmlSyncUnit(el, flow, depth, state);
        } else if (isVerticalHtmlContainer(el)) {
          kids.forEach(c => collectHtmlSyncUnits(c, flow, depth, state));
        } else if (isHtmlSplitContainer(el)) {
          markHtmlSyncUnit(el, flow, depth, state); // the container itself is one block of the parent flow
          kids.forEach(c => {
            const childFlow = String(state.nextFlowId++);
            // A marker letting the aligning side find "the end (bottom) of this flow".
            c.dataset.syncFlowRoot = childFlow;
            collectHtmlSyncUnits(c, childFlow, depth + 1, state);
          });
        } else {
          // inline, inline-block, none, etc. -- can't be broken apart vertically or
          // horizontally. Treat it as one block, as before.
          markHtmlSyncUnit(el, flow, depth, state);
        }
      }

      function markHtmlSyncUnit(el, flow, depth, state) {
        const n = state.flowCounters.get(flow) || 0;
        state.flowCounters.set(flow, n + 1);
        el.dataset.syncFlow = flow;
        el.dataset.syncIndex = String(n);
        el.dataset.syncDepth = String(depth);
      }

      // Assign the corresponding blocks in the left/right panes a running index in
      // order of appearance (starting from 0 within each flow) as data-sync-index, and
      // the flow they belong to as data-sync-flow. Same idea as the Markdown View's
      // markSyncIndex: we assign these before stripping (i.e. while both left and right
      // are still just newDoc, reparsed and thinned by stripHtmlSide, and still share a
      // common layout), so this numbering directly becomes the left/right
      // correspondence table. There's no need to guess correspondence later from
      // on-screen position or height.
      // The return value is the flow's maximum depth (telling the aligning side how
      // many rounds of measure-and-apply it needs, since it must "process deeper flows
      // first").
      function markHtmlSyncIndex(body) {
        const state = { flowCounters: new Map(), nextFlowId: 1, maxDepth: 0 }; // 0 is reserved for the top-level (body) flow
        collectHtmlSyncUnits(body, '0', 0, state);
        return state.maxDepth;
      }

      function buildHtmlDiffOutput(oldDoc, newDoc) {
        buildDiff(oldDoc, newDoc);
        // Assign before stripping (before splitting into left/right). What's directly
        // under body in newDoc after buildDiff becomes the basis for single as-is, and
        // left/right are produced by reparsing and thinning that same string, so the
        // numbers assigned here survive identically on both sides. The return value
        // (the flow's maximum depth) goes back to the caller (openHtmlView) as the
        // number of stages the left/right height alignment needs, since it must
        // "process deeper flows first".
        const maxFlowDepth = markHtmlSyncIndex(newDoc.body);

        // Deleted blocks are clones of the old DOM, so they carry their id along. If the
        // same id remains on the new side, it's now duplicated, and getElementById
        // returns whichever comes first in document order -- the deleted one (deleted
        // blocks sit right before their pair). Anchor links, and the pasted document's
        // own scripts, would then grab the vanished element instead, so we treat the
        // surviving one as authoritative and stash the deleted side's id in
        // data-diff-old-id. For a section deleted in its entirety (no matching id on the
        // new side), leave the id as-is -- links to it should correctly land on the
        // deleted block, so we don't touch it.
        const dead = el => !!el.closest('[data-diff-block="del"], #__diff_removed__');
        const byId = new Map();
        newDoc.querySelectorAll('[id]').forEach(el => {
          const k = el.getAttribute('id');
          if (!k) return;
          if (!byId.has(k)) byId.set(k, []);
          byId.get(k).push(el);
        });
        byId.forEach(list => {
          if (list.length < 2) return;
          const keep = list.find(el => !dead(el)) || list[0];
          list.forEach(el => {
            if (el === keep) return;
            el.setAttribute('data-diff-old-id', el.getAttribute('id'));
            el.removeAttribute('id');
          });
        });

        // An about:srcdoc document inherits the base URL of its parent page (this tool
        // itself), so clicking a fragment-only link like href="#section" resolves to
        // <this tool's URL>#section, and the iframe ends up loading the entire tool
        // itself, breaking the diff display (confirmed on a real machine). We want to
        // keep using srcdoc as-is, so we defuse fragment-only links by stripping their
        // href and stashing it in data-diff-nolink. Absolute-URL external links and the
        // like are left untouched, still opening in a new tab as before.
        newDoc.querySelectorAll('a[href]').forEach(a => {
          const h = a.getAttribute('href');
          if (h && h.trim().charAt(0) === '#') { a.setAttribute('data-diff-nolink', h); a.removeAttribute('href'); }
        });

        // The marker color is baked into an opaque color against the document's
        // background color (see the comment on the DIFF_CSS definition). The staging
        // iframe (sandbox="allow-same-origin") is still alive at this point, so
        // getComputedStyle is usable.
        const styleEl = newDoc.createElement('style');
        styleEl.textContent = buildDiffCss(resolveDiffBase(newDoc));
        newDoc.head.appendChild(styleEl);

        // Just stripping the href leaves fragment links unclickable, so we embed a small
        // script that catches the click and scrolls instead. The display iframe is
        // sandbox="allow-scripts allow-popups" so it can run scripts, but newDoc is still
        // attached to the measurement sandbox iframe (no allow-scripts). Appending a
        // <script> here would make it try to run immediately, get blocked by the
        // sandbox, and leave an error in the console (harmless to the final look, but a
        // pointless error log). So we take the element's outerHTML as a plain string
        // without ever attaching it to the DOM, and splice it into the serialized HTML
        // right before the closing body tag.
        const navScript = newDoc.createElement('script');
        navScript.textContent = ANCHOR_SCRIPT;

        const html = '<!DOCTYPE html>\n' + newDoc.documentElement.outerHTML;
        const bodyClose = '</' + 'body>';
        const idx = html.lastIndexOf(bodyClose);
        const single = idx < 0 ? html + navScript.outerHTML
          : html.slice(0, idx) + navScript.outerHTML + html.slice(idx);

        // Both left and right displays are built on top of single (the HTML string as
        // assembled for the single-column display) as it stands here. The diff engine
        // (buildDiff) has already run exactly once, at the top of this function; from
        // here on it's just reparsing the string and thinning out elements, so calling
        // this on every open/close never triggers the heavy measurement work
        // (renderHtmlDiffDocument's two staged iframes).
        // Left (before): strips added blocks, added inline content, and empty cells
        // used for column alignment.
        // Right (after): strips deleted blocks, deleted inline content, and empty cells
        // used for column alignment.
        // [data-diff-attr] (elements whose attributes alone changed) is in neither
        // selector -- the element itself exists both before and after, so it stays on
        // both sides.
        const left = stripHtmlSide(single, '[data-diff-block="ins"], ins[data-diff="ins"], [data-diff-pad]', true);
        const right = stripHtmlSide(single, '[data-diff-block="del"], del[data-diff="del"], [data-diff-pad]', false);

        return { single, left, right, maxFlowDepth };
      }

      // Reparse single and strip elements matching selector, using the same idea as
      // stripMarked (never remove a table cell on its own; only remove a row once it's
      // entirely empty). Only when restoreOldId is true (i.e. when building the left,
      // before, side) do we restore the id that was stashed in data-diff-old-id. A
      // deleted block has ceded its id to the new (ins) side, so on the left, where we
      // strip that ins side away, we must restore data-diff-old-id back to id on the
      // remaining element, or the before side's in-page links break. The right (after)
      // side keeps whichever element originally held the id, so no restoration is
      // needed there.
      function stripHtmlSide(html, selector, restoreOldId) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        stripMarked(doc.body, selector);
        if (restoreOldId) {
          doc.body.querySelectorAll('[data-diff-old-id]').forEach(el => {
            const oldId = el.getAttribute('data-diff-old-id');
            if (oldId) el.setAttribute('id', oldId);
          });
        }
        return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
      }

      // A function that just redraws mdDiffedHtml (the sanitized diff HTML, built once)
      // into #richDiffViewer according to the current mode (single-column / split).
      // Never re-diff here. Switching single<->split just needs to call this.
      // After stripping out marks that exist on only one side, a container that held
      // only that content is left empty. Table rows are a case of this: on the side
      // where an added row is stripped, a row of bare borders is left sitting there,
      // showing something that wasn't in the before version. We look only at the
      // ancestors of removed elements and collapse the ones left with no content.
      // A container that was already empty to begin with (an empty cell like
      // `| A |  |`) is never a candidate, so it stays.
      function stripMarked(root, selector) {
        const suspects = new Set();
        root.querySelectorAll(selector).forEach(el => {
          for (let n = el.parentElement; n && n !== root; n = n.parentElement) suspects.add(n);
          el.remove();
        });
        const isEmpty = el => !el.textContent.trim() && !el.querySelector('img,svg,input,hr,br');
        const depth = el => { let d = 0; for (let n = el; n && n !== root; n = n.parentElement) d++; return d; };
        // Collapse from the innermost outward. root isn't attached to the DOM yet, so
        // isConnected can't be used to check liveness (it's always false); check
        // whether the element is still inside root instead.
        Array.from(suspects)
          .sort((a, b) => depth(b) - depth(a))
          .forEach(el => {
            if (!root.contains(el) || !isEmpty(el)) return;
            // Removing a table cell on its own breaks the column count. Only remove the row once the whole row is empty.
            if (el.tagName === 'TD' || el.tagName === 'TH') return;
            if (el.tagName === 'TR' && !Array.from(el.children).every(isEmpty)) return;
            el.remove();
          });
      }

      // Assign the left/right panes' top-level child elements a running index in order
      // of appearance, as data-sync-index. We assign this before stripMarked runs (i.e.
      // while both panes' structure is still identical to mdDiffedHtml), so this
      // numbering directly becomes the left/right correspondence table. There's no need
      // to guess correspondence later from on-screen position or height.
      function markSyncIndex(pane) {
        Array.from(pane.children).forEach((el, i) => { el.dataset.syncIndex = String(i); });
      }

      // ---- Aligning the left/right pane heights ----
      // The correspondence table is exactly the data-sync-index assigned by
      // markSyncIndex. Every time renderMarkdownView assembles the split display, it
      // stores the panes currently on screen here. When we return to single-column
      // display (reset to null on the renderMarkdownView side), the
      // realignMdSplit / ResizeObserver below all become no-ops, leaving no extra work
      // behind.
      let mdSplitLeftPane = null;
      let mdSplitRightPane = null;
      let mdSplitDivider = null;
      let mdLastAlignWidth = 0;
      let mdRealignQueued = false;

      // Ignore differences under 1px. There's no point aligning them, and this also
      // keeps sub-pixel jitter from getBoundingClientRect from spawning useless spacers.
      const ALIGN_EPS = 1;

      function clearAlignSpacers(pane) {
        pane.querySelectorAll('[data-align-spacer]').forEach(el => el.remove());
      }

      function insertSpacerAfter(pane, afterNode, height) {
        const spacer = document.createElement('div');
        spacer.dataset.alignSpacer = '';
        spacer.style.height = height + 'px';
        if (afterNode) afterNode.insertAdjacentElement('afterend', spacer);
        else pane.insertBefore(spacer, pane.firstChild);
        return spacer;
      }

      // The amount a block actually occupies vertically (the amount a padding div needs
      // to stand in for). Since .md-split-pane is set to flex-direction: column to stop
      // margin collapsing, plain getBoundingClientRect().height alone misses the
      // element's own margin-top / margin-bottom. Measure the "apparent occupied
      // height" by adding those two in.
      function blockExtent(el) {
        if (!el) return 0;
        const cs = getComputedStyle(el);
        return el.getBoundingClientRect().height + (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0);
      }

      // Measure the corresponding block's height on both sides, and add padding
      // (data-align-spacer) after the shorter one to equalize them. Every call first
      // removes all existing padding, then remeasures. Padding never changes width, so
      // adding it never affects any other block's height -- so one pass of "measure
      // everything, then insert everything" is enough (no need to repeat
      // measure-insert-measure).
      // divider is optional (e.g. right before the initial render, when the caller
      // doesn't have it yet). When it is passed, we directly set the divider's own
      // height here to match the two aligned columns' height (see the CSS-side comment
      // for why align-items can't just be set to stretch).
      function alignSplitPanes(leftPane, rightPane, divider) {
        clearAlignSpacers(leftPane);
        clearAlignSpacers(rightPane);

        // The running index markSyncIndex assigned before filtering directly becomes
        // the correspondence table. A block removed entirely by stripMarked leaves that
        // number missing from one side (or, in some cases, both).
        const leftByIndex = new Map();
        Array.from(leftPane.children).forEach(el => {
          if (el.dataset.syncIndex !== undefined) leftByIndex.set(Number(el.dataset.syncIndex), el);
        });
        const rightByIndex = new Map();
        Array.from(rightPane.children).forEach(el => {
          if (el.dataset.syncIndex !== undefined) rightByIndex.set(Number(el.dataset.syncIndex), el);
        });

        let maxIndex = -1;
        leftByIndex.forEach((_, idx) => { if (idx > maxIndex) maxIndex = idx; });
        rightByIndex.forEach((_, idx) => { if (idx > maxIndex) maxIndex = idx; });

        // First, measure everything. No spacer has been inserted yet, so the heights we
        // get here are "content only" heights -- fixed values unaffected by the
        // insertions we're about to do. blockExtent is the occupied height including
        // margin-top/margin-bottom (see the comment on the .md-split-pane definition
        // above for why).
        const rows = [];
        for (let idx = 0; idx <= maxIndex; idx++) {
          const l = leftByIndex.get(idx) || null;
          const r = rightByIndex.get(idx) || null;
          rows.push({ l, r, lh: blockExtent(l), rh: blockExtent(r) });
        }

        // Next, insert everything. The insertion point is "right after wherever the
        // last-processed index sat" (a real element, or a spacer we just inserted). On
        // the side where a number is missing, the spacer still occupies that spot, so
        // we never lose track of where the next index should be inserted.
        let leftCursor = null;
        let rightCursor = null;
        rows.forEach(({ l, r, lh, rh }) => {
          if (l && r) {
            // present on both sides: insert padding equal to the difference right after the shorter one
            const diff = lh - rh;
            if (diff > ALIGN_EPS) insertSpacerAfter(rightPane, r, diff);
            else if (diff < -ALIGN_EPS) insertSpacerAfter(leftPane, l, -diff);
            leftCursor = l;
            rightCursor = r;
          } else if (l && !r) {
            // missing on the right (an added block): insert padding at the same spot on the right, equal to the left block's height
            rightCursor = insertSpacerAfter(rightPane, rightCursor, lh);
            leftCursor = l;
          } else if (r && !l) {
            // missing on the left (a deleted block): insert padding at the same spot on the left, equal to the right block's height
            leftCursor = insertSpacerAfter(leftPane, leftCursor, rh);
            rightCursor = r;
          }
          // missing on both sides (a block made up entirely of ins/del content that was
          // removed from both) -- there's nothing to fill in the first place, so do nothing.
        });

        // Right after alignment, both columns' heights should be equal (modulo
        // floating-point error), so matching the taller one makes the divider reach
        // exactly to both sides.
        if (divider) {
          const h = Math.max(leftPane.getBoundingClientRect().height, rightPane.getBoundingClientRect().height);
          divider.style.height = h + 'px';
        }
      }

      // Images load late and their height changes afterward. Attach a one-shot
      // load/error listener only to <img> elements still loading, and realign once it fires.
      function watchImagesForRealign(pane) {
        pane.querySelectorAll('img').forEach(img => {
          if (img.complete) return;
          const onSettle = () => scheduleMdRealign();
          img.addEventListener('load', onSettle, { once: true });
          img.addEventListener('error', onSettle, { once: true });
        });
      }

      // Remeasure the current left/right panes. Do nothing while in single-column
      // display (mdSplitLeftPane is null), or when we're only holding a stale
      // reference already detached by a redraw.
      function realignMdSplit() {
        if (!mdSplitLeftPane || !mdSplitRightPane) return;
        if (!richDiffViewer.contains(mdSplitLeftPane)) return;
        alignSplitPanes(mdSplitLeftPane, mdSplitRightPane, mdSplitDivider);
        mdLastAlignWidth = richDiffViewer.clientWidth;
      }

      // Coalesce events that fire repeatedly in a short span (multiple images finishing
      // loading, etc.) into a single frame before remeasuring.
      function scheduleMdRealign() {
        if (mdRealignQueued) return;
        mdRealignQueued = true;
        requestAnimationFrame(() => { mdRealignQueued = false; realignMdSplit(); });
      }

      // Bridge this to an outer-scope variable so other scripts (applyTheme, the theme
      // switcher -- it lives outside the require callback and so can't call this
      // function group directly) can trigger a remeasure. THEMES currently only changes
      // colors, but this is here so we never miss it if font or border dimensions ever
      // change in the future.
      mdRealignHook = scheduleMdRealign;

      // Changing window width changes how blocks wrap, and hence their height. Watch
      // #richDiffViewer's own width with a ResizeObserver and remeasure (while in
      // single-column display, mdSplitLeftPane is null so this is a no-op on the
      // realignMdSplit side). To avoid running repeatedly when only height changed
      // without width changing (i.e. the effect of a spacer we inserted ourselves),
      // compare against the width from the last measurement before running -- this
      // avoids pointless work.
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => {
          if (!mdSplitLeftPane) return;
          if (richDiffViewer.clientWidth === mdLastAlignWidth) return;
          scheduleMdRealign();
        }).observe(richDiffViewer);
      }

      // ========== Markdown View TOC (Index) ==========
      // Not just a table of contents -- a "map of the changes". For each heading
      // (h1/h2/h3), a badge marks whether that section was added, deleted, changed
      // internally, or unchanged. Never re-diff here -- just build it from mdDiffedHtml
      // (the sanitized diff HTML, built once by openMarkdownView).
      const mdToc = document.getElementById('mdToc');
      const mdTocList = document.getElementById('mdTocList');
      const mdTocFoldBtn = document.getElementById('mdTocFold');
      const mdTocResizer = document.getElementById('mdTocResizer');

      let mdTocCollapsed = false;   // collapsed state. Remembered only for the session (not persisted)
      // The TOC's width (px) while open. Changes via dragging. --md-toc-w is written
      // only in these two places, updateMdToc and here (the drag handling below), so
      // this variable is the single source of truth for the value. Like mdTocCollapsed,
      // it's remembered only for the session and never persisted to localStorage.
      let mdTocOpenW = 190;
      const MD_TOC_MIN_W = 140; // never narrower than this
      const MD_TOC_MAX_W = 420; // never wider than this
      let mdTocEntries = [];        // the most recently built list of entries
      let mdTocBuiltHtml = null;    // which mdDiffedHtml mdTocEntries was built from (skip rebuilding if it's unchanged)
      let mdTocCurrentIndex = null; // the data-sync-index of the currently highlighted entry
      let mdTocScrollBound = false; // whether the scroll subscription on #richDiffViewer is still active
      let mdTocRafQueued = false;   // flag that coalesces current-position recalculation into a single rAF
      const MD_TOC_JUMP_MARGIN = 16; // margin so the target lands a bit below the top after a click-jump

      // Never identify ins/del by tag name. GFM's ~~strikethrough~~ becomes a <del>,
      // so checking by tag name would sweep up the document's own strikethroughs too.
      // Looking only at the class (diffins/diffmod/diffdel) is the same idea as stripMarked.
      const MD_TOC_INS_SEL = 'ins.diffins, ins.diffmod';
      const MD_TOC_DEL_SEL = 'del.diffdel, del.diffmod';
      const MD_TOC_MARK_SEL = MD_TOC_INS_SEL + ', ' + MD_TOC_DEL_SEL;

      // Extract an element's "before form" and "after form". If the element itself is
      // the target (e.g. a paragraph added/deleted in its entirety -- HtmlDiff
      // sometimes turns the top-level element itself into ins/del), don't count its contents at all.
      function mdTocStripText(el, selector) {
        if (el.matches(selector)) return '';
        const clone = el.cloneNode(true);
        clone.querySelectorAll(selector).forEach((n) => n.remove());
        return (clone.textContent || '').replace(/\s+/g, ' ').trim();
      }
      const mdTocBeforeText = (el) => mdTocStripText(el, MD_TOC_INS_SEL); // strip ins (the added part) = the before form
      const mdTocAfterText = (el) => mdTocStripText(el, MD_TOC_DEL_SEL);  // strip del (the deleted part) = the after form
      const mdTocHasMark = (el) => el.matches(MD_TOC_MARK_SEL) || !!el.querySelector(MD_TOC_MARK_SEL);
      const mdTocHasSide = (els, sel) => els.some((el) => el.matches(sel) || !!el.querySelector(sel));

      // The count of meaningful characters (letters or digits). Whitespace, symbols,
      // and punctuation aren't counted. Checking for letter-or-digit uses the same
      // criterion as the diff engine's identityOverlap.
      const mdTocWeight = (s) => ((s || '').match(/[\p{L}\p{N}]/gu) || []).length;

      // Split a heading's characters into three counts: added, deleted, and neither.
      // Whether a section counts as added/deleted overall is decided from this
      // breakdown (see the checks below).
      function mdTocHeadWeights(el) {
        const w = { ins: 0, del: 0, keep: 0 };
        const walk = (node, side) => {
          if (node.nodeType === 3) { w[side] += mdTocWeight(node.nodeValue); return; }
          if (node.nodeType !== 1) return;
          // ins/del are assumed never to nest, but giving priority to whichever side
          // was decided at the outer level means we still never double-count even if they do nest.
          let s = side;
          if (s === 'keep') {
            if (node.matches(MD_TOC_INS_SEL)) s = 'ins';
            else if (node.matches(MD_TOC_DEL_SEL)) s = 'del';
          }
          Array.from(node.childNodes).forEach((c) => walk(c, s));
        };
        walk(el, 'keep');
        return w;
      }

      // The threshold for treating a heading as "added/deleted as a whole section". If
      // everything in the heading other than the added (or deleted) part is at most
      // this fraction of the total, treat it as added/deleted in its entirety.
      const MD_TOC_GONE_RATIO = 0.25;

      // Pour mdDiffedHtml into a standalone container, assign a running index with
      // markSyncIndex, then split it into heading units. The numbering assigned here
      // follows exactly the same rule renderMarkdownView uses for the single-column
      // display and each split pane (top-level children, 0-based, in order of
      // appearance), so it can be reused directly as the jump-target key. Only
      // top-level children are considered (headings inside a blockquote or li are out of scope).
      function buildMdTocEntries() {
        if (mdDiffedHtml === null) return [];
        const container = document.createElement('div');
        container.innerHTML = mdDiffedHtml;
        markSyncIndex(container);

        // Treat everything from a heading up to just before the next heading as one section (including the heading itself).
        const sections = [];
        let cur = null;
        Array.from(container.children).forEach((el) => {
          const m = /^H([123])$/.exec(el.tagName);
          if (m) {
            cur = { level: Number(m[1]), heading: el, members: [el] };
            sections.push(cur);
          } else if (cur) {
            cur.members.push(el);
          }
        });

        return sections.flatMap((sec) => {
          // Whether a section counts as added/deleted is decided from the heading alone.
          // The TOC is a list of headings, so "was this entry present before / is it
          // present after" is directly what the badge means.
          // Deciding it from the section's contents breaks down. HtmlDiff diffs
          // character by character across paragraph boundaries, so a deleted tail from
          // the previous section can end up placed after the next section's heading.
          // Then a section that should have counted as newly added ends up counting the
          // previous section's leftovers as its own content, turning into "changed
          // inside" instead.
          //
          // But a heading can't be measured by "does it fall entirely on one side"
          // either. Since HtmlDiff works character by character, even a heading added in
          // its entirety can end up with characters that happen to match a heading that
          // was already there. In a numbered document, a heading number like "3.4 " is
          // exactly this case -- a newly created section kept turning into "changed
          // inside". So instead we look at the breakdown ratio -- if everything besides
          // the added part is negligible, treat it as a whole-section addition.
          const hw = mdTocHeadWeights(sec.heading);
          const total = hw.ins + hw.del + hw.keep;
          const headBefore = mdTocBeforeText(sec.heading);
          const headAfter = mdTocAfterText(sec.heading);

          // When a heading is made up entirely of "a wholly deleted part" and "a wholly
          // added part", this isn't a rewrite -- it's two separate headings merged into
          // one element. Replacing a section (deleting the old one and adding a new one)
          // always produces this shape. Showing it as a single "changed inside" line
          // would hide both the deleted section and the added section, so we emit two
          // lines instead, one for the deleted part and one for the added part. Both can
          // jump to the same element (they occupy the same spot in the document).
          if (hw.ins > 0 && hw.del > 0 && hw.keep <= total * MD_TOC_GONE_RATIO) {
            return [
              { level: sec.level, status: 'del', gone: true, label: headBefore, syncIndex: sec.heading.dataset.syncIndex },
              { level: sec.level, status: 'add', gone: false, label: headAfter, syncIndex: sec.heading.dataset.syncIndex },
            ];
          }

          // Whether a section is deleted as a whole (i.e. whether to strike through the
          // entry) is decided by the heading alone. A section that merely has a deletion
          // inside it must not be struck through.
          const gone = hw.del > 0 && hw.ins + hw.keep <= total * MD_TOC_GONE_RATIO;
          let status;
          if (hw.ins > 0 && hw.del + hw.keep <= total * MD_TOC_GONE_RATIO) status = 'add'; // added as a whole section
          else if (gone) status = 'del';                                                   // deleted as a whole section
          else {
            // A section whose heading is still there. The badge color is decided by
            // "what happened inside it". Coloring everything uniformly red-and-green
            // would put red on a section that only had something added, making it look
            // like something was deleted -- and in practice, someone actually pointed out that it looked that way.
            const ins = mdTocHasSide(sec.members, MD_TOC_INS_SEL);
            const del = mdTocHasSide(sec.members, MD_TOC_DEL_SEL);
            status = ins && del ? 'mod' : ins ? 'add' : del ? 'del' : 'none';
          }
          // Even when the heading text itself changed, only show the after text (only
          // for a whole-section deletion is the after text empty, in which case we use
          // the before text). As a fallback for the edge case where both are empty, fill
          // in from the other side -- an entry with the opposite text is still better
          // than one with no text at all in the TOC.
          const label = (gone ? headBefore : headAfter) || headBefore || headAfter;
          return [{ level: sec.level, status, gone, label, syncIndex: sec.heading.dataset.syncIndex }];
        });
      }

      // Rebuild the entry list's DOM (call only when entries' contents changed).
      function renderMdTocList() {
        mdTocList.innerHTML = '';
        mdTocCurrentIndex = null;
        mdTocEntries.forEach((entry) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'md-toc-i'
            + (entry.level === 3 ? ' lv3' : '')
            + (entry.gone ? ' removed' : '');
          item.dataset.syncIndex = entry.syncIndex;
          if (entry.label) item.title = entry.label; // long headings are truncated with an ellipsis, so the full text goes in title

          // The badge is a +/-/± mark. When unchanged, place nothing but still reserve
          // the space to keep text aligned (the slot itself stays, but no .md-toc-m goes inside it).
          const slot = document.createElement('span');
          slot.className = 'md-toc-slot';
          if (entry.status !== 'none') {
            const mark = document.createElement('i');
            mark.className = 'md-toc-m ' + (entry.status === 'add' ? 'add' : entry.status === 'del' ? 'del' : 'mod');
            // Always put the character in .glyph, and never give mark itself a
            // font-size (see the CSS-side comment: giving mark a font-size shifts what
            // width/height convert em units against too, and the badge collapses).
            const glyph = document.createElement('span');
            glyph.className = 'glyph';
            glyph.textContent = entry.status === 'add' ? '+'
              : entry.status === 'del' ? '−' // − (U+2212, not a hyphen)
              : '±';
            mark.appendChild(glyph);
            slot.appendChild(mark);
          }
          item.appendChild(slot);

          const label = document.createElement('span');
          label.className = 'md-toc-t';
          label.textContent = entry.label;
          item.appendChild(label);

          item.addEventListener('click', () => mdTocJumpTo(entry.syncIndex));
          mdTocList.appendChild(item);
        });
      }

      // Find, inside #richDiffViewer, the element corresponding to the jump-target key
      // (data-sync-index). In split view some sections exist on only one side, but
      // querySelector finds it regardless of which pane it's in, so the same call works
      // whether the target is in single-column or split display.
      function mdTocFindTarget(syncIndex) {
        return richDiffViewer.querySelector('[data-sync-index="' + syncIndex + '"]');
      }

      // Where a click on an entry jumps to. Scrolling belongs to #richDiffViewer itself
      // (even in split view, both sides share one scroll area), so we scroll it.
      // Leave a margin so the target lands a bit below the top.
      function mdTocJumpTo(syncIndex) {
        mdScrollTo(mdTocFindTarget(syncIndex), true);
      }

      // Both a TOC entry click and a diff jump land the same way, so this is
      // consolidated into one place. Returns the scroll position it actually settles
      // at. The diff jump side uses this value to check "has it been moved from there
      // since", so it needs to be the clamped value, including any clamping that
      // happened at the edge of the container.
      // A TOC click is a one-off move, so it's smooth; a diff jump is expected to be
      // clicked rapidly in succession, so it jumps instantly (with smooth scrolling, a
      // second press before landing would read the in-progress position, making the
      // sense of "current position" unreliable).
      function mdScrollTo(target, smooth) {
        if (!target) return -1;
        const delta = target.getBoundingClientRect().top - richDiffViewer.getBoundingClientRect().top;
        const max = Math.max(0, richDiffViewer.scrollHeight - richDiffViewer.clientHeight);
        const top = Math.max(0, Math.min(max, richDiffViewer.scrollTop + delta - MD_TOC_JUMP_MARGIN));
        richDiffViewer.scrollTo({ top, behavior: smooth ? 'smooth' : 'auto' });
        return top;
      }

      // ========== Markdown View diff jump ==========
      // Never make a content-less mark a jump target. HtmlDiff sometimes marks even the
      // newline at a block boundary (producing a zero-height element like
      // <ins>\n</ins>), and jumping there changes nothing on screen, so it looks like
      // "pressing the button does nothing". Having a letter or digit counts as content.
      // There are also image-only changes, so replaced elements count too.
      const MD_STOP_MEDIA_SEL = 'img, svg, video, canvas';
      const mdMarkHasContent = (el) =>
        /[\p{L}\p{N}]/u.test(el.textContent || '')
        || el.matches(MD_STOP_MEDIA_SEL) || !!el.querySelector(MD_STOP_MEDIA_SEL);

      // Walk up to the innermost block containing the mark, and make that the jump
      // target. The top-level chunk (the data-sync-index unit) must never be the jump
      // target -- a list or table counts as one block in its entirety, so if a change
      // is near the bottom of a long list, the jump lands far short of the change
      // (measured over 400px off). Nothing visibly changes at the landing spot, and it
      // looks like it "stopped somewhere unrelated".
      // For tables, the unit is tr, not td -- so multiple changed cells in one row are
      // handled in a single jump.
      const MD_STOP_LEAF_SEL = 'li, p, h1, h2, h3, h4, h5, h6, tr, pre, blockquote, dd, dt';
      function mdStopUnitOf(mark) {
        let el = mark;
        while (el && el !== richDiffViewer) {
          if (el.matches(MD_STOP_LEAF_SEL)) return el;
          // Never walk up past the chunk boundary. If no leaf is found, the chunk itself is the target.
          if (el.dataset && el.dataset.syncIndex !== undefined) return el;
          el = el.parentElement;
        }
        return null;
      }

      function mdDiffStops() {
        if (!isRichDiffView || richViewMode !== 'markdown') return [];
        const units = [];
        const seen = new Set();
        richDiffViewer.querySelectorAll(MD_TOC_MARK_SEL).forEach((mark) => {
          if (!mdMarkHasContent(mark)) return;
          const unit = mdStopUnitOf(mark);
          if (!unit || seen.has(unit)) return;
          seen.add(unit);
          units.push(unit);
        });
        // Sort by vertical position on screen. DOM order is left pane -> right pane, so
        // using it as-is would not give document order.
        // Also collapse entries that land at nearly the same height into one. In split view
        // the same change appears in both panes (deletion on the left, addition on the
        // right), but since heights are aligned they always land at the same position --
        // jumping to either gives the same result, so there is no need to stop twice.
        return units
          .map((el) => ({ el, top: el.getBoundingClientRect().top }))
          .sort((a, b) => a.top - b.top)
          .filter((u, i, arr) => i === 0 || Math.abs(u.top - arr[i - 1].top) >= 4)
          .map((u) => u.el);
      }

      // The target we jumped to last time, and the scroll position it settled at. Used to
      // judge the "current location" the next time the button is pressed. If a re-render
      // replaces the DOM, the reference goes stale, but stops.indexOf below then returns
      // -1 and falls back to position-based judgment, so there is no need to clear it
      // explicitly.
      let mdJumpLast = null;
      let mdJumpLastScroll = -1;

      function mdJumpToDiff(dir) {
        const stops = mdDiffStops();
        if (!stops.length) return;
        const viewerTop = richDiffViewer.getBoundingClientRect().top;
        const offsetOf = (el) => el.getBoundingClientRect().top - viewerTop;
        const last = stops.indexOf(mdJumpLast);
        // If we have not moved from the position we last landed on, treat ourselves as
        // still being there. If the user scrolled by hand it will not match, so this falls
        // through to re-locating by position.
        const parked = last >= 0 && Math.abs(richDiffViewer.scrollTop - mdJumpLastScroll) < 2;
        let target;

        if (parked) {
          // Move by index. Deciding purely by position gets stuck at the end of the
          // document -- there is no more room below for the scroll to move, so the next
          // chunk keeps being judged as "still further down" and we keep picking up the
          // same spot. With an index we can count to the end and wrap around at the edge
          // (same as the Monaco-side jump).
          target = stops[(last + (dir === 'next' ? 1 : -1) + stops.length) % stops.length];
        } else if (dir === 'next') {
          // The judgment line is aligned to MD_TOC_JUMP_MARGIN because the target lands
          // exactly at that position right after a jump. Measuring from the container's
          // top edge would pick the chunk we are currently on back up as "still further
          // down".
          target = stops.find((el) => offsetOf(el) > MD_TOC_JUMP_MARGIN + 2) || stops[0];
        } else {
          const prevs = stops.filter((el) => offsetOf(el) < MD_TOC_JUMP_MARGIN - 2);
          target = prevs.length ? prevs[prevs.length - 1] : stops[stops.length - 1];
        }

        mdJumpLast = target;
        mdJumpLastScroll = mdScrollTo(target, false);
      }

      // Follow the container's scroll and treat the heading currently straddling the
      // screen's top edge as the current position. Items are ordered by document
      // appearance, so we only need to find the last one among those "already above the
      // screen's top edge". If there is none (we have not yet reached even the first
      // heading), treat the first one as the current position.
      function updateMdTocHighlight() {
        const items = Array.from(mdTocList.children);
        if (!items.length) return;
        let current;
        // When we have scrolled all the way to the bottom, the content after the last
        // heading can be too short to reach the screen's top edge (e.g. when the document
        // ends right after the heading). Even so, since "there is no more below this",
        // treat the last item as the current position -- without this, we can end up at
        // the end of the document while the last item never becomes the current position.
        const atBottom = richDiffViewer.scrollTop + richDiffViewer.clientHeight >= richDiffViewer.scrollHeight - 2;
        if (atBottom) {
          current = items[items.length - 1];
        } else {
          // Align the judgment line to the position the target settles at after a click
          // jump. Measuring from exactly the container's top edge means that right after a
          // jump the target sits MD_TOC_JUMP_MARGIN below and does not reach the line, so
          // the previous item stays as the current position (this used to fix itself after
          // a small scroll).
          const topLine = richDiffViewer.getBoundingClientRect().top + MD_TOC_JUMP_MARGIN + 1;
          current = items[0];
          for (const item of items) {
            const target = mdTocFindTarget(item.dataset.syncIndex);
            if (target && target.getBoundingClientRect().top <= topLine) current = item;
          }
        }
        if (current.dataset.syncIndex === mdTocCurrentIndex) return; // Do nothing if there is no change
        mdTocCurrentIndex = current.dataset.syncIndex;
        items.forEach((item) => item.classList.toggle('current', item === current));
        // In documents with many items, the current position can be scrolled outside the
        // list, and highlighting it would then be invisible. Since it uses
        // block:'nearest', it does not move when the item is already visible.
        current.scrollIntoView({ block: 'nearest' });
      }

      // Coalesce events that fire repeatedly in a short span (e.g. continuous firing while
      // scrolling) into a single frame. Same idea as scheduleMdRealign in the Markdown
      // View.
      function scheduleMdTocHighlight() {
        if (mdTocRafQueued) return;
        mdTocRafQueued = true;
        requestAnimationFrame(() => { mdTocRafQueued = false; updateMdTocHighlight(); });
      }

      function mdTocBindScroll() {
        if (mdTocScrollBound) return;
        richDiffViewer.addEventListener('scroll', scheduleMdTocHighlight, { passive: true });
        mdTocScrollBound = true;
      }
      function mdTocUnbindScroll() {
        if (!mdTocScrollBound) return;
        richDiffViewer.removeEventListener('scroll', scheduleMdTocHighlight);
        mdTocScrollBound = false;
      }

      // Call this when closing the Markdown View, or for a document with no headings at
      // all. Removes the whole area including the collapsed band, and leaves no
      // subscription behind (since --md-toc-w is reset to 0, the margin calculation on the
      // .rich-diff-viewer side also reverts to the same formula as when there was no
      // TOC).
      function hideMdToc() {
        mdToc.classList.remove('visible');
        document.documentElement.style.setProperty('--md-toc-w', '0px');
        mdTocUnbindScroll();
        mdTocCurrentIndex = null;
      }

      // Call this every time renderMarkdownView redraws single-column <-> split. Since the
      // diff is not retaken, the item list is not rebuilt either if mdDiffedHtml is the
      // same as last time (so the TOC does not flicker on every single-column <-> split
      // round trip).
      function updateMdToc() {
        if (mdDiffedHtml === null) { hideMdToc(); return; }
        if (mdTocBuiltHtml !== mdDiffedHtml) {
          mdTocEntries = buildMdTocEntries();
          mdTocBuiltHtml = mdDiffedHtml;
          renderMdTocList();
        }
        // For a document with no headings at all, do not show the TOC area at all
        // (including the collapsed band).
        if (mdTocEntries.length === 0) { hideMdToc(); return; }

        mdToc.classList.add('visible');
        mdToc.classList.toggle('collapsed', mdTocCollapsed);
        mdTocFoldBtn.title = mdTocCollapsed ? '目次を開く' : '目次をたたむ';
        mdTocFoldBtn.textContent = mdTocCollapsed ? '›' : '‹';
        document.documentElement.style.setProperty('--md-toc-w', mdTocCollapsed ? '34px' : `${mdTocOpenW}px`);
        mdTocBindScroll();
        scheduleMdTocHighlight();
      }

      mdTocFoldBtn.addEventListener('click', () => {
        mdTocCollapsed = !mdTocCollapsed;
        mdToc.classList.toggle('collapsed', mdTocCollapsed);
        mdTocFoldBtn.title = mdTocCollapsed ? '目次を開く' : '目次をたたむ';
        mdTocFoldBtn.textContent = mdTocCollapsed ? '›' : '‹';
        document.documentElement.style.setProperty('--md-toc-w', mdTocCollapsed ? '34px' : `${mdTocOpenW}px`);
        // Changing the TOC width also changes the horizontal width left for the two
        // columns in split view, which can change the wrapping and therefore the height
        // too (#richDiffViewer's own clientWidth does not change, since the TOC only
        // overlaps it, so the existing ResizeObserver cannot catch this). scheduleMdRealign
        // just passes through while in single-column view (mdSplitLeftPane is null), so it
        // is fine to always call it.
        scheduleMdRealign();
      });

      // ========== Markdown View TOC width resize ==========
      // Drag the grab handle on the right edge (#mdTocResizer) to change the TOC's own
      // width (mdTocOpenW). Judged with a separate flag from isMdResizing used for
      // .md-resizer (the split pane widths) -- piggybacking on the same
      // mousemove/mouseup could tangle up the judgment of which drag is in progress.
      let isMdTocResizing = false;
      let mdTocDragLeft = 0; // TOC's left edge (px) measured at drag start. Does not move during the drag, so it is not re-measured on every mousemove.

      mdTocResizer.addEventListener('mousedown', () => {
        isMdTocResizing = true;
        mdTocDragLeft = mdToc.getBoundingClientRect().left;
        mdTocResizer.classList.add('dragging');
        document.body.classList.add('is-resizing');
      });

      document.addEventListener('mousemove', (e) => {
        if (!isMdTocResizing) return;
        let newWidth = e.clientX - mdTocDragLeft;
        if (newWidth < MD_TOC_MIN_W) newWidth = MD_TOC_MIN_W;
        if (newWidth > MD_TOC_MAX_W) newWidth = MD_TOC_MAX_W;
        mdTocOpenW = newWidth;
        // While dragging, only rewrite --md-toc-w. Doing the split-pane recalculation and
        // re-measuring the current position on every frame would be heavy, so those are
        // done together on mouseup.
        document.documentElement.style.setProperty('--md-toc-w', `${newWidth}px`);
      });

      document.addEventListener('mouseup', () => {
        if (!isMdTocResizing) return;
        isMdTocResizing = false;
        mdTocResizer.classList.remove('dragging');
        document.body.classList.remove('is-resizing');
        // Changing the width can change both the split panes' wrapping/height and the
        // TOC's current position, so re-measure both together once the drag ends.
        scheduleMdRealign();
        scheduleMdTocHighlight();
      });

      // When the window width changes, heading positions move too, so re-measure the
      // current position. When only the height changes without the width changing (i.e.
      // the effect of the spacer we inserted ourselves), to avoid running repeatedly this
      // is kept as a lightweight observer, separate from the existing realignMdSplit
      // ResizeObserver, that only runs while the TOC is showing.
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => {
          if (mdToc.classList.contains('visible')) scheduleMdTocHighlight();
        }).observe(richDiffViewer);
      }

      // ========== Split view column width resize ==========
      // Drag the divider (.md-split-divider) to change the left/right ratio. Kept as a
      // separate flag from the TOC width (isMdTocResizing) and the single-column body
      // width (isMdResizing) -- piggybacking on the same mousemove could tangle up the
      // judgment of which drag is in progress.
      const MD_SPLIT_MIN_W = 200; // Minimum width per side (px). Subtracting the column's left/right padding of 32px x 2 leaves 136px for the body text.
      let isMdSplitResizing = false;
      let mdSplitDragX = 0;      // Mouse position at drag start
      let mdSplitDragLeftW = 0;  // Left column width at drag start
      let mdSplitDragTotalW = 0; // Left column + right column width. Denominator of the ratio (does not include the divider's own width)

      function beginMdSplitResize(e) {
        if (!mdSplitLeftPane || !mdSplitRightPane) return;
        isMdSplitResizing = true;
        mdSplitDragX = e.clientX;
        mdSplitDragLeftW = mdSplitLeftPane.getBoundingClientRect().width;
        mdSplitDragTotalW = mdSplitDragLeftW + mdSplitRightPane.getBoundingClientRect().width;
        if (mdSplitDivider) mdSplitDivider.classList.add('dragging');
        document.body.classList.add('is-resizing');
      }

      document.addEventListener('mousemove', (e) => {
        if (!isMdSplitResizing) return;
        const max = mdSplitDragTotalW - MD_SPLIT_MIN_W;
        if (max < MD_SPLIT_MIN_W) return; // Too narrow to give both sides the minimum width (moving would be meaningless)
        let w = mdSplitDragLeftW + (e.clientX - mdSplitDragX);
        if (w < MD_SPLIT_MIN_W) w = MD_SPLIT_MIN_W;
        if (w > max) w = max;
        // While dragging, only rewrite the variable. Changing the column width changes the
        // wrapping and height of every block, and re-inserting the margins
        // (data-align-spacer) on every frame would be too heavy, so realignment is done
        // together on mouseup (same policy as the TOC width drag). While dragging it will
        // look slightly off with the previous margins still in place, but it lines up once
        // released.
        // Write the ratio as a unitless number. Writing it as a % would create a mismatch:
        // the CSS-side calc multiplies this ratio against "the width excluding the
        // divider", but converting to a % here would already include the divider, so the
        // two would use different bases.
        document.documentElement.style.setProperty('--md-split-ratio', String(w / mdSplitDragTotalW));
      });

      document.addEventListener('mouseup', () => {
        if (!isMdSplitResizing) return;
        isMdSplitResizing = false;
        if (mdSplitDivider) mdSplitDivider.classList.remove('dragging');
        document.body.classList.remove('is-resizing');
        // Changing the column width changes both the wrapping/height and the TOC's current position.
        scheduleMdRealign();
        scheduleMdTocHighlight();
      });

      function renderMarkdownView() {
        if (mdDiffedHtml === null) return;
        // Build the TOC first on every redraw (if --md-toc-w is not finalized here,
