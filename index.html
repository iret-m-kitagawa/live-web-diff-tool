        const origRect = origDom.getBoundingClientRect(); const modRect = modDom.getBoundingClientRect();
        const sashCenterX = ((origRect.right + modRect.left) / 2) - mainRect.left;
        const modScrollTop = diffMod.getScrollTop(); const origScrollTop = diffOrig.getScrollTop();
        const lineH = diffMod.getOption(monaco.editor.EditorOption.lineHeight);
        const editorTopInContainer = modRect.top - mainRect.top;

        changeElements.forEach(item => {
          const change = item.change; let midY;
          if (change.modifiedEndLineNumber === 0) {
            midY = (diffOrig.getTopForLineNumber(change.originalStartLineNumber) - origScrollTop + diffOrig.getTopForLineNumber(change.originalEndLineNumber) + lineH - origScrollTop) / 2 + editorTopInContainer;
          } else if (change.originalEndLineNumber === 0) {
            midY = (diffMod.getTopForLineNumber(change.modifiedStartLineNumber) - modScrollTop + diffMod.getTopForLineNumber(change.modifiedEndLineNumber) + lineH - modScrollTop) / 2 + editorTopInContainer;
          } else {
            midY = ((diffOrig.getTopForLineNumber(change.originalStartLineNumber) - origScrollTop + diffOrig.getTopForLineNumber(change.originalEndLineNumber) + lineH - origScrollTop + diffMod.getTopForLineNumber(change.modifiedStartLineNumber) - modScrollTop + diffMod.getTopForLineNumber(change.modifiedEndLineNumber) + lineH - modScrollTop) / 4) + editorTopInContainer;
          }
          if (midY < editorTopInContainer - 30 || midY > mainRect.height + 30) {
            item.el.style.display = 'none';
          } else {
            item.el.style.display = 'flex'; item.el.style.left = sashCenterX + 'px'; item.el.style.top = (midY - 10) + 'px';
          }
        });
      }

      let rafId; function onScroll() { cancelAnimationFrame(rafId); rafId = requestAnimationFrame(updateChangeActionsPosition); }
      document.getElementById('mainContainer').addEventListener('mousemove', (e) => {
        if (isInlineView || changeElements.length === 0) return;
        const origDom = diffOrig.getDomNode(); const modDom = diffMod.getDomNode();
        if (!origDom || !modDom) return;
        const origRect = origDom.getBoundingClientRect(); const modRect = modDom.getBoundingClientRect();
        const mouseX = e.clientX; const isNearSash = mouseX >= origRect.right - 40 && mouseX <= modRect.left + 40;
        changeElements.forEach(item => item.el.classList.toggle('visible', isNearSash));
      });
      document.getElementById('mainContainer').addEventListener('mouseleave', () => changeElements.forEach(item => item.el.classList.remove('visible')));

      function applyChangeToModified(change) {
        let textToInsert = ''; if (change.originalEndLineNumber !== 0) textToInsert = getOriginalLines(change.originalStartLineNumber, change.originalEndLineNumber);
        let range;
        if (change.modifiedEndLineNumber === 0) {
          const insertAt = change.modifiedStartLineNumber; const totalLines = afterModel.getLineCount();
          if (insertAt >= totalLines) {
            const lastLine = Math.max(1, totalLines); const lastCol = afterModel.getLineMaxColumn(lastLine);
            range = new monaco.Range(lastLine, lastCol, lastLine, lastCol); textToInsert = (lastLine === 1 && afterModel.getValue() === '' ? '' : '\n') + textToInsert;
          } else { range = new monaco.Range(insertAt + 1, 1, insertAt + 1, 1); textToInsert = textToInsert + '\n'; }
        } else {
          const startLine = change.modifiedStartLineNumber; const endLine = change.modifiedEndLineNumber;
          if (change.originalEndLineNumber === 0) {
            if (endLine < afterModel.getLineCount()) range = new monaco.Range(startLine, 1, endLine + 1, 1);
            else if (startLine > 1) range = new monaco.Range(startLine - 1, afterModel.getLineMaxColumn(startLine - 1), endLine, afterModel.getLineMaxColumn(endLine));
            else range = new monaco.Range(1, 1, endLine, afterModel.getLineMaxColumn(endLine));
          } else range = new monaco.Range(startLine, 1, endLine, afterModel.getLineMaxColumn(endLine));
        }
        afterModel.pushEditOperations([], [{ range, text: textToInsert }], () => null);
      }

      function applyChangeToOriginal(change) {
        let textToInsert = ''; if (change.modifiedEndLineNumber !== 0) textToInsert = getModifiedLines(change.modifiedStartLineNumber, change.modifiedEndLineNumber);
        let range;
        if (change.originalEndLineNumber === 0) {
          const insertAt = change.originalStartLineNumber; const totalLines = beforeModel.getLineCount();
          if (insertAt >= totalLines) {
            const lastLine = Math.max(1, totalLines); const lastCol = beforeModel.getLineMaxColumn(lastLine);
            range = new monaco.Range(lastLine, lastCol, lastLine, lastCol); textToInsert = (lastLine === 1 && beforeModel.getValue() === '' ? '' : '\n') + textToInsert;
          } else { range = new monaco.Range(insertAt + 1, 1, insertAt + 1, 1); textToInsert = textToInsert + '\n'; }
        } else {
          const startLine = change.originalStartLineNumber; const endLine = beforeModel.getLineCount();
          if (change.modifiedEndLineNumber === 0) {
            if (endLine < beforeModel.getLineCount()) range = new monaco.Range(startLine, 1, endLine + 1, 1);
            else if (startLine > 1) range = new monaco.Range(startLine - 1, beforeModel.getLineMaxColumn(startLine - 1), endLine, beforeModel.getLineMaxColumn(endLine));
            else range = new monaco.Range(1, 1, endLine, beforeModel.getLineMaxColumn(endLine));
          } else range = new monaco.Range(startLine, 1, change.originalEndLineNumber, beforeModel.getLineMaxColumn(change.originalEndLineNumber));
        }
        beforeModel.pushEditOperations([], [{ range, text: textToInsert }], () => null);
      }

      function getOriginalLines(start, end) { const lines = []; for (let i = start; i <= end; i++) lines.push(beforeModel.getLineContent(i)); return lines.join('\n'); }
      function getModifiedLines(start, end) { const lines = []; for (let i = start; i <= end; i++) lines.push(afterModel.getLineContent(i)); return lines.join('\n'); }

      diffEditor.onDidUpdateDiff(rebuildChangeActions);
      diffOrig.onDidScrollChange(onScroll); diffMod.onDidScrollChange(onScroll);
      window.addEventListener('resize', rebuildChangeActions);

      setTimeout(() => {
        const origNode = document.querySelector('.editor.original'); const modNode = document.querySelector('.editor.modified');
        if (origNode) origNode.appendChild(document.getElementById('beforePlaceholder'));
        if (modNode) modNode.appendChild(document.getElementById('afterPlaceholder'));
        updatePlaceholders();
      }, 100);

      document.getElementById('langSelect').addEventListener('change', (e) => {
        const lang = e.target.value; monaco.editor.setModelLanguage(beforeModel, lang); monaco.editor.setModelLanguage(afterModel, lang);
        saveAutoSave();
      });

      // ========== 👁️ Markdown View / HTML View 機能 ==========
      const richDiffBtn = document.getElementById('richDiffBtn');
      const htmlViewBtn = document.getElementById('htmlViewBtn');
      const diffEditorContainer = document.getElementById('diffEditor');
      const richDiffViewer = document.getElementById('richDiffViewer');
      const htmlDiffFrame = document.getElementById('htmlDiffFrame');
      const htmlSplitContainer = document.getElementById('htmlSplitContainer');
      const htmlDiffFrameLeft = document.getElementById('htmlDiffFrameLeft');
      const htmlDiffFrameRight = document.getElementById('htmlDiffFrameRight');
      const htmlSplitDivider = document.getElementById('htmlSplitDivider');
      const changeActionsContainer = document.getElementById('changeActions');
      const jumpControls = document.querySelector('.jump-controls');

      // 差分ジャンプのボタンを出すかどうか。判断の材料が3つ（どのビューか、
      // 1列か左右か）に散っていて呼ぶ場所も多いので、1箇所にまとめておく。
      //   Monaco     … 左右分割のときだけ。1列表示では行単位の飛び先が定まらない
      //   Markdown   … 1列・左右のどちらでも出す
      //   HTML View  … 未対応なので出さない
      function updateJumpControlsVisibility() {
        if (!jumpControls) return;
        const show = isRichDiffView ? richViewMode === 'markdown' : !isInlineView;
        jumpControls.style.display = show ? 'flex' : 'none';
      }

      // ---- HTML View 左右ペインの高さ揃え ----
      // Markdown View の alignSplitPanes と考え方は同じ（対応するブロックの
      // 高さを揃えて、1 つのスクロール領域に 2 列を収める）。違うのは、iframe
      // に allow-same-origin を付けていないため、親からは中を直接測ることも
      // 余白を差し込むこともできない点。かわりに、各 iframe に注入している
      // ANCHOR_SCRIPT へ「測って親に伝える／親に言われたとおり余白を入れる」
      // 役を持たせ（定義は ANCHOR_SCRIPT 側）、ここではその両側から届いた数字を
      // 突き合わせて指示を出すだけに徹する。
      let htmlSplitActive = false;   // 左右表示中か。false の間はこの節が
                                      // すべて素通りする（mdSplitLeftPane が
                                      // null のときの realignMdSplit と同じ扱い）。
      let htmlAlignSeq = 0;           // 世代番号。古い返信を無視するために使う
      let htmlAlignMeasured = null;   // { left, right } 両方届いたら次の段階へ
      let htmlAlignTotals = null;     // { left, right } 両方届いたら高さを確定する
      let htmlRealignQueued = false;
      let htmlLastAlignWidth = 0;
      let htmlSyncMaxDepth = 0;       // 今の対応表にある「流れ」の最大の深さ（openHtmlView で設定）
      let htmlAlignLevel = 0;         // 今のサイクルで処理中の深さ（htmlSyncMaxDepth → 0 の順）
      // 段階ごとの処理が終わったあとの答え合わせ。事前の測定値だけでは
      // 合わせきれない（余白を入れるとマージンの相殺が壊れて、入れた量より
      // 余計に伸びることがある）ので、実際に来た位置を突き合わせて数回寄せる。
      let htmlAlignPositions = null;  // { left, right } 両方届いたら差を計算する
      let htmlAlignRound = 0;         // 答え合わせの回数
      const HTML_ALIGN_MAX_ROUNDS = 3;
      const HTML_ALIGN_TOLERANCE = 2; // これ以下のずれは詰めない（詰めても揺れるだけ）

      // サンドボックス化した iframe の中へ postMessage で指示を送る。
      // targetOrigin は '*' 固定（相手が allow-same-origin 無しの不透明オリジン
      // なので、実オリジンを指定しても厳密一致が成立せず届かない）。
      function postToHtmlFrame(frame, msg) {
        if (!frame.contentWindow) return;
        msg.__htmlAlign = true;
        frame.contentWindow.postMessage(msg, '*');
      }

      // 両方の iframe に「入っている余白を消してから測り直して送れ」と指示し、
      // 一番深い流れから順に揃えていくサイクルを開始する。幅が変わった/
      // テーマが変わった/文字サイズが変わった/画像の遅延読み込みがあった、
      // など「揃え直しが要る場面」はすべてここへ合流させる。世代番号を
      // 進めておくことで、古い世代への返信（前のサイクルの途中でまた別の
      // トリガーが起きた場合など）を安全に無視できる。
      function requestHtmlRealign() {
        if (!htmlSplitActive) return;
        htmlAlignSeq += 1;
        htmlAlignLevel = htmlSyncMaxDepth;
        htmlAlignMeasured = { left: null, right: null };
        htmlAlignTotals = null;
        htmlAlignPositions = null;
        htmlAlignRound = 0;
        postToHtmlFrame(htmlDiffFrameLeft, { type: 'remeasure', seq: htmlAlignSeq, level: htmlAlignLevel, first: true });
        postToHtmlFrame(htmlDiffFrameRight, { type: 'remeasure', seq: htmlAlignSeq, level: htmlAlignLevel, first: true });
      }

      // 1 段階ぶん（今の htmlAlignLevel）だけを測り直す。深い流れの器の高さは
      // その中の流れに余白を入れた結果で変わるため、1 段階処理し終えるたびに
      // 呼び直し、浅い流れへ進む（横に並べる器は親の流れの単位でもあり、中に
      // 別の流れも抱えているので、順番を逆にすると器の高さを測ったあとで
      // 中身が伸びて、補った量が合わなくなる ── 深い流れから先に処理する
      // 理由はここにある）。余白は消さない（data.first を立てない）。
      function requestHtmlRealignLevel() {
        htmlAlignMeasured = { left: null, right: null };
        htmlAlignTotals = null;
        postToHtmlFrame(htmlDiffFrameLeft, { type: 'remeasure', seq: htmlAlignSeq, level: htmlAlignLevel });
        postToHtmlFrame(htmlDiffFrameRight, { type: 'remeasure', seq: htmlAlignSeq, level: htmlAlignLevel });
      }

      // 短時間に何度も発火するイベント（左右の iframe が相次いで load するなど）
      // を 1 フレームにまとめてから揃え直す。Markdown View の scheduleMdRealign
      // と同じ考え方。
      function scheduleHtmlRealign() {
        if (!htmlSplitActive) return;
        if (htmlRealignQueued) return;
        htmlRealignQueued = true;
        requestAnimationFrame(() => { htmlRealignQueued = false; requestHtmlRealign(); });
      }
      // テーマ / 文字サイズの変更ハンドラ（このスクリプトより前で定義済み）から
      // 揃え直しを起こせるよう橋渡しする（Markdown View の mdRealignHook と同じ
      // 仕組み）。
      htmlRealignHook = scheduleHtmlRealign;

      // 器の幅が変わると、貼り付けたページ自身の折り返しが変わり、高さも変わる。
      // #htmlSplitContainer 自体の幅を ResizeObserver で監視して揃え直す
      // （1列表示中は htmlSplitActive が false なので scheduleHtmlRealign 側で
      // 素通りする）。
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => {
          if (!htmlSplitActive) return;
          if (htmlSplitContainer.clientWidth === htmlLastAlignWidth) return;
          scheduleHtmlRealign();
        }).observe(htmlSplitContainer);
      }

      // 左右表示を離れるとき（1列に戻る / Monaco に戻る）に呼ぶ。余計な購読は
      // 残っていない（イベントリスナーはこの 2 つの iframe 要素に固定で
      // 付けているだけで、srcdoc を外せば中のスクリプトごと消える）が、
      // 状態と iframe の高さ指定は明示的に元へ戻しておく。
      function resetHtmlAlignState() {
        htmlSplitActive = false;
        htmlAlignSeq += 1; // 進行中のサイクルの返信をすべて無効化する
        htmlAlignMeasured = null;
        htmlAlignTotals = null;
        htmlAlignLevel = 0;
        htmlRealignQueued = false;
        htmlLastAlignWidth = 0;
        htmlDiffFrameLeft.style.height = '';
        htmlDiffFrameRight.style.height = '';
        htmlSplitDivider.style.height = '';
      }

      // 届くメッセージの origin はサンドボックスの都合で "null" になるため、
      // origin では正当性を判定できない。event.source が自分が作った 2 つの
      // iframe の contentWindow のどちらかであることだけを見て判定し、
      // それ以外（素性の知れない window）は無視する。
      window.addEventListener('message', (e) => {
        const side = e.source === htmlDiffFrameLeft.contentWindow ? 'left'
          : e.source === htmlDiffFrameRight.contentWindow ? 'right' : null;
        if (!side) return;
        const data = e.data;
        if (!data || data.__htmlAlign !== true) return;
        if (!htmlSplitActive) return;

        if (data.type === 'settled') {
          // 画像の遅延読み込みなど、iframe の中で自発的に高さが変わったという
          // 知らせ。世代を進めて両方から測り直す。
          scheduleHtmlRealign();
          return;
        }
        if (data.seq !== htmlAlignSeq) return; // 前の世代への返信は無視する
        // 段階（深さ）の照合は、段階ごとのやり取りにだけ効かせる。答え合わせの
        // やり取り（positions / corrected）は段階に属さないので、ここで弾くと
        // 返信がすべて捨てられる。
        if ((data.type === 'measured' || data.type === 'aligned')
          && data.level !== htmlAlignLevel) return;

        if (data.type === 'measured') {
          if (!htmlAlignMeasured) return;
          htmlAlignMeasured[side] = { total: data.total, blocks: data.blocks || {} };
          if (htmlAlignMeasured.left && htmlAlignMeasured.right) {
            // 両方の測定値が揃った。互いの相手の値をそのまま渡し、実際に
            // どこへ余白を入れるかの判断は各 iframe 側（applyLevelAlign）に任せる。
            const leftBlocks = htmlAlignMeasured.left.blocks;
            const rightBlocks = htmlAlignMeasured.right.blocks;
            htmlAlignTotals = { left: null, right: null };
            postToHtmlFrame(htmlDiffFrameLeft, { type: 'apply', seq: htmlAlignSeq, level: htmlAlignLevel, counterpart: rightBlocks });
            postToHtmlFrame(htmlDiffFrameRight, { type: 'apply', seq: htmlAlignSeq, level: htmlAlignLevel, counterpart: leftBlocks });
          }
        } else if (data.type === 'aligned') {
          if (!htmlAlignTotals) return;
          htmlAlignTotals[side] = data.total;
          if (htmlAlignTotals.left != null && htmlAlignTotals.right != null) {
            if (htmlAlignLevel > 0) {
              // まだ浅い流れが残っている。今の段階で入れた余白ぶん器が伸びた
              // かもしれないので、1 つ浅い段階を測り直しからやり直す。
              htmlAlignLevel -= 1;
              requestHtmlRealignLevel();
            } else {
              // 最上位の流れまで終わった。ここから答え合わせに入る。
              requestHtmlPositions();
            }
          }
        } else if (data.type === 'positions') {
          console.log('DBG positions from ' + side, !!htmlAlignPositions);
          if (!htmlAlignPositions) return;
          htmlAlignPositions[side] = data.tops || {};
          if (htmlAlignPositions.left && htmlAlignPositions.right) {
            const L = htmlAlignPositions.left, R = htmlAlignPositions.right;
            // 両方に居るブロックだけを、左の位置の順（＝文書の順）に見ていく。
            const keys = Object.keys(L).filter(k => R[k] !== undefined)
              .sort((a, b) => L[a] - L[b]);
            // 手前に足した余白のぶん、以降は下へずれる。足した量を持ち回って
            // 「いま見えている差」から引く。流れをまたいでも、次の回で測り直す
            // ので取りこぼしは寄せられる。
            let shiftL = 0, shiftR = 0, worst = 0;
            const fixL = [], fixR = [];
            for (const k of keys) {
              const d = (L[k] + shiftL) - (R[k] + shiftR);
              if (Math.abs(d) > worst) worst = Math.abs(d);
              if (Math.abs(d) <= HTML_ALIGN_TOLERANCE) continue;
              const [flow, index] = k.split(':');
              if (d > 0) { fixR.push({ flow, index, delta: Math.round(d) }); shiftR += d; }
              else { fixL.push({ flow, index, delta: Math.round(-d) }); shiftL += -d; }
            }
            htmlAlignPositions = null;
            if (worst <= HTML_ALIGN_TOLERANCE || htmlAlignRound >= HTML_ALIGN_MAX_ROUNDS) {
              finalizeHtmlAlign();
            } else {
              htmlAlignRound += 1;
              htmlAlignTotals = { left: null, right: null };
              postToHtmlFrame(htmlDiffFrameLeft, { type: 'correct', seq: htmlAlignSeq, list: fixL });
              postToHtmlFrame(htmlDiffFrameRight, { type: 'correct', seq: htmlAlignSeq, list: fixR });
            }
          }
        } else if (data.type === 'corrected') {
          if (!htmlAlignTotals) return;
          htmlAlignTotals[side] = data.total;
          if (htmlAlignTotals.left != null && htmlAlignTotals.right != null) {
            requestHtmlPositions(); // 詰めた結果をもう一度測り直す
          }
        }
      });

      // 答え合わせの 1 往復を始める。
      function requestHtmlPositions() {
        if (!htmlSplitActive) return;
        htmlAlignPositions = { left: null, right: null };
        postToHtmlFrame(htmlDiffFrameLeft, { type: 'positions', seq: htmlAlignSeq });
        postToHtmlFrame(htmlDiffFrameRight, { type: 'positions', seq: htmlAlignSeq });
      }

      // iframe 自身はスクロールさせず、#htmlSplitContainer 側でスクロールバーを
      // 1 本にするため、各 iframe の高さを中身の高さぴったりに合わせる。
      function finalizeHtmlAlign() {
        if (!htmlAlignTotals) return;
        const h = Math.max(htmlAlignTotals.left || 0, htmlAlignTotals.right || 0) + 'px';
        htmlDiffFrameLeft.style.height = h;
        htmlDiffFrameRight.style.height = h;
        htmlSplitDivider.style.height = h;
        htmlLastAlignWidth = htmlSplitContainer.clientWidth;
      }

      // 左右表示に切り替わるたびに iframe が読み込み直される（renderHtmlView が
      // srcdoc を差し替える）。読み込みが終わるたび（＝中の注入スクリプトが
      // 動き出せる状態になるたび）に揃え直しの起点とする。1列表示中や、まだ
      // 中身の無い about:blank への遷移のときは htmlSplitActive で弾かれる。
      htmlDiffFrameLeft.addEventListener('load', () => scheduleHtmlRealign());
      htmlDiffFrameRight.addEventListener('load', () => scheduleHtmlRealign());

      const restoreMonacoView = () => {
        // Monacoの表示を元に戻す (display: none からの復帰ではないためバグが発生しない)
        diffEditorContainer.style.position = '';
        diffEditorContainer.style.left = '';
        diffEditorContainer.style.visibility = '';

        richDiffViewer.style.display = 'none';
        hideMdToc(); // 目次も一緒に消す。購読(scroll)も残さない
        htmlDiffFrame.style.display = 'none';
        htmlDiffFrame.removeAttribute('srcdoc');
        htmlSplitContainer.classList.remove('visible');
        htmlDiffFrameLeft.removeAttribute('srcdoc');
        htmlDiffFrameRight.removeAttribute('srcdoc');
        resetHtmlAlignState();

        if (typeof mdResizers !== 'undefined') {
          mdResizers.forEach(r => r.style.display = 'none');
        }

        changeActionsContainer.style.display = 'block';
        richDiffBtn.classList.remove('active');
        htmlViewBtn.classList.remove('active');
        isRichDiffView = false;
        richViewMode = null;
        updateJumpControlsVisibility();

        // 念のためレイアウト再計算
        if (typeof diffEditor !== 'undefined' && diffEditor) {
          diffEditor.layout();
        }

        rebuildChangeActions();
        saveAutoSave();
      };

      // 貼り付けた HTML の生 BEFORE/AFTER テキストに対して、ported された
      // rich-html-diff エンジン (buildDiff / DIFF_CSS ほか) を実行し、
      // htmlDiffFrame の srcdoc として結果ドキュメントを組み立てる。
      // 計測用の隠し iframe に HTML を描画して、CSS が解決された document を得る。
      // sandbox は 'allow-same-origin' のみ: 親から contentDocument /
      // getComputedStyle を読む必要がある一方、貼り付けたページのスクリプトは
      // この計測用フレームでは絶対に実行させない（実行するのは表示用フレームだけ）。
      // sandbox="" にすると不透明オリジンになり contentDocument が読めなくなる。
      function stageDocument(html) {
        return new Promise((resolve, reject) => {
          const f = document.createElement('iframe');
          f.setAttribute('sandbox', 'allow-same-origin');
          f.setAttribute('aria-hidden', 'true');
          f.setAttribute('tabindex', '-1');
          f.style.cssText = 'position:absolute;left:-99999px;top:0;width:1200px;height:800px;border:0;visibility:hidden;';
          // srcdoc は DOM 挿入より前に設定する。挿入してから設定すると、挿入時の
          // about:blank ロードで load イベントが先に発火し、中身が空のドキュメントを
          // つかんでしまう（実際にそれで出力が 1.3KB に欠落した）。
          f.srcdoc = html;

          const wantsContent = !!(html && html.trim());
          const deadline = Date.now() + 8000;
          const ready = () => {
            const doc = f.contentDocument;
            if (!doc || doc.readyState !== 'complete' || !doc.body) return false;
            // 中身があるはずなのに空なら、まだ about:blank 段階と判断して待つ
            return !wantsContent || doc.body.children.length > 0 || !!doc.body.textContent.trim();
          };
          const poll = () => {
            if (ready()) { resolve({ frame: f, doc: f.contentDocument }); return; }
            if (!f.contentDocument) { removeStage(f); reject(new Error('staged document is not readable')); return; }
            if (Date.now() > deadline) { removeStage(f); reject(new Error('staging timed out')); return; }
            setTimeout(poll, 16);
          };
          document.body.appendChild(f);
          poll();
        });
      }
      function removeStage(f) { if (f && f.parentNode) f.parentNode.removeChild(f); }

      async function renderHtmlDiffDocument(bText, aText) {
        let oldStage = null, newStage = null;
        try {
          oldStage = await stageDocument(bText);
          newStage = await stageDocument(aText);
          const oldDoc = oldStage.doc, newDoc = newStage.doc;

          boundaryEls = new Set();
          classifiedDocs = new Set();
          classifyBlockBoundaries(oldDoc);
          classifyBlockBoundaries(newDoc);

          return buildHtmlDiffOutput(oldDoc, newDoc);
        } finally {
          boundaryEls = null;
          classifiedDocs = null;
          removeStage(oldStage && oldStage.frame);
          removeStage(newStage && newStage.frame);
        }
      }

      // 対応するブロックとして扱ってよい「上から下へ積み重なっているだけ」の
      // 縦に積む器かどうかを判定する。true なら中へ潜って良く、子は「今と
      // 同じ流れ」に属したまま数える。表（table・thead/tbody/tfoot・
      // caption・セル）は行が縦に積み重なるだけなので、ここでは縦積み扱いに
      // する（横に並ぶのは tr の中の td/th だけ）。
      function isVerticalHtmlContainer(el) {
        const win = el.ownerDocument.defaultView;
        let d = null;
        try { d = win ? win.getComputedStyle(el).display : null; } catch (e) {}
        if (!d) return true; // 取得できないときは並び順をそのまま信じる
        if (d === 'flex' || d === 'inline-flex') {
          let fd = 'row';
          try { fd = win.getComputedStyle(el).flexDirection || 'row'; } catch (e) {}
          return fd.indexOf('column') === 0;
        }
        if (d === 'grid' || d === 'inline-grid' || d === 'table-row'
          || d === 'inline' || d === 'inline-block' || d === 'none') return false;
        if (d.indexOf('table') === 0) return true; // table/thead/tbody/tfoot/caption/セル
        return true;
      }

      // 横に並べる器（grid・flex の行・表の行）かどうかを判定する。true の器は
      // 自分自身を「今の流れの 1 ブロック」として対応表に出したうえで、子
      // それぞれを新しい流れの起点として中へ降りる（collectHtmlSyncUnits 側の
      // コメント参照）。isVerticalHtmlContainer が false を返す残り
      // （inline・inline-block・none・判定できないもの）は、横並びとしても
      // 扱いようが無いので、これまでどおり中へは入らない 1 ブロックのまま
      // にする（isVerticalHtmlContainer と isHtmlSplitContainer が両方 false
      // になる場合が、その「諦める」ケース）。
      function isHtmlSplitContainer(el) {
        const win = el.ownerDocument.defaultView;
        let d = null;
        try { d = win ? win.getComputedStyle(el).display : null; } catch (e) {}
        if (!d) return false;
        if (d === 'flex' || d === 'inline-flex') {
          let fd = 'row';
          try { fd = win.getComputedStyle(el).flexDirection || 'row'; } catch (e) {}
          return fd.indexOf('column') !== 0;
        }
        if (d === 'grid' || d === 'inline-grid' || d === 'table-row') return true;
        return false;
      }

      // 「自分自身が直接持つ文字列」を求めるための、この節専用のブロック
      // 判定。diff エンジンの isBlockEl は buildDiff を実行する前に取った
      // スナップショット（boundaryEls）をそのまま信じるため、buildDiff が
      // あとから挿し込む削除ブロックの複製など「判定後に現れた要素」を
      // 誤って「ブロックではない」と見なしてしまう（実測: main/nav の
      // 「自分の文字列」に、削除された節の中身がまるごと漏れて拾われ、
      // hasOwnText が真になって以後の再帰が止まっていた）。ここでの
      // ブロック判定は isVerticalHtmlContainer/isHtmlSplitContainer と同じ、
      // その場で getComputedStyle を見る基準にして、この漏れを断つ。
      // BLOCKISH_DISPLAY/BLOCK_TAGS は diff エンジン側で定義済みの定数
      // （判定に使う値そのものは変えない）をそのまま読むだけで、diff エンジン
      // の計算処理そのものには手を入れない。
      function htmlSyncIsBlockish(el) {
        const win = el.ownerDocument.defaultView;
        let d = null;
        try { d = win ? win.getComputedStyle(el).display : null; } catch (e) {}
        return d ? BLOCKISH_DISPLAY.has(d) : BLOCK_TAGS.has(el.tagName);
      }
      function htmlSyncOwnText(el) {
        let text = '';
        for (let c = el.firstChild; c; c = c.nextSibling) {
          if (c.nodeType === 3) { text += c.data; continue; }
          if (c.nodeType !== 1) continue;
          const t = c.tagName;
          if (t === 'SCRIPT' || t === 'STYLE') continue;
          if (c.dataset && c.dataset.diff === 'del') continue; // 自分が挿入した del は数えない
          if (htmlSyncIsBlockish(c)) continue; // 入れ子のブロックはそれ自体が別単位なので含めない
          text += htmlSyncOwnText(c);
        }
        return text;
      }

      // body から再帰的に「安全に縦へ分解できる」コンテナだけを潜り、それ以上
      // 潜れない要素を対応ブロックの単位として扱う。Markdown View の
      // markSyncIndex は pane の直接の子だけを見れば済む（marked.parse の出力は
      // 最初からブロックが横に並んでいるだけの平らな列）が、貼り付けられた
      // HTML は body 直下を 1 枚の div で包んでいるだけのことが多く、直接の子
      // だけを見ても実質 1 ブロックにしかならない（節ごとの対応が取れない）。
      // 潜れるところは潜って、実際に対応づけたい単位まで降りる。
      //
      // 「流れ」という考え方: 余白を入れて高さを揃えられるのは、同じ縦の
      // 流れに並んでいるブロックどうしだけ（`A | B` が横に並んでいるとき、
      // A の下に余白を足しても B は下がらない ── これは正しい既存の懸念で、
      // ここでも維持する）。だから縦に積む器は中へ降りて同じ流れのまま数え、
      // 横に並べる器（grid・flex の行・表の行）は自分自身を親の流れの 1
      // ブロックとして出したうえで、子それぞれを新しい流れの起点として中へ
      // 降りる。こうすると、grid の中の nav と main はそれぞれ独立した流れ
      // になり、main の中の節どうしはちゃんと同じ流れに並ぶので余白がその
      // まま効く。カードが横に並ぶ箇所も、カードごとに独立した流れになる
      // ので隣のカードを巻き込まない。
      //
      // 流れは data-sync-flow（左右は同じ木から作るので、決まった順で辿れば
      // 両側で同じ番号になる）、流れの中の通し番号（0 から数え直す）は
      // data-sync-index に持たせる。揃える側（ANCHOR_SCRIPT）は、横に並べる
      // 器の高さが中の流れに余白を入れた結果で変わるため、深い流れから先に
      // 処理する必要がある。その深さを data-sync-depth に持たせておく。
      function collectHtmlSyncUnits(el, flow, depth, state) {
        if (depth > state.maxDepth) state.maxDepth = depth;
        const kids = [];
        for (let c = el.firstElementChild; c; c = c.nextElementSibling) {
          if (c.tagName === 'SCRIPT' || c.tagName === 'STYLE') continue;
          kids.push(c);
        }
        // 自分自身がインライン内容を持つ（子要素とテキストが混ざっている）なら、
        // それ以上分解しない。<p>本文<ins>追加</ins>続き</p> のような要素を
        // <ins> だけに分解すると、段落全体としての位置を失ってしまう。
        // ここでの判定は htmlSyncOwnText（この節専用、上のコメント参照）を使う。
        const hasOwnText = kids.length > 0 && norm(htmlSyncOwnText(el)) !== '';
        if (kids.length === 0 || hasOwnText) {
          markHtmlSyncUnit(el, flow, depth, state);
        } else if (isVerticalHtmlContainer(el)) {
          kids.forEach(c => collectHtmlSyncUnits(c, flow, depth, state));
        } else if (isHtmlSplitContainer(el)) {
          markHtmlSyncUnit(el, flow, depth, state); // 器自身は親の流れの1ブロック
          kids.forEach(c => {
            const childFlow = String(state.nextFlowId++);
            // 揃える側が「この流れの終端（下端）」を求めるための目印。
            c.dataset.syncFlowRoot = childFlow;
            collectHtmlSyncUnits(c, childFlow, depth + 1, state);
          });
        } else {
          // inline・inline-block・none など、縦にも横にも分解しようが無いもの。
          // これまでどおり1ブロックのまま扱う。
          markHtmlSyncUnit(el, flow, depth, state);
        }
      }

      function markHtmlSyncUnit(el, flow, depth, state) {
        const n = state.flowCounters.get(flow) || 0;
        state.flowCounters.set(flow, n + 1);
        el.dataset.syncFlow = flow;
        el.dataset.syncIndex = String(n);
        el.dataset.syncDepth = String(depth);
      }

      // 左右ペインの対応ブロックへ、出現順の通し番号（流れごとに 0 から）を
      // data-sync-index として、所属する流れを data-sync-flow として振って
      // おく。Markdown View の markSyncIndex と同じ考え方で、取り除く前
      // （＝ left/right どちらも newDoc から stripHtmlSide で再パース・間引くだけの、
      // まだ共通の並びをしている段階）で振るので、この番号がそのまま左右の対応表に
      // なる。あとから見た目の位置や高さから対応関係を推測する必要はない。
      // 戻り値は流れの最大深さ（揃える側が「深い流れから先に処理する」ために
      // 何段階の測定・適用を繰り返せばよいかを示す）。
      function markHtmlSyncIndex(body) {
        const state = { flowCounters: new Map(), nextFlowId: 1, maxDepth: 0 }; // 0 は最上位(body)の流れとして予約済み
        collectHtmlSyncUnits(body, '0', 0, state);
        return state.maxDepth;
      }

      function buildHtmlDiffOutput(oldDoc, newDoc) {
        buildDiff(oldDoc, newDoc);
        // 取り除く前（left/right に分かれる前）に振る。buildDiff 後の newDoc の
        // body 直下がそのまま single の土台になり、left/right はこれを文字列ごと
        // 再パースして間引くだけなので、ここで振った番号は両方に同じ形で残る。
        // 戻り値（流れの最大深さ）は左右の高さ揃えが「深い流れから先に処理する」
        // ために必要な段階数として、呼び出し側（openHtmlView）へ持ち帰る。
        const maxFlowDepth = markHtmlSyncIndex(newDoc.body);

        // 削除ブロックは古い DOM の複製なので id ごと持ち込む。新しい側に同じ id が
        // 残っていると重複し、getElementById は文書順で先にある削除側を返してしまう
        // （削除ブロックは対の直前に置かれる）。アンカーリンクも、貼り付けた文書自身の
        // スクリプトも消えた方を掴むことになるので、生き残っている方を正として
        // 削除側の id は data-diff-old-id に退避する。丸ごと削除された節（新しい側に
        // 同じ id が無い）の id はそのまま残す ── そこへのリンクは削除ブロックに
        // 飛ぶのが正しいので触らない。
        const dead = el => !!el.closest('[data-diff-block="del"], #__diff_removed__');
        const byId = new Map();
        newDoc.querySelectorAll('[id]').forEach(el => {
          const k = el.getAttribute('id');
          if (!k) return;
          if (!byId.has(k)) byId.set(k, []);
          byId.get(k).push(el);
        });
        byId.forEach(list => {
          if (list.length < 2) return;
          const keep = list.find(el => !dead(el)) || list[0];
          list.forEach(el => {
            if (el === keep) return;
            el.setAttribute('data-diff-old-id', el.getAttribute('id'));
            el.removeAttribute('id');
          });
        });

        // about:srcdoc ドキュメントは親ページ（このツール自身）の base URL を継承するため、
        // href="#section" のようなフラグメントのみのリンクをクリックすると
        // <このツールの URL>#section に解決されてしまい、iframe がツール自身を丸ごと
        // 読み込んで差分表示が壊れる（実機で確認済み）。srcdoc はそのまま使い続けたいので、
        // フラグメントのみのリンクは href を外して data-diff-nolink に退避し無害化する。
        // 絶対 URL の外部リンクなどはそのまま残し、従来どおり新しいタブで開けるようにする。
        newDoc.querySelectorAll('a[href]').forEach(a => {
          const h = a.getAttribute('href');
          if (h && h.trim().charAt(0) === '#') { a.setAttribute('data-diff-nolink', h); a.removeAttribute('href'); }
        });

        // マーカー色は文書の地の色に焼き込んだ不透明色にする（DIFF_CSS 定義側のコメント参照）。
        // ステージング用 iframe（sandbox="allow-same-origin"）はこの時点でまだ生きているので
        // getComputedStyle が使える。
        const styleEl = newDoc.createElement('style');
        styleEl.textContent = buildDiffCss(resolveDiffBase(newDoc));
        newDoc.head.appendChild(styleEl);

        // フラグメントリンクは href を外してあるだけでは押せないので、クリックを
        // 拾ってスクロールさせる小さなスクリプトを埋め込む。表示用 iframe は
        // sandbox="allow-scripts allow-popups" なので実行できるが、newDoc は
        // まだ計測用のサンドボックス iframe（allow-scripts なし）に接続されたまま。
        // ここへ <script> を appendChild すると、その場で実行を試みて sandbox に
        // 止められコンソールにエラーが残ってしまう（最終的な見た目には影響しないが
        // 無駄なエラーログになる）。要素は DOM に繋がずに outerHTML だけ文字列として
        // 取り出し、シリアライズ済みの HTML に対して body の閉じタグの直前へ差し込む。
        const navScript = newDoc.createElement('script');
        navScript.textContent = ANCHOR_SCRIPT;

        const html = '<!DOCTYPE html>\n' + newDoc.documentElement.outerHTML;
        const bodyClose = '</' + 'body>';
        const idx = html.lastIndexOf(bodyClose);
        const single = idx < 0 ? html + navScript.outerHTML
          : html.slice(0, idx) + navScript.outerHTML + html.slice(idx);

        // 左右表示の 2 通りは、ここまでで組み上がった single（1列表示そのままの
        // HTML 文字列）を土台にする。差分エンジン（buildDiff）はこの関数の先頭で
        // 既に 1 回動いただけで、ここから先は文字列を再パースして要素を間引くだけ
        // なので、開閉のたびに呼んでも重い計測処理（renderHtmlDiffDocument の
        // iframe 2 枚立て）は走らない。
        // 左（変更前）: 追加ブロック・追加インライン・列そろえ用の空セルを除く。
        // 右（変更後）: 削除ブロック・削除インライン・列そろえ用の空セルを除く。
        // [data-diff-attr]（属性だけ変わった要素）はどちらの選択子にも含めない
        // ── 要素そのものは変更前にも変更後にも存在するので、両側に残す。
        const left = stripHtmlSide(single, '[data-diff-block="ins"], ins[data-diff="ins"], [data-diff-pad]', true);
        const right = stripHtmlSide(single, '[data-diff-block="del"], del[data-diff="del"], [data-diff-pad]', false);

        return { single, left, right, maxFlowDepth };
      }

      // single を再パースし、selector に一致する要素を stripMarked と同じ考え方
      // （表のセルは単体で消さず、行が丸ごと空になったときだけ行を消す）で取り除く。
      // restoreOldId が真のとき（左＝変更前を作るとき）だけ、data-diff-old-id に
      // 退避されていた id を戻す。削除ブロックは id を新しい側（ins）に譲って
      // いるので、その ins 側を取り除く左では、残った要素の data-diff-old-id を
      // id に戻さないと変更前側のページ内リンクが切れる。右（変更後）は id を
      // 持っていた側がそのまま残るので戻す必要がない。
      function stripHtmlSide(html, selector, restoreOldId) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        stripMarked(doc.body, selector);
        if (restoreOldId) {
          doc.body.querySelectorAll('[data-diff-old-id]').forEach(el => {
            const oldId = el.getAttribute('data-diff-old-id');
            if (oldId) el.setAttribute('id', oldId);
          });
        }
        return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
      }

      // mdDiffedHtml（sanitize 済みの diff HTML、1 回だけ作る）を現在のモード
      // （1列 / 左右）に応じて #richDiffViewer に描き直すだけの関数。
      // ここでは絶対に差分を取り直さない。1列⇄左右の切り替えは全部これを呼ぶだけでよい。
      // 片側だけに存在する印を取り除いたあと、その中身しか持っていなかった器が
      // 空のまま残る。表の行がこれに当たり、追加された行を取り除いた側に
      // 罫線だけの行が居座って、変更前には無かったものが見えてしまう。
      // 取り除いた要素の祖先だけを見て、中身が無くなったものを畳む。
      // 元から空だった器（`| A |  |` のような空セル）は候補に入らないので残る。
      function stripMarked(root, selector) {
        const suspects = new Set();
        root.querySelectorAll(selector).forEach(el => {
          for (let n = el.parentElement; n && n !== root; n = n.parentElement) suspects.add(n);
          el.remove();
        });
        const isEmpty = el => !el.textContent.trim() && !el.querySelector('img,svg,input,hr,br');
        const depth = el => { let d = 0; for (let n = el; n && n !== root; n = n.parentElement) d++; return d; };
        // 内側から順に畳む。root はまだ DOM に繋がっていないので、生死の判定に
        // isConnected は使えない（常に false になる）。root の中に居るかで見る。
        Array.from(suspects)
          .sort((a, b) => depth(b) - depth(a))
          .forEach(el => {
            if (!root.contains(el) || !isEmpty(el)) return;
            // 表のセルを単体で消すと桁が崩れる。行ごと空になったときだけ行を消す。
            if (el.tagName === 'TD' || el.tagName === 'TH') return;
            if (el.tagName === 'TR' && !Array.from(el.children).every(isEmpty)) return;
            el.remove();
          });
      }

      // 左右ペインのトップレベル子要素へ、出現順の通し番号を data-sync-index として
      // 振っておく。stripMarked をかける前（＝両ペインの構造が mdDiffedHtml と
      // 完全に同一な段階）で振るので、この番号がそのまま左右の対応表になる。
      // あとから見た目の位置や高さから対応関係を推測する必要はない。
      function markSyncIndex(pane) {
        Array.from(pane.children).forEach((el, i) => { el.dataset.syncIndex = String(i); });
      }

      // ---- 左右ペインの高さ揃え ----
      // 対応表は markSyncIndex で振った data-sync-index そのもの。renderMarkdownView
      // が左右表示を組み立てるたびに、いま画面に出ているペインをここへ持たせておく。
      // 1列表示に戻ったとき（renderMarkdownView 側で null に戻す）は、以下の
      // realignMdSplit / ResizeObserver がすべて素通りになり、余計な処理は残らない。
      let mdSplitLeftPane = null;
      let mdSplitRightPane = null;
      let mdSplitDivider = null;
      let mdLastAlignWidth = 0;
      let mdRealignQueued = false;

      // 1px 未満の差は無視する。揃える意味が無いうえ、getBoundingClientRect の
      // 小数点以下の揺れで無駄な spacer が増えるのを防ぐ。
      const ALIGN_EPS = 1;

      function clearAlignSpacers(pane) {
        pane.querySelectorAll('[data-align-spacer]').forEach(el => el.remove());
      }

      function insertSpacerAfter(pane, afterNode, height) {
        const spacer = document.createElement('div');
        spacer.dataset.alignSpacer = '';
        spacer.style.height = height + 'px';
        if (afterNode) afterNode.insertAdjacentElement('afterend', spacer);
        else pane.insertBefore(spacer, pane.firstChild);
        return spacer;
      }

      // ブロックが実際に縦方向へ占めている量（余白 div が肩代わりすべき量）。
      // .md-split-pane を flex-direction: column にしてマージン相殺を止めて
      // あるので、素の getBoundingClientRect().height だけでは自身の
      // margin-top / margin-bottom ぶんが漏れる。その2つを足した「見た目の
      // 占有高さ」で測る。
      function blockExtent(el) {
        if (!el) return 0;
        const cs = getComputedStyle(el);
        return el.getBoundingClientRect().height + (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0);
      }

      // 対応するブロックの高さを両側で測り、低いほうへ余白（data-align-spacer）
      // を足して揃える。呼ぶたびに、まず入っている余白を全部取り除いてから測り
      // 直す。余白は幅を変えないので、入れても他のブロックの高さには影響しない
      // ── だから「全部測る → 全部入れる」の 1 往復で足りる（測って入れてまた
      // 測る、を繰り返す必要はない）。
      // divider は省略可（呼び出し元がまだ持っていない初回描画の直前など）。
      // 渡された場合は、揃え終わった 2 列の高さに合わせて仕切り線自身の高さも
      // ここで直接指定する（align-items を stretch にできない理由は CSS 側の
      // コメントを参照）。
      function alignSplitPanes(leftPane, rightPane, divider) {
        clearAlignSpacers(leftPane);
        clearAlignSpacers(rightPane);

        // markSyncIndex がフィルタ前に振った通し番号がそのまま対応表になる。
        // stripMarked で丸ごと消えたブロックは、その番号がどちらか片方
        // （場合によっては両方）から欠番になる。
        const leftByIndex = new Map();
        Array.from(leftPane.children).forEach(el => {
          if (el.dataset.syncIndex !== undefined) leftByIndex.set(Number(el.dataset.syncIndex), el);
        });
        const rightByIndex = new Map();
        Array.from(rightPane.children).forEach(el => {
          if (el.dataset.syncIndex !== undefined) rightByIndex.set(Number(el.dataset.syncIndex), el);
        });

        let maxIndex = -1;
        leftByIndex.forEach((_, idx) => { if (idx > maxIndex) maxIndex = idx; });
        rightByIndex.forEach((_, idx) => { if (idx > maxIndex) maxIndex = idx; });

        // まず全部測る。spacer はまだ 1 つも入れていないので、ここで得る高さは
        // 「元の内容だけ」の高さ＝これから行う挿入の影響を受けない確定値になる。
        // blockExtent は margin-top/margin-bottom を含めた占有高さ（理由は
        // 上の .md-split-pane 定義のコメントを参照）。
        const rows = [];
        for (let idx = 0; idx <= maxIndex; idx++) {
          const l = leftByIndex.get(idx) || null;
          const r = rightByIndex.get(idx) || null;
          rows.push({ l, r, lh: blockExtent(l), rh: blockExtent(r) });
        }

        // 次に全部入れる。挿入先は「直前まで処理した番号が占めていた場所（本物
        // の要素、または直前に入れた spacer）の直後」。番号が欠番の側でも spacer
        // がその場所を占めるので、次の番号を挿入すべき位置を見失わない。
        let leftCursor = null;
        let rightCursor = null;
        rows.forEach(({ l, r, lh, rh }) => {
          if (l && r) {
            // 両側にある: 差の分だけ、低いほうの直後に余白を入れる
            const diff = lh - rh;
            if (diff > ALIGN_EPS) insertSpacerAfter(rightPane, r, diff);
            else if (diff < -ALIGN_EPS) insertSpacerAfter(leftPane, l, -diff);
            leftCursor = l;
            rightCursor = r;
          } else if (l && !r) {
            // 右側に無い（追加ブロック）: 右側の同じ位置に、左のブロック高さぶんの余白
            rightCursor = insertSpacerAfter(rightPane, rightCursor, lh);
            leftCursor = l;
          } else if (r && !l) {
            // 左側に無い（削除ブロック）: 左側の同じ位置に、右のブロック高さぶんの余白
            leftCursor = insertSpacerAfter(leftPane, leftCursor, rh);
            rightCursor = r;
          }
          // 両側とも無い（ins/del だけで構成されていたブロックが両方から消えた
          // 場合）は、そもそも埋めるものが無いので何もしない。
        });

        // 揃え終わった直後は両列の高さが（浮動小数点の誤差を除けば）等しい
        // はずなので、高いほうに合わせておけば仕切り線が両側にぴったり届く。
        if (divider) {
          const h = Math.max(leftPane.getBoundingClientRect().height, rightPane.getBoundingClientRect().height);
          divider.style.height = h + 'px';
        }
      }

      // 画像は読み込みが遅れて高さが後から変わる。読み込み中の <img> にだけ
      // 一度きりの load/error 監視を付け、届いたら揃え直す。
      function watchImagesForRealign(pane) {
        pane.querySelectorAll('img').forEach(img => {
          if (img.complete) return;
          const onSettle = () => scheduleMdRealign();
          img.addEventListener('load', onSettle, { once: true });
          img.addEventListener('error', onSettle, { once: true });
        });
      }

      // 現在の左右ペインを測り直す。1列表示中（mdSplitLeftPane が null）や、
      // 描き直しで既に切り離された古い参照を掴んでいるだけのときは何もしない。
      function realignMdSplit() {
        if (!mdSplitLeftPane || !mdSplitRightPane) return;
        if (!richDiffViewer.contains(mdSplitLeftPane)) return;
        alignSplitPanes(mdSplitLeftPane, mdSplitRightPane, mdSplitDivider);
        mdLastAlignWidth = richDiffViewer.clientWidth;
      }

      // 短時間に何度も発火するイベント（複数画像の読み込み完了など）を 1 フレーム
      // にまとめてから測り直す。
      function scheduleMdRealign() {
        if (mdRealignQueued) return;
        mdRealignQueued = true;
        requestAnimationFrame(() => { mdRealignQueued = false; realignMdSplit(); });
      }

      // ほかのスクリプト（テーマ切り替えの applyTheme。require コールバックの
      // 外側にあるため、この関数群を直接は呼べない）から測り直しを起こせるよう、
      // 外側スコープの変数へ橋渡ししておく。いまの THEMES は色しか変えないが、
      // 文字や罫線の寸法が変わる可能性を将来にわたって取りこぼさないため。
      mdRealignHook = scheduleMdRealign;

      // ウィンドウ幅が変わるとブロックの折り返しが変わり、高さも変わる。
      // #richDiffViewer 自体の幅を ResizeObserver で監視して測り直す（1列表示中は
      // mdSplitLeftPane が null なので realignMdSplit 側で素通りする）。幅が
      // 変わっていないのに高さだけ変化した場合（＝自分で入れた spacer 自身の
      // 影響）で何度も走らないよう、前回測ったときの幅と比べてから走らせる
      // ── 無駄打ちを避けるため。
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => {
          if (!mdSplitLeftPane) return;
          if (richDiffViewer.clientWidth === mdLastAlignWidth) return;
          scheduleMdRealign();
        }).observe(richDiffViewer);
      }

      // ========== Markdown View 目次 (Index) ==========
      // ただの目次ではなく「変更の地図」。見出し(h1/h2/h3)ごとに、その節が
      // 追加/削除/内部変更/無変更のどれかを丸印で示す。差分は絶対に取り直さない
      // ── mdDiffedHtml（sanitize 済みの diff HTML、openMarkdownView が1回だけ
      // 作る）から組み立てるだけ。
      const mdToc = document.getElementById('mdToc');
      const mdTocList = document.getElementById('mdTocList');
      const mdTocFoldBtn = document.getElementById('mdTocFold');
      const mdTocResizer = document.getElementById('mdTocResizer');

      let mdTocCollapsed = false;   // 折りたたみ状態。セッション中だけ覚える（永続化はしない）
      // 開いているときの目次の幅(px)。ドラッグで変わる。--md-toc-w を書くのは
      // updateMdToc とここの2箇所だけ（下のドラッグ処理）にして、この変数
      // だけが値の出どころになるようにしてある。mdTocCollapsed と同じく
      // セッション中だけ覚え、localStorage には残さない。
      let mdTocOpenW = 190;
      const MD_TOC_MIN_W = 140; // これより狭くはしない
      const MD_TOC_MAX_W = 420; // これより広くはしない
      let mdTocEntries = [];        // 直近に組み立てた項目一覧
      let mdTocBuiltHtml = null;    // mdTocEntries がどの mdDiffedHtml から作られたか（同じなら作り直さない）
      let mdTocCurrentIndex = null; // 現在ハイライト中の項目の data-sync-index
      let mdTocScrollBound = false; // #richDiffViewer への scroll 購読が生きているか
      let mdTocRafQueued = false;   // 現在位置の再計算を rAF に1本化するためのフラグ
      const MD_TOC_JUMP_MARGIN = 16; // クリックで飛んだとき、対象が少し下に来る程度の余白

      // ins/del は絶対にタグ名で判定しない。GFM の ~~取り消し線~~ が <del> に
      // なるため、タグ名で判定すると文書自身の取り消し線を巻き込んでしまう。
      // クラス（diffins/diffmod/diffdel）だけを見るのは stripMarked と同じ考え方。
      const MD_TOC_INS_SEL = 'ins.diffins, ins.diffmod';
      const MD_TOC_DEL_SEL = 'del.diffdel, del.diffmod';
      const MD_TOC_MARK_SEL = MD_TOC_INS_SEL + ', ' + MD_TOC_DEL_SEL;

      // 要素から「変更前の姿」「変更後の姿」を取り出す。要素自身が対象
      // （まるごと追加/削除された段落など、HtmlDiff がトップレベル要素そのものを
      // ins/del にすることがある）なら中身ごと数えない。
      function mdTocStripText(el, selector) {
        if (el.matches(selector)) return '';
        const clone = el.cloneNode(true);
        clone.querySelectorAll(selector).forEach((n) => n.remove());
        return (clone.textContent || '').replace(/\s+/g, ' ').trim();
      }
      const mdTocBeforeText = (el) => mdTocStripText(el, MD_TOC_INS_SEL); // ins(追加分)を除く＝変更前の姿
      const mdTocAfterText = (el) => mdTocStripText(el, MD_TOC_DEL_SEL);  // del(削除分)を除く＝変更後の姿
      const mdTocHasMark = (el) => el.matches(MD_TOC_MARK_SEL) || !!el.querySelector(MD_TOC_MARK_SEL);
      const mdTocHasSide = (els, sel) => els.some((el) => el.matches(sel) || !!el.querySelector(sel));

      // 意味のある文字（文字か数字）の数。空白・記号・句読点は数えない。
      // 文字か数字かで見るのは、差分エンジンの identityOverlap と同じ基準。
      const mdTocWeight = (s) => ((s || '').match(/[\p{L}\p{N}]/gu) || []).length;

      // 見出しの文字を「追加された分・削除された分・どちらでもない分」の
      // 3つに数え分ける。節ごとの増減はこの内訳で決める（下の判定を参照）。
      function mdTocHeadWeights(el) {
        const w = { ins: 0, del: 0, keep: 0 };
        const walk = (node, side) => {
          if (node.nodeType === 3) { w[side] += mdTocWeight(node.nodeValue); return; }
          if (node.nodeType !== 1) return;
          // ins/del は入れ子にならない前提だが、外側で決まった側を優先して
          // おけば入れ子でも二重に数えない。
          let s = side;
          if (s === 'keep') {
            if (node.matches(MD_TOC_INS_SEL)) s = 'ins';
            else if (node.matches(MD_TOC_DEL_SEL)) s = 'del';
          }
          Array.from(node.childNodes).forEach((c) => walk(c, s));
        };
        walk(el, 'keep');
        return w;
      }

      // 「節ごと増減した」とみなす上限。見出しのうち、増えた側（減った側）
      // 以外が全体のこれ以下なら、まるごと増減したものとして扱う。
      const MD_TOC_GONE_RATIO = 0.25;

      // mdDiffedHtml を独立したコンテナへ流し込み、markSyncIndex で通し番号を
      // 振ってから見出し単位に切り分ける。ここで振る番号は renderMarkdownView が
      // 1列表示・左右ペインそれぞれに振る番号と全く同じ規則（トップレベルの子を
      // 出現順に0から）なので、そのまま飛び先の鍵として使い回せる。
      // トップレベルの子だけを見る（blockquote や li の中の見出しは対象外）。
      function buildMdTocEntries() {
        if (mdDiffedHtml === null) return [];
        const container = document.createElement('div');
        container.innerHTML = mdDiffedHtml;
        markSyncIndex(container);

        // 見出しから次の見出しの直前までを1節とする（見出し自身を含む）。
        const sections = [];
        let cur = null;
        Array.from(container.children).forEach((el) => {
          const m = /^H([123])$/.exec(el.tagName);
          if (m) {
            cur = { level: Number(m[1]), heading: el, members: [el] };
            sections.push(cur);
          } else if (cur) {
            cur.members.push(el);
          }
        });

        return sections.flatMap((sec) => {
          // 節ごと増えたか減ったかは、見出し自身だけで決める。目次は見出しの
          // 一覧なので、「その項目が変更前にあったか・変更後にあるか」が
          // そのまま印の意味になる。
          // 節の中身の増減で決めると破綻する。HtmlDiff は段落をまたいで文字
          // 単位で差分を取るので、前の節の削除された末尾が、次の節の見出しより
          // 後ろに置かれることがある。すると新しく足したはずの節が、隣の節の
          // 残骸を自分の中身として数えてしまい「中に変更」に化ける。
          //
          // ただし見出しも「片側に丸ごと入っているか」では測れない。HtmlDiff は
          // 文字単位なので、まるごと足した見出しでも、前からそこにあった見出しと
          // たまたま一致した文字が残る。番号を振った文書では「3.4 」のような
          // 見出し番号がまさにそれで、新設した節が「中に変更」に化けていた。
          // そこで内訳の割合で見る ── 増えた分以外がごく僅かなら節ごと追加。
          const hw = mdTocHeadWeights(sec.heading);
          const total = hw.ins + hw.del + hw.keep;
          const headBefore = mdTocBeforeText(sec.heading);
          const headAfter = mdTocAfterText(sec.heading);

          // 見出しが「まるごと消えた分」と「まるごと足した分」だけで出来て
          // いるときは、書き換えではなく別々の見出しが1要素にまとめられた形。
          // 節を差し替えると（古い節を消して新しい節を足すと）必ずこうなる。
          // 1行の「中に変更」で出すと、消えた節も足した節も見えなくなるので、
          // 消えた分と足した分の2行に分けて出す。飛び先は同じ要素でよい
          // （文書の上では同じ場所にあるため）。
          if (hw.ins > 0 && hw.del > 0 && hw.keep <= total * MD_TOC_GONE_RATIO) {
            return [
              { level: sec.level, status: 'del', gone: true, label: headBefore, syncIndex: sec.heading.dataset.syncIndex },
              { level: sec.level, status: 'add', gone: false, label: headAfter, syncIndex: sec.heading.dataset.syncIndex },
            ];
          }

          // 節ごと消えたか（＝項目に取り消し線を引くか）は見出しだけで決まる。
          // 中に削除があるだけの節に取り消し線を引いてはいけない。
          const gone = hw.del > 0 && hw.ins + hw.keep <= total * MD_TOC_GONE_RATIO;
          let status;
          if (hw.ins > 0 && hw.del + hw.keep <= total * MD_TOC_GONE_RATIO) status = 'add'; // 節ごと追加
          else if (gone) status = 'del';                                                   // 節ごと削除
          else {
            // 見出しは残っている節。印の色は「中で何が起きたか」で分ける。
            // 一律で赤緑にすると、足しただけの節にも赤が入り、何かを消した
            // ように見えてしまう。実際そう見えるという指摘があった。
            const ins = mdTocHasSide(sec.members, MD_TOC_INS_SEL);
            const del = mdTocHasSide(sec.members, MD_TOC_DEL_SEL);
            status = ins && del ? 'mod' : ins ? 'add' : del ? 'del' : 'none';
          }
          // 見出しの文言そのものが変わっていても、出すのは変更後の文言だけ
          // （節ごと削除のときだけ変更後が空になるので、変更前を使う）。
          // どちらも空という取りこぼしに備えて反対側で埋める。文言の無い項目を
          // 目次に並べるくらいなら、反対側の文言のほうがましなので。
          const label = (gone ? headBefore : headAfter) || headBefore || headAfter;
          return [{ level: sec.level, status, gone, label, syncIndex: sec.heading.dataset.syncIndex }];
        });
      }

      // 項目一覧の DOM を作り直す（entries の中身が変わったときだけ呼ぶ）。
      function renderMdTocList() {
        mdTocList.innerHTML = '';
        mdTocCurrentIndex = null;
        mdTocEntries.forEach((entry) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'md-toc-i'
            + (entry.level === 3 ? ' lv3' : '')
            + (entry.gone ? ' removed' : '');
          item.dataset.syncIndex = entry.syncIndex;
          if (entry.label) item.title = entry.label; // 長い見出しは省略記号で切るので、全文は title に

          // 印は +/−/± のバッジ。変更なしは何も置かず、位置だけ空けて字揃えを
          // 保つ（slot 自体は残すが、中に .md-toc-m を入れない）。
          const slot = document.createElement('span');
          slot.className = 'md-toc-slot';
          if (entry.status !== 'none') {
            const mark = document.createElement('i');
            mark.className = 'md-toc-m ' + (entry.status === 'add' ? 'add' : entry.status === 'del' ? 'del' : 'mod');
            // 文字は必ず .glyph に入れ、mark 自身には font-size を持たせない
            // （CSS 側のコメント参照。mark に font-size を持たせると、
            // width/height の em 換算先までズレてバッジが潰れる）。
            const glyph = document.createElement('span');
            glyph.className = 'glyph';
            glyph.textContent = entry.status === 'add' ? '+'
              : entry.status === 'del' ? '−' // − (U+2212, ハイフンではない)
              : '±';
            mark.appendChild(glyph);
            slot.appendChild(mark);
          }
          item.appendChild(slot);

          const label = document.createElement('span');
          label.className = 'md-toc-t';
          label.textContent = entry.label;
          item.appendChild(label);

          item.addEventListener('click', () => mdTocJumpTo(entry.syncIndex));
          mdTocList.appendChild(item);
        });
      }

      // #richDiffViewer の中から、飛び先の鍵(data-sync-index)に対応する要素を
      // 探す。左右分割では片側にしか無い節もあるが、querySelector はどちらの
      // ペインにあっても見つけてくれるので、対象が1列/左右のどちらでも同じ
      // 呼び方で済む。
      function mdTocFindTarget(syncIndex) {
        return richDiffViewer.querySelector('[data-sync-index="' + syncIndex + '"]');
      }

      // 項目をクリックしたときの飛び先。スクロールを持っているのは
      // #richDiffViewer 自身（左右分割でも1本のスクロール領域を共有している）
      // ので、そこへ対して行う。対象が少し下に来る程度の余白を残す。
      function mdTocJumpTo(syncIndex) {
        mdScrollTo(mdTocFindTarget(syncIndex), true);
      }

      // 目次の項目からも差分ジャンプからも同じ飛び方をするので、1箇所にまとめる。
      // 実際に落ち着くスクロール位置を返す。差分ジャンプ側は「そこから動かされて
      // いないか」を見るのにこの値を使うので、器の端で頭打ちになる分も含めて
      // 丸めた値を返しておく必要がある。
      // 目次のクリックは1回きりの移動なので滑らかに、差分ジャンプは連打される
      // 前提なので即座に飛ばす（滑らかにすると、着地前にもう一度押されたときに
      // 途中の位置を読んでしまい、現在地の判断がぶれる）。
      function mdScrollTo(target, smooth) {
        if (!target) return -1;
        const delta = target.getBoundingClientRect().top - richDiffViewer.getBoundingClientRect().top;
        const max = Math.max(0, richDiffViewer.scrollHeight - richDiffViewer.clientHeight);
        const top = Math.max(0, Math.min(max, richDiffViewer.scrollTop + delta - MD_TOC_JUMP_MARGIN));
        richDiffViewer.scrollTo({ top, behavior: smooth ? 'smooth' : 'auto' });
        return top;
      }

      // ========== Markdown View 差分ジャンプ ==========
      // 中身の無い印は飛び先にしない。HtmlDiff はブロックの切れ目の改行にも印を
      // 付けることがあり（<ins>\n</ins> のような高さ0の要素ができる）、そこへ
      // 飛んでも画面は何も変わらないので「押しても進まない」ように見える。
      // 文字か数字があれば中身あり。画像だけの変更もあるので、置換要素も見る。
      const MD_STOP_MEDIA_SEL = 'img, svg, video, canvas';
      const mdMarkHasContent = (el) =>
        /[\p{L}\p{N}]/u.test(el.textContent || '')
        || el.matches(MD_STOP_MEDIA_SEL) || !!el.querySelector(MD_STOP_MEDIA_SEL);

      // 印を含む一番内側のブロックまで遡って、そこを飛び先にする。
      // トップレベルのかたまり（data-sync-index の単位）を飛び先にしてはいけない
      // ── 箇条書きや表は丸ごとで1ブロックなので、長い一覧の下の方が変わって
      // いると、変更のはるか手前（実測で 400px 超）に着地する。着地点には何の
      // 変化も見えず「関係ないところで止まる」ことになる。
      // 表は td ではなく tr 単位。1行の中で複数のセルが変わっても1回で済ませる。
      const MD_STOP_LEAF_SEL = 'li, p, h1, h2, h3, h4, h5, h6, tr, pre, blockquote, dd, dt';
      function mdStopUnitOf(mark) {
        let el = mark;
        while (el && el !== richDiffViewer) {
          if (el.matches(MD_STOP_LEAF_SEL)) return el;
          // かたまりの外までは遡らない。葉が見つからなければ、そのかたまり自身。
          if (el.dataset && el.dataset.syncIndex !== undefined) return el;
          el = el.parentElement;
        }
        return null;
      }

      function mdDiffStops() {
        if (!isRichDiffView || richViewMode !== 'markdown') return [];
        const units = [];
        const seen = new Set();
        richDiffViewer.querySelectorAll(MD_TOC_MARK_SEL).forEach((mark) => {
          if (!mdMarkHasContent(mark)) return;
          const unit = mdStopUnitOf(mark);
          if (!unit || seen.has(unit)) return;
          seen.add(unit);
          units.push(unit);
        });
        // 画面上の縦位置で並べ替える。DOM の並びは左ペイン→右ペインなので
        // そのままでは文書順にならない。
        // ついでに、ほぼ同じ高さに来たものは1つに畳む。左右分割では同じ変更が
        // 両ペインに出る（左は削除・右は追加）が、高さを揃えてあるので必ず同じ
        // 位置に並ぶ ── どちらへ飛んでも結果は同じなので2回止まる必要はない。
        return units
          .map((el) => ({ el, top: el.getBoundingClientRect().top }))
          .sort((a, b) => a.top - b.top)
          .filter((u, i, arr) => i === 0 || Math.abs(u.top - arr[i - 1].top) >= 4)
          .map((u) => u.el);
      }

      // 直前に飛んだ先と、そのとき落ち着いたスクロール位置。次に押されたときの
      // 「現在地」の判断に使う。描き直しで DOM ごと作り替わったら参照は迷子に
      // なるが、下の stops.indexOf が -1 を返して位置からの判断に落ちるので、
      // 明示的に捨てる必要はない。
      let mdJumpLast = null;
      let mdJumpLastScroll = -1;

      function mdJumpToDiff(dir) {
        const stops = mdDiffStops();
        if (!stops.length) return;
        const viewerTop = richDiffViewer.getBoundingClientRect().top;
        const offsetOf = (el) => el.getBoundingClientRect().top - viewerTop;
        const last = stops.indexOf(mdJumpLast);
        // 前回置いた位置から動いていなければ、まだそこに居るとみなす。
        // 手でスクロールされていれば一致しないので、位置から探し直す方へ落ちる。
        const parked = last >= 0 && Math.abs(richDiffViewer.scrollTop - mdJumpLastScroll) < 2;
        let target;

        if (parked) {
          // 番号でひとつ動かす。位置だけで決めると文書の末尾で進めなくなる ──
          // もう下に余白が無くてスクロールが動かず、次のかたまりも「まだ下に
          // ある」と判定され続けて同じ場所を拾い直してしまうため。
          // 番号なら最後まで数えて端で折り返せる（Monaco 側のジャンプと同じ）。
          target = stops[(last + (dir === 'next' ? 1 : -1) + stops.length) % stops.length];
        } else if (dir === 'next') {
          // 判定線を MD_TOC_JUMP_MARGIN に合わせてあるのは、飛んだ直後の対象が
          // ちょうどその位置に来るため。器の上端で測ると、いま居るかたまりを
          // 「まだ下にある」と拾い直してしまう。
          target = stops.find((el) => offsetOf(el) > MD_TOC_JUMP_MARGIN + 2) || stops[0];
        } else {
          const prevs = stops.filter((el) => offsetOf(el) < MD_TOC_JUMP_MARGIN - 2);
          target = prevs.length ? prevs[prevs.length - 1] : stops[stops.length - 1];
        }

        mdJumpLast = target;
        mdJumpLastScroll = mdScrollTo(target, false);
      }

      // 器のスクロールに追随して、いま画面上端をまたいでいる見出しを現在位置と
      // する。項目は文書の出現順に並んでいるので、「まだ画面上端より上に来て
      // いる」項目のうち一番後ろのものを探せばよい。1つも無ければ（まだ最初の
      // 見出しにも達していない）先頭を現在位置とする。
      function updateMdTocHighlight() {
        const items = Array.from(mdTocList.children);
        if (!items.length) return;
        let current;
        // 一番下まで来ているときは、最後の見出しから先の中身が短くて画面上端
        // まで来ないことがある（見出しの直後で文書が終わる場合など）。
        // それでも「もうこれ以上下は無い」以上、最後の項目を現在位置とする
        // ── これが無いと、文書の末尾にいるのに最後の項目がいつまでも
        // 現在位置にならないことがある。
        const atBottom = richDiffViewer.scrollTop + richDiffViewer.clientHeight >= richDiffViewer.scrollHeight - 2;
        if (atBottom) {
          current = items[items.length - 1];
        } else {
          // 判定の線は、クリックで飛んだときに対象が止まる位置に合わせる。
          // 器の上端ちょうどで測ると、飛んだ直後は対象が MD_TOC_JUMP_MARGIN
          // だけ下にいて線に届かず、ひとつ前の項目が現在位置のままになる
          // （少しスクロールすると直る、という状態だった）。
          const topLine = richDiffViewer.getBoundingClientRect().top + MD_TOC_JUMP_MARGIN + 1;
          current = items[0];
          for (const item of items) {
            const target = mdTocFindTarget(item.dataset.syncIndex);
            if (target && target.getBoundingClientRect().top <= topLine) current = item;
          }
        }
        if (current.dataset.syncIndex === mdTocCurrentIndex) return; // 変化が無ければ何もしない
        mdTocCurrentIndex = current.dataset.syncIndex;
        items.forEach((item) => item.classList.toggle('current', item === current));
        // 項目数の多い文書では現在位置が一覧の外に出ていることがあり、そのままだと
        // 強調しても見えない。block:'nearest' なので、既に見えているときは動かない。
        current.scrollIntoView({ block: 'nearest' });
      }

      // 短時間に何度も発火するイベント（スクロール中の連続発火など）を1フレーム
      // にまとめる。Markdown View の scheduleMdRealign と同じ考え方。
      function scheduleMdTocHighlight() {
        if (mdTocRafQueued) return;
        mdTocRafQueued = true;
        requestAnimationFrame(() => { mdTocRafQueued = false; updateMdTocHighlight(); });
      }

      function mdTocBindScroll() {
        if (mdTocScrollBound) return;
        richDiffViewer.addEventListener('scroll', scheduleMdTocHighlight, { passive: true });
        mdTocScrollBound = true;
      }
      function mdTocUnbindScroll() {
        if (!mdTocScrollBound) return;
        richDiffViewer.removeEventListener('scroll', scheduleMdTocHighlight);
        mdTocScrollBound = false;
      }

      // Markdown View を閉じる、または見出しが1つも無い文書のときに呼ぶ。
      // 畳んだ帯も含めて領域ごと消し、購読も残さない
      // （--md-toc-w を 0 に戻すので、.rich-diff-viewer 側の余白計算も
      // 目次が無かったときの式にそのまま戻る）。
      function hideMdToc() {
        mdToc.classList.remove('visible');
        document.documentElement.style.setProperty('--md-toc-w', '0px');
        mdTocUnbindScroll();
        mdTocCurrentIndex = null;
      }

      // renderMarkdownView が1列⇄左右を描き直すたびに呼ぶ。差分は取り直さない
      // ので、mdDiffedHtml が前回と同じなら項目一覧も作り直さない
      // （1列⇄左右の往復のたびに目次がちらつかないようにするため）。
      function updateMdToc() {
        if (mdDiffedHtml === null) { hideMdToc(); return; }
        if (mdTocBuiltHtml !== mdDiffedHtml) {
          mdTocEntries = buildMdTocEntries();
          mdTocBuiltHtml = mdDiffedHtml;
          renderMdTocList();
        }
        // 見出しが1つも無い文書では、目次の領域ごと出さない（畳んだ帯も出さない）。
        if (mdTocEntries.length === 0) { hideMdToc(); return; }

        mdToc.classList.add('visible');
        mdToc.classList.toggle('collapsed', mdTocCollapsed);
        mdTocFoldBtn.title = mdTocCollapsed ? '目次を開く' : '目次をたたむ';
        mdTocFoldBtn.textContent = mdTocCollapsed ? '›' : '‹';
        document.documentElement.style.setProperty('--md-toc-w', mdTocCollapsed ? '34px' : `${mdTocOpenW}px`);
        mdTocBindScroll();
        scheduleMdTocHighlight();
      }

      mdTocFoldBtn.addEventListener('click', () => {
        mdTocCollapsed = !mdTocCollapsed;
        mdToc.classList.toggle('collapsed', mdTocCollapsed);
        mdTocFoldBtn.title = mdTocCollapsed ? '目次を開く' : '目次をたたむ';
        mdTocFoldBtn.textContent = mdTocCollapsed ? '›' : '‹';
        document.documentElement.style.setProperty('--md-toc-w', mdTocCollapsed ? '34px' : `${mdTocOpenW}px`);
        // 目次の幅が変わると、左右表示の2列に残された横幅も変わり、折り返しが
        // 変わって高さも変わりうる（#richDiffViewer 自体の clientWidth は
        // 目次を重ねているだけなので変わらず、既存の ResizeObserver では
        // 拾えない）。scheduleMdRealign は1列表示中（mdSplitLeftPane が null）
        // なら素通りするので、常に呼んでよい。
        scheduleMdRealign();
      });

      // ========== Markdown View 目次の幅リサイズ ==========
      // 右端の掴み所（#mdTocResizer）をドラッグして目次自体の幅（mdTocOpenW）
      // を変える。.md-resizer（左右ペインの幅）用の isMdResizing とは別の
      // フラグで判定する ── 同じ mousemove/mouseup に相乗りさせると、
      // どちらのドラッグ中かの判定が絡まりかねないため。
      let isMdTocResizing = false;
      let mdTocDragLeft = 0; // ドラッグ開始時に測った目次の左端(px)。ドラッグ中は動かないので、mousemove のたびに測り直さない。

      mdTocResizer.addEventListener('mousedown', () => {
        isMdTocResizing = true;
        mdTocDragLeft = mdToc.getBoundingClientRect().left;
        mdTocResizer.classList.add('dragging');
        document.body.classList.add('is-resizing');
      });

      document.addEventListener('mousemove', (e) => {
        if (!isMdTocResizing) return;
        let newWidth = e.clientX - mdTocDragLeft;
        if (newWidth < MD_TOC_MIN_W) newWidth = MD_TOC_MIN_W;
        if (newWidth > MD_TOC_MAX_W) newWidth = MD_TOC_MAX_W;
        mdTocOpenW = newWidth;
        // ドラッグ中は --md-toc-w を書き換えるだけにとどめる。左右分割の
        // 再計算や現在位置の測り直しを毎フレーム行うと重いので、それらは
        // mouseup でまとめて行う。
        document.documentElement.style.setProperty('--md-toc-w', `${newWidth}px`);
      });

      document.addEventListener('mouseup', () => {
        if (!isMdTocResizing) return;
        isMdTocResizing = false;
        mdTocResizer.classList.remove('dragging');
        document.body.classList.remove('is-resizing');
        // 幅が変わると左右分割の折り返し・高さと、目次の現在位置がどちらも
        // 変わりうるので、ドラッグが終わったところでまとめて測り直す。
        scheduleMdRealign();
        scheduleMdTocHighlight();
      });

      // ウィンドウ幅が変わると見出しの位置も動くので、現在位置を測り直す。
      // 幅が変わらないのに高さだけ変わる（=自分で入れた spacer の影響）ときは
      // 何度も走らないよう、既存の realignMdSplit 用 ResizeObserver とは別に
      // 目次が出ているときだけ動く軽量な監視にしてある。
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => {
          if (mdToc.classList.contains('visible')) scheduleMdTocHighlight();
        }).observe(richDiffViewer);
      }

      // ========== 左右表示の列幅リサイズ ==========
      // 仕切り線（.md-split-divider）をドラッグして左右の比を変える。目次の幅
      // （isMdTocResizing）や 1列表示の本文幅（isMdResizing）とはフラグを分ける
      // ── 同じ mousemove に相乗りさせると、どちらのドラッグ中かの判定が
      // 絡まりかねないため。
      const MD_SPLIT_MIN_W = 200; // 片側の最小幅(px)。列の左右パディング 32px×2 を引くと本文は 136px 残る。
      let isMdSplitResizing = false;
      let mdSplitDragX = 0;      // ドラッグ開始時のマウス位置
      let mdSplitDragLeftW = 0;  // ドラッグ開始時の左列の幅
      let mdSplitDragTotalW = 0; // 左列＋右列の幅。比の分母（仕切り線のぶんは含めない）

      function beginMdSplitResize(e) {
        if (!mdSplitLeftPane || !mdSplitRightPane) return;
        isMdSplitResizing = true;
        mdSplitDragX = e.clientX;
        mdSplitDragLeftW = mdSplitLeftPane.getBoundingClientRect().width;
        mdSplitDragTotalW = mdSplitDragLeftW + mdSplitRightPane.getBoundingClientRect().width;
        if (mdSplitDivider) mdSplitDivider.classList.add('dragging');
        document.body.classList.add('is-resizing');
      }

      document.addEventListener('mousemove', (e) => {
        if (!isMdSplitResizing) return;
        const max = mdSplitDragTotalW - MD_SPLIT_MIN_W;
        if (max < MD_SPLIT_MIN_W) return; // 両側に最小幅を取れないほど狭い（動かしても意味がない）
        let w = mdSplitDragLeftW + (e.clientX - mdSplitDragX);
        if (w < MD_SPLIT_MIN_W) w = MD_SPLIT_MIN_W;
        if (w > max) w = max;
        // ドラッグ中は変数を書き換えるだけにとどめる。列幅が変わると全ブロックの
        // 折り返しと高さが変わり、余白（data-align-spacer）の入れ直しが毎フレーム
        // では重すぎるので、揃え直しは mouseup でまとめて行う（目次の幅ドラッグと
        // 同じ方針）。ドラッグ中は前の余白のまま少しずつずれて見えるが、放した
        // ところで揃う。
        // 単位を持たない比のまま書き込む。% にして書き込むと、CSS 側の calc が
        // 「仕切り線を除いた幅」に対してこの比を掛けているのに、ここで既に
        // 仕切り線を含めた % に変換してしまい、両者の基準がずれる。
        document.documentElement.style.setProperty('--md-split-ratio', String(w / mdSplitDragTotalW));
      });

      document.addEventListener('mouseup', () => {
        if (!isMdSplitResizing) return;
        isMdSplitResizing = false;
        if (mdSplitDivider) mdSplitDivider.classList.remove('dragging');
        document.body.classList.remove('is-resizing');
        // 列幅が変わると折り返し・高さと、目次の現在位置がどちらも変わる。
        scheduleMdRealign();
        scheduleMdTocHighlight();
      });

      function renderMarkdownView() {
        if (mdDiffedHtml === null) return;
        // 目次は差し替えの都度、まず先に組み立てる（--md-toc-w をここで確定
        // させておかないと、下の左右表示でパネル幅ぶんの余白がまだ乗っていない
        // 状態で alignSplitPanes が測ってしまう）。
        updateMdToc();

        // 1列 / 左右 の選択はツールバーの isInlineView と共有する
        // （false＝左右、true＝1列。初期値は false なので、
        // ここも既定は左右になる）。
        const mdViewSplit = !isInlineView;

        richDiffViewer.classList.toggle('split-mode', mdViewSplit);
        // display は毎回インラインで指定し直す。インラインスタイルは常に
        // stylesheet より優先されるため、.split-mode { display: flex } の
        // クラス指定だけでは効かない（block のまま残ってしまう）ことに注意。
        richDiffViewer.style.display = mdViewSplit ? 'flex' : 'block';

        if (!mdViewSplit) {
          // 1列表示: sanitize 済み HTML をそのまま流し込むが、目次の飛び先が
          // 1列表示でも同じ鍵（data-sync-index）で引けるよう、左右表示と同じく
          // markSyncIndex を通してから差し込む（属性が増えるだけで見た目には
          // 影響しない）。
          const inlineWrap = document.createElement('div');
          inlineWrap.innerHTML = mdDiffedHtml;
          markSyncIndex(inlineWrap);
          richDiffViewer.innerHTML = inlineWrap.innerHTML;
          mdResizers.forEach(r => r.style.display = 'flex');
          // 左右表示の参照を手放す。innerHTML の入れ替えで古い leftPane/rightPane
          // は DOM から切り離されるので、以後 realignMdSplit / ResizeObserver は
          // ここで素通りするようになる（余白もイベント購読も残らない）。
          mdSplitLeftPane = null;
          mdSplitRightPane = null;
          mdSplitDivider = null;
        } else {
          // 左右表示: 同じ HTML 文字列を 2 回パースし、片方から追加を、
          // もう片方から削除を取り除く。ins/del は「タグ名」では絶対に消さない
          // ── GFM の ~~取り消し線~~ が <del> になるため、タグ名で消すと
          // 文書が元から持っている取り消し線まで消えてしまう。HtmlDiff が
          // 付けるクラス（diffins/diffmod/diffdel）だけを見て要素ごと remove() する。
          const leftPane = document.createElement('div');
          leftPane.className = 'md-split-pane md-split-left markdown-body';
          leftPane.innerHTML = mdDiffedHtml;
          // フィルタをかける前＝左右の構造がまだ完全に同一な段階で番号を振る。
          // これがそのまま左右の対応表になるので、あとから対応関係を推測しない。
          markSyncIndex(leftPane);
          stripMarked(leftPane, 'ins.diffins, ins.diffmod');

          const rightPane = document.createElement('div');
          rightPane.className = 'md-split-pane md-split-right markdown-body';
          rightPane.innerHTML = mdDiffedHtml;
          markSyncIndex(rightPane);
          stripMarked(rightPane, 'del.diffdel, del.diffmod');

          const divider = document.createElement('div');
          divider.className = 'md-split-divider';
          // ペインは描画のたびに作り直すので、掴み所の紐付けもここで毎回行う。
          divider.addEventListener('mousedown', beginMdSplitResize);

          richDiffViewer.innerHTML = '';
          richDiffViewer.appendChild(leftPane);
          richDiffViewer.appendChild(divider);
          richDiffViewer.appendChild(rightPane);

          // 幅リサイザーは「1列の読みやすい幅」のための仕掛けなので、左右表示では
          // 意味を持たない。隠すだけにして --md-width 自体には触れない
          // （1列表示に戻したときに元どおりの幅で復元されるようにするため）。
          mdResizers.forEach(r => r.style.display = 'none');

          // leftPane/rightPane はこの呼び出しのたびに新しく作り直しているので、
          // 高さを揃える対象もペインと運命を共にする。1列表示に戻ったとき
          // （上の分岐で richDiffViewer.innerHTML を丸ごと入れ替える）これらの
          // 要素ごと破棄され、参照だけが残ることはない。
          mdSplitLeftPane = leftPane;
          mdSplitRightPane = rightPane;
          mdSplitDivider = divider;
          watchImagesForRealign(leftPane);
          watchImagesForRealign(rightPane);
          // 初回は開いた瞬間から揃っていてほしいので、rAF 待ち
          // （scheduleMdRealign）にはせずここで同期的に揃える。
          alignSplitPanes(leftPane, rightPane, divider);
          mdLastAlignWidth = richDiffViewer.clientWidth;
        }
      }

      // htmlDiffedDocs（{single, left, right}、1 回だけ作る）を現在のモード
      // （1列 / 左右）に応じて #htmlDiffFrame / #htmlSplitContainer に描き直す
      // だけの関数。ここでも絶対に差分を取り直さない。1列⇄左右の切り替えは
      // 全部これを呼ぶだけでよい。
      function renderHtmlView() {
        if (htmlDiffedDocs === null) return;
        const split = !isInlineView;

        if (!split) {
          // 1列表示: これまでどおり #htmlDiffFrame 1 枚に single を流し込む
          htmlDiffFrame.srcdoc = htmlDiffedDocs.single;
          htmlDiffFrame.style.display = 'block';
          htmlSplitContainer.classList.remove('visible');
          htmlDiffFrameLeft.removeAttribute('srcdoc');
          htmlDiffFrameRight.removeAttribute('srcdoc');
          // 左右表示から離れるので、購読状態・世代番号・iframe の高さ指定を
          // すべて元に戻す（余計な余白もイベントも残らないようにする）。
          resetHtmlAlignState();
        } else {
          // 左右表示: #htmlDiffFrame は使わず、専用の 2 枚（left/right）を並べる。
          // sandbox は #htmlDiffFrame と同じ allow-scripts allow-popups のみ
          // （allow-same-origin は付けない）。
          htmlDiffFrame.style.display = 'none';
          htmlDiffFrame.removeAttribute('srcdoc');
          htmlDiffFrameLeft.srcdoc = htmlDiffedDocs.left;
          htmlDiffFrameRight.srcdoc = htmlDiffedDocs.right;
          htmlSplitContainer.classList.add('visible');
          // srcdoc を差し替えたので、いずれ両方の iframe から 'load' が届き、
          // それぞれの load ハンドラが scheduleHtmlRealign を起こす。ここでは
          // フラグを立てるだけでよい（このタイミングではまだ中の注入
          // スクリプトが動いておらず、測っても意味がない）。
          htmlSplitActive = true;
        }
      }

      // ---- Markdown View を開く ----
      // marked.parse → HtmlDiff.execute → DOMPurify.sanitize の順序は不変。
      // その間に blockPairedHtmlDiff（ブロック単位で対応を決めてから HtmlDiff に
      // かける）と balanceDiffTags（タグの釣り合いを直す）を挟むだけ（釣り合っている
      // 出力には何もしない）。
      function openMarkdownView() {
        try {
          const bText = beforeModel.getValue();
          const aText = afterModel.getValue();

          const bHtml = marked.parse(bText);
          const aHtml = marked.parse(aText);

          if (typeof HtmlDiff === 'undefined') throw new Error("HtmlDiff library is missing");
          // ブロックの対応を先に決め（blockPairedHtmlDiff）、タグの釣り合いを
          // 直してから渡す（保険として残す。各コメント参照）。
          const diffedHtml = balanceDiffTags(blockPairedHtmlDiff(bHtml, aHtml));

          if (typeof DOMPurify === 'undefined') throw new Error("DOMPurify library is missing");
          // ここで 1 回だけ diff を作り、保持しておく。1列⇄左右の切り替えは
          // renderMarkdownView がこれを使い回すだけで、ここへは戻ってこない。
          mdDiffedHtml = DOMPurify.sanitize(diffedHtml);
          renderMarkdownView();

          // Monacoエディタを display: none で隠さず、絶対配置で画面外へ退避させる
          diffEditorContainer.style.position = 'absolute';
          diffEditorContainer.style.left = '-9999px';
          diffEditorContainer.style.visibility = 'hidden';

          changeActionsContainer.style.display = 'none';
          htmlDiffFrame.style.display = 'none';
          htmlDiffFrame.removeAttribute('srcdoc');
          htmlSplitContainer.classList.remove('visible');
          htmlDiffFrameLeft.removeAttribute('srcdoc');
          htmlDiffFrameRight.removeAttribute('srcdoc');
          resetHtmlAlignState();
          // richDiffViewer.style.display は renderMarkdownView が現在のモードに
          // 合わせて設定済み（block/flex）

          richDiffBtn.classList.add('active');
          htmlViewBtn.classList.remove('active');
          isRichDiffView = true;
          richViewMode = 'markdown';
          updateJumpControlsVisibility();
          saveAutoSave();
        } catch (error) {
          console.error("Markdown View Render Error:", error);
          restoreMonacoView();
          showToast('⚠️ Markdown Viewの生成に失敗しました');
        }
      }

      // ---- HTML View を開く (ported rich-html-diff engine) ----
      let htmlRenderSeq = 0;
      // 戻り値は「開けたか」。開き直しに失敗したとき（入れ替えの結果 AFTER に
      // 要素が無くなった場合）に、前の描画が残らないよう呼び出し側で片付けられる
      // ようにするためのもの。ボタンから開くときは見なくてよい。
      async function openHtmlView() {
        const bText = beforeModel.getValue();
        const aText = afterModel.getValue();

        // サニティチェック: AFTER テキストが要素を一切含まない（HTML として解釈できる
        // ものが何もない）場合だけは View を開かず Monaco 表示のままにする。断片的・
        // 崩れた HTML はブラウザが自動補正するのでそのまま許容する。
        const sanityDoc = new DOMParser().parseFromString(aText, 'text/html');
        if (!sanityDoc.body || sanityDoc.body.children.length === 0) {
          showToast('⚠️ HTML として解釈できる要素がありません');
          return false;
        }

        try {
          // 描画待ちが入るため非同期。連続クリック時は最後の要求だけを反映する。
          const seq = ++htmlRenderSeq;
          const docs = await renderHtmlDiffDocument(bText, aText);
          if (seq !== htmlRenderSeq) return;
          // ここで 1 回だけ 3 通り（1列/変更前/変更後）を保持する。1列⇄左右の
          // 切り替えは renderHtmlView がこれを使い回すだけで、ここへは戻ってこない。
          htmlDiffedDocs = docs;
          // 高さ揃えが「深い流れから先に処理する」ために必要な段階数。
          // buildHtmlDiffOutput が markHtmlSyncIndex の戻り値として持ち帰った値。
          htmlSyncMaxDepth = docs.maxFlowDepth || 0;
          renderHtmlView();

          // Monacoエディタを display: none で隠さず、絶対配置で画面外へ退避させる
          diffEditorContainer.style.position = 'absolute';
          diffEditorContainer.style.left = '-9999px';
          diffEditorContainer.style.visibility = 'hidden';

          changeActionsContainer.style.display = 'none';
          richDiffViewer.style.display = 'none';
          hideMdToc(); // Markdown View から直接 HTML View へ移った場合も目次を消す
          mdResizers.forEach(r => r.style.display = 'none');
          // htmlDiffFrame / htmlSplitContainer の表示は renderHtmlView が現在の
          // モードに合わせて設定済み

          htmlViewBtn.classList.add('active');
          richDiffBtn.classList.remove('active');
          isRichDiffView = true;
          richViewMode = 'html';
          updateJumpControlsVisibility();
          saveAutoSave();
          return true;
        } catch (error) {
          console.error("HTML View Render Error:", error);
          restoreMonacoView();
          showToast('⚠️ HTML Viewの生成に失敗しました');
          return false;
        }
      }

      richDiffBtn.addEventListener('click', () => {
        if (isRichDiffView && richViewMode === 'markdown') { restoreMonacoView(); return; }
        openMarkdownView();
      });

      htmlViewBtn.addEventListener('click', () => {
        if (isRichDiffView && richViewMode === 'html') { restoreMonacoView(); return; }
        openHtmlView();
      });

      // ==============================================================

      document.getElementById('swapBtn').addEventListener('click', async () => {
        const temp = beforeModel.getValue(); beforeModel.setValue(afterModel.getValue()); afterModel.setValue(temp);
        updatePlaceholders();
        // Markdown / HTML View が開いているときは、そちらも差分を取り直す。
        // 1列⇄左右の切り替え（setViewMode）は描き直すだけで済むが、入れ替えは
        // 差分そのものが変わるので、開き直しにあたる openMarkdownView /
        // openHtmlView を呼ぶ（どちらも開いている状態から呼び直して差し支えない
        // 作りになっている）。
        if (!isRichDiffView) return;
        if (richViewMode === 'markdown') openMarkdownView();
        // 入れ替えた結果 AFTER 側に要素が無くなることがある（丸ごと追加の差分を
        // 入れ替えた場合）。そのときは HTML View を開き直せないので、古い描画を
        // 残さず Monaco に戻す。
        else if (richViewMode === 'html' && !(await openHtmlView())) restoreMonacoView();
      });

      const inlineViewBtn = document.getElementById('inlineViewBtn');
      const splitViewBtn = document.getElementById('splitViewBtn');

      // 押された側を選ぶ。同じものを押し直したときは何もしない
      // （Markdown / HTML View を描き直す無駄を避ける）。
      function setViewMode(inline) {
        if (isInlineView === inline) return;
        isInlineView = inline;
        inlineViewBtn.classList.toggle('active', isInlineView);
        splitViewBtn.classList.toggle('active', !isInlineView);

        diffEditor.updateOptions({ renderSideBySide: !isInlineView });
        updateJumpControlsVisibility();
        updatePlaceholders(); rebuildChangeActions();

        // Markdown View / HTML View が開いているときは、そちらの 1列⇄左右も
        // 同じ状態に合わせる。状態は isInlineView を共有しているので、
        // 開いているほうを描き直すだけでよい（差分は取り直さない）。
        if (richViewMode === 'markdown') renderMarkdownView();
        else if (richViewMode === 'html') renderHtmlView();
      }

      inlineViewBtn.addEventListener('click', () => setViewMode(true));
      splitViewBtn.addEventListener('click', () => setViewMode(false));

      const updatePlaceholders = () => {
        const beforeHasText = beforeModel.getValue().length > 0; const afterHasText = afterModel.getValue().length > 0;
        const bPh = document.getElementById('beforePlaceholder'); const aPh = document.getElementById('afterPlaceholder');
        if (bPh) bPh.style.opacity = (beforeHasText || beforeFocused) ? '0' : '1';
        if (aPh) {
          if (isInlineView) aPh.style.opacity = (beforeHasText || afterHasText || beforeFocused || afterFocused) ? '0' : '1';
          else aPh.style.opacity = (afterHasText || afterFocused) ? '0' : '1';
        }
        diffOrig.updateOptions({ lineNumbers: (beforeHasText || beforeFocused) ? 'on' : 'off' }); diffMod.updateOptions({ lineNumbers: (afterHasText || afterFocused) ? 'on' : 'off' });
      };

      diffOrig.onDidFocusEditorWidget(() => { beforeFocused = true; updatePlaceholders(); });
      diffOrig.onDidBlurEditorWidget(() => { beforeFocused = false; updatePlaceholders(); });
      diffMod.onDidFocusEditorWidget(() => { afterFocused = true; updatePlaceholders(); });
      diffMod.onDidBlurEditorWidget(() => { afterFocused = false; updatePlaceholders(); });

      beforeModel.onDidChangeContent(updatePlaceholders); afterModel.onDidChangeContent(updatePlaceholders);
      beforeModel.onDidChangeContent(scheduleAutoSave); afterModel.onDidChangeContent(scheduleAutoSave);

      const jump = (dir) => {
        // Markdown View が開いているときは、Monaco の行ではなく描画された
        // ブロックを渡り歩く（HTML View はまだ未対応で、ボタン自体を出さない）。
        if (isRichDiffView) {
          if (richViewMode === 'markdown') mdJumpToDiff(dir);
          return;
        }
        if (!diffEditor) return; const changes = diffEditor.getLineChanges(); if (!changes || changes.length === 0) return;
        const modifiedEditor = diffEditor.getModifiedEditor(); const currentLine = modifiedEditor.getPosition().lineNumber;
        let target;
        if(dir === 'next') target = changes.find(c => c.modifiedStartLineNumber > currentLine) || changes[0];
        else { const prevs = changes.filter(c => c.modifiedStartLineNumber < currentLine); target = prevs.length > 0 ? prevs[prevs.length - 1] : changes[changes.length - 1]; }
        modifiedEditor.revealLineInCenter(target.modifiedStartLineNumber); modifiedEditor.setPosition({ lineNumber: target.modifiedStartLineNumber, column: 1 }); modifiedEditor.focus();
      };
      document.getElementById('nextDiffBtn').addEventListener('click', () => jump('next')); document.getElementById('prevDiffBtn').addEventListener('click', () => jump('prev'));

      function setupEditorDrop(editorInstance, model) {
        const container = editorInstance.getContainerDomNode();
        container.addEventListener('dragover', (e) => { e.preventDefault(); container.classList.add('drag-over'); });
        container.addEventListener('dragleave', () => container.classList.remove('drag-over'));
        container.addEventListener('drop', (e) => {
          e.preventDefault(); container.classList.remove('drag-over');
          if (e.dataTransfer.files.length > 0) {
            const r = new FileReader(); r.onload = (ev) => { model.setValue(ev.target.result); updatePlaceholders(); }; r.readAsText(e.dataTransfer.files[0]);
          }
        });
      }
      setTimeout(() => { setupEditorDrop(diffOrig, beforeModel); setupEditorDrop(diffMod, afterModel); }, 100);
      loadFromUrl();
      // ?token= があるとき（CLI がローカルに立てたサーバから開いたとき）は loadFromServer() が
