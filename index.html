  <script>
    /* =======================================================================
       Ported from rich-html-diff.html (source of truth, lines 118-418 core
       engine + 420-443 DIFF_CSS). The diff ALGORITHM itself (tokenize/diffSeq/
       unitsOf/sig/similar/textNodes/wrapRange/insertDeleted/inlineDiff/
       diffUnitPair/buildDiff/placeDeleted/orphanBin) is still ported verbatim —
       do NOT hand-edit those function bodies; re-port from the source file if
       changes are needed there. CONTROLLER (lines 445-468) is intentionally
       NOT ported — out of scope for this phase.
       DIFF_CSS has the following deliberate differences for this tool (everything else matches the source):
       1. TOKEN_RE's flag changed from 'g' to 'gu' (see the comment at that spot).
       2. del[data-diff="del"]'s text-decoration changed from line-through to none
          (no strikethrough is shown; deleted spans are indicated by color/background only).
       3. Removed the rule [data-diff-block="del"] * { text-decoration:line-through; }.
       4. Removed the box-shadow on [data-diff-block="ins"/"del"] (the colored bar on the left edge of a changed block).
       5. Added a[data-diff-nolink]{ cursor:pointer; }
          (paired with the fragment-link defanging done in renderHtmlDiffDocument(). href stays
          removed, but since ANCHOR_SCRIPT intercepts clicks to scroll instead, the cursor is
          restored to look clickable too).
       6. Changed the marker color from the fixed constant DIFF_CSS to a call to buildDiffCss(base).
          Kept as a semi-transparent color, it would composite with an ancestor element's
          background and the effective color would vary from document to document, so
          buildHtmlDiffOutput() always uses an opaque color baked on top of the ground color
          resolveDiffBase() determined.
       ======================================================================= */
    /* =======================================================================
       Rich HTML Diff — core
       Overlays only the text differences with ins/del while preserving the
       rendered appearance. No external dependencies, entirely local (no
       network transmission of any kind).
       ======================================================================= */

    /* ---------- 1. Tokenizer (Japanese is tokenized one character at a time) ---------- */
    const TOKEN_RE = new RegExp(
      '[\\u3040-\\u30ff\\u3400-\\u4dbf\\u4e00-\\u9fff\\uf900-\\ufaff\\uff66-\\uff9f]' + // kana/kanji/halfwidth katakana
      '|[A-Za-z]+(?:[\'\u2019][A-Za-z]+)*' +                                            // English word
      '|[0-9]+(?:[.,][0-9]+)*' +                                                        // number
      '|\\s+' +                                                                          // whitespace
      '|[^\\s]',                                                                         // any other single char
      // The one deliberate difference from the source: 'g' -> 'gu'.
      // Without the u flag, the final [^\s] matches at the UTF-16 code-unit
      // level, so a surrogate pair (e.g. an emoji) gets split into 2 tokens,
      // and the later splitText() cuts through the middle of the pair,
      // corrupting the character into U+FFFD (the source has the same bug).
      // Adding the u flag switches matching to code points and fixes this.
      // Confirmed that tokenizing results for non-astral characters --
      // kana/kanji/halfwidth katakana/numbers/apostrophes -- are completely unchanged.
      'gu');

    function tokenize(s){ return s.match(TOKEN_RE) || []; }

    /* ---------- 2. Myers diff (on the token sequence) ---------- */
    // Return value: [{op:-1|0|1, items:[...]}, ...]  -1=deletion 0=same 1=addition
    function diffSeq(a, b, maxD){
      maxD = maxD || 6000;
      const N = a.length, M = b.length;
      if (N === 0 && M === 0) return [];
      if (N === 0) return [{op:1, items:b.slice()}];
      if (M === 0) return [{op:-1, items:a.slice()}];

      const MAX = Math.min(N + M, maxD);
      const off = MAX + 1;
      let v = new Int32Array(2 * MAX + 3);
      const trace = [];
      let found = -1;

      outer:
      for (let d = 0; d <= MAX; d++){
        trace.push(v.slice());
        for (let k = -d; k <= d; k += 2){
          let x;
          if (k === -d || (k !== d && v[off + k - 1] < v[off + k + 1])) x = v[off + k + 1];
          else x = v[off + k - 1] + 1;
          let y = x - k;
          while (x < N && y < M && a[x] === b[y]) { x++; y++; }
          v[off + k] = x;
          if (x >= N && y >= M){ found = d; break outer; }
        }
      }
      if (found < 0) return null; // diff too large -> caller falls back

      // Backtrack
      const rev = [];
      let x = N, y = M;
      for (let d = found; d >= 0; d--){
        const vv = trace[d];
        const k = x - y;
        let prevK;
        if (k === -d || (k !== d && vv[off + k - 1] < vv[off + k + 1])) prevK = k + 1;
        else prevK = k - 1;
        const prevX = vv[off + prevK], prevY = prevX - prevK;
        while (x > prevX && y > prevY){ rev.push([0, a[x - 1]]); x--; y--; }
        if (d > 0){
          if (x > prevX) rev.push([-1, a[x - 1]]);
          else           rev.push([1,  b[y - 1]]);
          x = prevX; y = prevY;
        }
      }
      rev.reverse();

      const out = [];
      for (const [op, item] of rev){
        if (out.length && out[out.length - 1].op === op) out[out.length - 1].items.push(item);
        else out.push({op, items:[item]});
      }
      return out;
    }

    /* ---------- 3. Extracting structural units ---------- */
    // Unit = "a block element that directly holds inline content".
    //
    // The source treated only "leaf" elements matching a tag whitelist --
    // tr, p, li, h1-h6, pre, blockquote, dd, dt, figcaption, caption -- as
    // units. Because of that, changes to text held directly by div / span /
    // a / footer (a sidebar TOC link, a header date, a price inside a card,
    // etc.) went entirely undetected, and on top of that, deleted blocks
    // could end up scattered across container boundaries into unrelated
    // cards, callouts, or tables.
    //
    // Here, block elements are the unit, and each unit only covers "its own
    // inline text" (nested blocks are excluded since they're their own
    // separate unit). This keeps units from nesting and overlapping, and
    // also picks up the text described above.
    const BLOCK_TAGS = new Set([
      'ADDRESS','ARTICLE','ASIDE','BLOCKQUOTE','BODY','CAPTION','DD','DETAILS','DIALOG',
      'DIV','DL','DT','FIELDSET','FIGCAPTION','FIGURE','FOOTER','FORM','H1','H2','H3',
      'H4','H5','H6','HEADER','HGROUP','LEGEND','LI','MAIN','NAV','OL','P','PRE',
      'SECTION','SUMMARY','TABLE','TBODY','TD','TFOOT','TH','THEAD','TR','UL'
    ]);
    // A unit's boundary is properly decided by CSS display, not by tag name.
    // BLOCK_TAGS is just a fallback; normally it's decided by "the actual
    // display resolved via getComputedStyle after rendering both documents
    // in a hidden iframe" (classifyBlockBoundaries).
    //
    // Judging by tag name alone would, for example, treat a link blockified
    // by CSS like .toc a{display:block} as inline, collapsing the entire TOC
    // into a single unit so each link's addition/removal can't be expressed
    // independently. Conversely, a display:inline div would also be
    // misjudged. Note that per the CSS spec, flex/grid children get their
    // display blockified, so just reading the computed value automatically
    // satisfies "a flex item is its own independent unit" as well.
    //
    // display:none is also treated as a boundary. This avoids the situation
    // where it fails to become its own unit and gets mixed into its parent
    // (which would leak hidden text into a visible unit's diff).
    const BLOCKISH_DISPLAY = new Set([
      'block','flow-root','flex','grid','list-item','table','table-row','table-cell',
      'table-header-group','table-row-group','table-footer-group','table-caption','none'
    ]);
    let boundaryEls = null;    // Set<Element> -- elements judged to be boundaries
    let classifiedDocs = null; // Set<Document> -- documents already classified

    function classifyBlockBoundaries(doc){
      const win = doc.defaultView;
      if (!win) return false;
      for (const el of doc.querySelectorAll('*')){
        let d = null;
        try { d = win.getComputedStyle(el).display; } catch (e) { d = null; }
        const isB = d ? BLOCKISH_DISPLAY.has(d) : BLOCK_TAGS.has(el.tagName);
        if (isB) boundaryEls.add(el);
      }
      if (doc.body) boundaryEls.add(doc.body);
      classifiedDocs.add(doc);
      return true;
    }

    function isBlockEl(el){
      if (!el || el.nodeType !== 1) return false;
      // For an element in an already-classified document, trust that result (not present = inline)
      if (classifiedDocs && classifiedDocs.has(el.ownerDocument)) return boundaryEls.has(el);
      return BLOCK_TAGS.has(el.tagName);
    }

    function norm(s){ return (s || '').replace(/\s+/g, ' ').trim(); }
    // The inline text held directly by that element (excludes the contents of nested blocks)
    function ownText(el){ return textNodes(el).map(n => n.data).join(''); }

    /* ---------- 4. Text node manipulation ---------- */
    function textNodes(root){
      const out = [];
      const walk = n => {
        for (let c = n.firstChild; c; c = c.nextSibling){
          if (c.nodeType === 3){ if (c.data.length) out.push(c); }
          else if (c.nodeType === 1){
            const t = c.tagName;
            if (t === 'SCRIPT' || t === 'STYLE') continue;
            if (c.dataset && c.dataset.diff === 'del') continue; // don't count a del we inserted ourselves
            if (isBlockEl(c)) continue; // a nested block is its own separate unit, so exclude it
            walk(c);
          }
        }
      };
      walk(root);
      return out;
    }

    function wrapRange(root, start, end, cls){
      if (end <= start) return;
      const nodes = textNodes(root);
      const targets = [];
      let acc = 0;
      for (const n of nodes){
        const s = acc, e = acc + n.data.length; acc = e;
        if (e <= start || s >= end) continue;
        targets.push([n, Math.max(start, s) - s, Math.min(end, e) - s]);
      }
      for (let i = targets.length - 1; i >= 0; i--){
        const [n, from, to] = targets[i];
        let node = n;
        if (to < node.data.length) node.splitText(to);
        if (from > 0) node = node.splitText(from);
        const w = node.ownerDocument.createElement('ins');
        w.dataset.diff = cls;
        node.parentNode.insertBefore(w, node);
        w.appendChild(node);
      }
    }

    function insertDeleted(root, at, text){
      if (!text) return;
      const doc = root.ownerDocument;
      const mk = () => { const d = doc.createElement('del'); d.dataset.diff = 'del'; d.textContent = text; return d; };
      // Deleted text belongs to "the flow of the unit itself", so when the
      // insertion position lands exactly on the boundary of an inline
      // element (<a>/<span>/<code>/<strong> etc.), place it outside that
      // element rather than "inside" it. Naively inserting into n.parentNode
      // here would, for example, put the <del> inside the preceding <a> when
      // the trailing item is deleted, and it would inherit that <a>'s look
      // and layout (the same line, if display:block) -- even though the
      // deleted content isn't actually part of that <a>.
      const hoistAfter = (node) => {
        let x = node;
        while (x.parentNode && x.parentNode !== root && x.parentNode.lastChild === x) x = x.parentNode;
        return x;
      };
      const hoistBefore = (node) => {
        let x = node;
        while (x.parentNode && x.parentNode !== root && x.parentNode.firstChild === x) x = x.parentNode;
        return x;
      };
      const nodes = textNodes(root);
      let acc = 0;
      for (const n of nodes){
        const s = acc, e = acc + n.data.length; acc = e;
        if (at <= e){
          const local = at - s;
          if (local >= n.data.length){
            const t = hoistAfter(n);
            t.parentNode.insertBefore(mk(), t.nextSibling);
            return;
          }
          let node = n;
          if (local > 0) node = n.splitText(local);
          const t = hoistBefore(node);
          t.parentNode.insertBefore(mk(), t);
          return;
        }
      }
      root.appendChild(mk());
    }

    /* ---------- 5. Inline diff within a single container ---------- */
    // Diffing the inline text an element itself holds.
    //
    // For a wholesale rewrite, don't mix inline. It used to insert the
    // word-level diff as-is, so when a sentence was replaced entirely, it
    // turned into an unreadable interleaving like
    // "dev environment NAT Gateway batch processing config changeSpot
    // Instance interruption verification test". When the changed ratio
    // is high, show it instead as "block of old text" + "block of new text" side by side.
    const REPLACE_RATIO = 0.6;

    // For headings, the illegibility of interleaving is worse than in body
    // text, and headings are short anyway, so mixing gains nothing.
    // Real example: rewriting the heading "CP: per-tenant service account
    // conversion for JSM / JCP access" to "CP: switching to per-customer
    // service accounts" produced the unreadable single line "CP: JSM / JCP
    // access per-customer per-tenant service account conversion switching".
    // Headings alone switch to the old/new side-by-side layout at a lower threshold.
    const HEADING_REPLACE_RATIO = 0.3;
    const CELL_REPLACE_RATIO = 0.2;
    const HEADING_TAGS = new Set(['H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'DT', 'CAPTION', 'LEGEND', 'SUMMARY']);

    // Build a clone of the old element, preserving its look, for showing as
    // deleted. Block-level children are their own separate match targets, so
    // they're dropped from the clone (to prevent double display).
    function ownTextClone(oldEl, doc){
      const clone = doc.importNode(oldEl, true);
      const drop = [];
      for (let c = clone.firstElementChild; c; c = c.nextElementSibling){
        if (BLOCK_TAGS.has(c.tagName) || c.tagName === 'SCRIPT' || c.tagName === 'STYLE') drop.push(c);
      }
      drop.forEach(c => c.remove());
      return clone;
    }

    function diffOwnText(oldEl, newEl, tally){
      const oldText = oldEl ? ownText(oldEl) : '';
      const newText = ownText(newEl);
      if (oldText === newText) return false;
      // If only whitespace placement differs, there's no visible change, so
      // show nothing. When nesting depth changed, only the indentation
      // shifted, leaving empty ins/del elements dangling. pre / code are
      // excluded from this though, since whitespace itself carries meaning there.
      const ws = newEl.tagName === 'PRE' || newEl.tagName === 'CODE' || !!newEl.closest('pre');
      if (!ws && norm(oldText) === norm(newText)) return false;

      const oldToks = tokenize(oldText), newToks = tokenize(newText);
      const ops = diffSeq(oldToks, newToks);
      if (!ops){ // too large -> treat as a whole-block replacement
        markBlock(newEl, 'ins', tally, newText.length);
        return true;
      }

      // If the change is dominant, show it as a replacement instead of
      // mixing. This isn't usable, though, when the parent's content model
      // doesn't allow placing that element as a sibling (a table cell, for
      // instance) -- forcing an insertBefore there would add a cell to the
      // row and break the table's column count.
      // The change ratio is counted excluding whitespace. The tokenizer
      // turns a run of whitespace into a single token, so in text where
      // words are space-separated (like English), whitespace makes up
      // nearly half the tokens and always matches. That dilutes the change
      // ratio, so even two completely unrelated sentences would fail to
      // clear the threshold and end up interleaved word by word.
      const meaningful = t => /\S/.test(t);
      let changedToks = 0;
      for (const op of ops) if (op.op !== 0) for (const t of op.items) if (meaningful(t)) changedToks++;
      const totalToks = oldToks.filter(meaningful).length + newToks.filter(meaningful).length;
      const parent = newEl.parentNode;
      const canSplit = parent && parent.nodeType === 1
        && canHold(parent.tagName, oldEl ? oldEl.tagName : newEl.tagName);
      // Table cells are often short values, and mixing at the character
      // level makes them unreadable. "60% or less" -> "50% or less" would
      // show up as "6050% or less", and "$980" -> "$1,180" as "$9801,180" --
      // the old and new values looked like one continuous word. Instead,
      // place the old and new value side by side inside the cell so they can
      // be told apart by color. Adding sibling cells would break the row's
      // column count, so the replacement always has to stay self-contained
      // inside the cell.
      // The threshold can be set lower here because a cell has few tokens,
      // so even a small edit produces a large change ratio. A cell
      // containing a long sentence still gets mixed at the character level as before.
      const plainCell = (newEl.tagName === 'TD' || newEl.tagName === 'TH')
        && !newEl.firstElementChild && oldEl && !oldEl.firstElementChild;
      if (plainCell && oldToks.length && newToks.length && totalToks > 0
          && changedToks / totalToks > CELL_REPLACE_RATIO){
        const doc = newEl.ownerDocument;
        const d = doc.createElement('del'); d.dataset.diff = 'del'; d.textContent = oldText;
        const i = doc.createElement('ins'); i.dataset.diff = 'ins'; i.textContent = newText;
        newEl.textContent = '';
        newEl.appendChild(d); newEl.appendChild(i);
        tally.del += oldText.length; tally.add += newText.length; tally.blocks++;
        return true;
      }
      const ratio = HEADING_TAGS.has(newEl.tagName) ? HEADING_REPLACE_RATIO : REPLACE_RATIO;
      if (canSplit && oldToks.length && newToks.length && totalToks > 0
          && changedToks / totalToks > ratio){
        const clone = ownTextClone(oldEl, newEl.ownerDocument);
        clone.setAttribute('data-diff-block', 'del');
        tally.del += norm(oldText).length; tally.blocks++;
        parent.insertBefore(clone, newEl);
        markBlock(newEl, 'ins', tally, newText.length);
        return true;
      }

      const edits = [];
      let pos = 0;
      for (const op of ops){
        const text = op.items.join('');
        if (op.op === 0) pos += text.length;
        else if (op.op === 1){ edits.push({k:'ins', s:pos, e:pos + text.length}); pos += text.length; tally.add += text.length; }
        else { edits.push({k:'del', at:pos, text}); tally.del += text.length; }
      }
      edits.sort((x, y) => (y.k === 'ins' ? y.s : y.at) - (x.k === 'ins' ? x.s : x.at));
      for (const ed of edits){
        if (ed.k === 'ins') wrapRange(newEl, ed.s, ed.e, 'ins');
        else insertDeleted(newEl, ed.at, ed.text);
      }
      if (edits.length){ newEl.setAttribute('data-diff-row', 'changed'); tally.blocks++; }
      return edits.length > 0;
    }

    function markBlock(el, kind, tally, chars){
      el.setAttribute('data-diff-block', kind);
      if (kind === 'ins') tally.add += chars; else tally.del += chars;
    }

    // Represents an element whose attributes alone changed. When the text
    // was identical, it used to be treated as a perfect match and shown as
    // nothing, so a change like class="card" -> class="card recommended" --
    // "the look or meaning changed but the text stayed the same" -- vanished entirely.
    // Diagnostic attributes we add ourselves are excluded from comparison.
    const DIFF_OWN_ATTRS = new Set([
      'data-diff', 'data-diff-block', 'data-diff-row', 'data-diff-attr', 'data-diff-nolink', 'data-diff-pad',
      'data-diff-old-id'
    ]);

    function attrMap(el){
      const m = new Map();
      const list = el.attributes;
      for (let i = 0; i < list.length; i++){
        const a = list[i];
        if (DIFF_OWN_ATTRS.has(a.name)) continue;
        m.set(a.name, a.value);
      }
      return m;
    }

    function diffAttributes(oldEl, newEl, tally){
      if (!oldEl || !newEl || newEl.nodeType !== 1 || oldEl.nodeType !== 1) return;
      // Excluded because putting a box around the entire body would frame the whole screen
      if (newEl.tagName === 'BODY' || newEl.tagName === 'HTML') return;
      // If the whole element was added/removed, that alone already conveys it, so don't layer this on top
      if (newEl.hasAttribute('data-diff-block')) return;

      const om = attrMap(oldEl), nm = attrMap(newEl);
      const names = new Set();
      // Also show the "this element changed" mark when the tag itself
      // changed (h3 -> h2, ul -> ol). With no other clue when the text is
      // the same, promoting a heading's level would otherwise go unshown.
      if (oldEl.tagName !== newEl.tagName) names.add('tagName');
      om.forEach((v, k) => { if (nm.get(k) !== v) names.add(k); });
      nm.forEach((v, k) => { if (om.get(k) !== v) names.add(k); });
      if (!names.size) return;

      // Don't include the values (a style attribute or a long URL would break the display) -- keep only the names of the attributes that changed.
      newEl.setAttribute('data-diff-attr', Array.from(names).sort().join(','));
      tally.attrs = (tally.attrs || 0) + 1;
    }

    /* ---------- 6. Recursive diff, level by level ---------- */
    // This used to flatten the DOM into a flat array of "units" (block
    // elements holding inline text), run a Myers diff over that, and then
    // reconstruct the structure with heuristics afterward.
    // That was the source of serious corruption. When one item was
    // inserted/deleted among a run of similar containers, the flat sequence
    // shifted by one and everything after it got mispaired (the classic
    // alignment-collapse failure).
    // Real example: for before=[card1, cardNAT, cardS3] / after=[card1,
    // cardS3', cardSpot], "2. NAT Gateway consolidation" and "2. Applying
    // the S3 lifecycle rule" got paired off shared tokens like the leading
    // "2. " and particles, and the old/new card names, body text, and old
    // header all ended up crammed inside a single card's frame. In tables
    // too, a deleted row's cells leaked into the next row, fusing 2,800 and
    // 8,000 into one cell.
    //
    // So instead, children are matched level by level, and recursion happens
    // only on the pairs that matched. The insertion position is now trivially
    // determined by "within the same parent's child list", so the placement
    // heuristics (contextKey / levelsToSiblingOf / liftLevels / canContain /
    //  maximalDeletedContainer / placeDeletedBlock) became unnecessary and were removed entirely.
    // A safety net against runaway recursion, not intended as an actual
    // limit on nesting depth. When this was set to 60, a document with 150
    // levels of nested wrapper divs (not unusual in generated HTML) showed
    // none of its deepest changes at all. visitedPairs already guarantees
    // the same pair is never visited twice, so it's fine to keep this
    // generously deep.
    const MAX_DIFF_DEPTH = 500;

    // Identity key for a subtree. Uses the full text, so a card matches up with a card.
    function childKey(el){ return el.tagName + '␀' + norm(el.textContent); }

    function diffableChildren(el, blockOnly){
      const out = [];
      for (let c = el.firstElementChild; c; c = c.nextElementSibling){
        if (c.tagName === 'SCRIPT' || c.tagName === 'STYLE') continue;
        // Excluded: elements we inserted ourselves for the diff display
        if (c.hasAttribute('data-diff') || c.hasAttribute('data-diff-block')) continue;
        // Excluded: inline elements already handled by the parent's text diff (see the explanation below)
        if (blockOnly && !isBlockEl(c)) continue;
        out.push(c);
      }
      return out;
    }

    // An element's "identity text". Whether it's the same record being
    // edited, or a different record, is decided by whether the heading or
    // key column matches -- not by overlap of the full text.
    // For a table row, that's the first cell; for a card or section, it's the heading.
    function identityText(el){
      const h = el.querySelector('h1,h2,h3,h4,h5,h6,caption,legend,summary,dt,th');
      if (h) return norm(h.textContent);
      // Prefer the element's own text over its children's. Looking at
      // children first meant that for <li>Database design<ul>External
      // interface design</ul></li>, the identity ended up being the nested
      // "External interface design", which then matched a different item in
      // the old document, producing an unreadable mashup like "Database
      // designExternal indatabaseerface design".
      const own = norm(ownText(el));
      if (own) return own;
      const first = el.firstElementChild;
      if (first) return norm(first.textContent);
      return norm(el.textContent);
    }

    // Overlap ratio of the token bags
    function tokenOverlap(sa, sb){
      const ta = tokenize(sa), tb = tokenize(sb);
      if (!ta.length && !tb.length) return 1;
      if (!ta.length || !tb.length) return 0;
      const setA = new Set(ta);
      let hit = 0;
      for (const t of tb) if (setA.has(t)) hit++;
      return hit / Math.max(ta.length, tb.length);
    }

    // Overlap ratio dedicated to identity text. Tokens that are nothing but
    // a delimiter like a hyphen carry no identifying information, so they're
    // excluded from the comparison. Comparing with the symbols left in would
    // produce spurious overlap just from sharing the "-" symbol, even when
    // the first cell points to a different record entirely -- e.g. a table's
    // "mail-01" row and "app-02" row (measured overlap 1/3 ≈ .33). When
    // full-text overlap was also high thanks to shared words in the row
    // template (server/vCPU/GB, etc.), the combined score would just barely
    // clear the 0.4 threshold and collapse into "changed".
    function identityOverlap(sa, sb){
      const isMeaningful = t => /[\p{L}\p{N}]/u.test(t);
      const ta = tokenize(sa).filter(isMeaningful), tb = tokenize(sb).filter(isMeaningful);
      if (!ta.length && !tb.length) return 1;
      if (!ta.length || !tb.length) return 0;
      const setA = new Set(ta);
      let hit = 0;
      for (const t of tb) if (setA.has(t)) hit++;
      return hit / Math.max(ta.length, tb.length);
    }

    // Candidate score for a replacement pair. Looking only at the full text,
    // Japanese gets tokenized character by character, so even "different
    // records" can share a large number of common characters and clear the
    // threshold.
    // Real example: a table's Classic row and Pro Plus row were judged as
    // one pair just by sharing "$", ",", "0", and the characters of "user"
    // and "support", collapsing the row's deletion and addition into "changed".
    // So identity text (heading / key column) match is weighted equally
    // here. Raising or lowering a heading level (h3 -> h2) or changing a
    // list's kind (ul -> ol) is just "the same element's formatting
    // changed", not a different element. Requiring an exact tag-name match
    // would always fail to pair them, and a list whose contents were
    // identical would show up doubled as a whole deletion + addition. Bold
    // and italic are different elements technically, but as far as the
    // document's diff goes, it's just "the same phrase's formatting
    // changed". Treating them separately made the same phrase, with exactly
    // the same visible characters, show up twice -- once in red and once in
    // green (<i> -> <em>, <b> -> <strong>, etc.). <ins> / <del> are excluded
    // from any family, since we use those elements ourselves for marking.
    const TAG_FAMILY = {
      H1: 'heading', H2: 'heading', H3: 'heading', H4: 'heading', H5: 'heading', H6: 'heading',
      UL: 'list', OL: 'list',
      B: 'bold', STRONG: 'bold',
      I: 'italic', EM: 'italic'
    };
    function sameTagFamily(a, b){
      if (a.tagName === b.tagName) return true;
      const fa = TAG_FAMILY[a.tagName];
      return !!fa && fa === TAG_FAMILY[b.tagName];
    }

    // For table rows, when columns are added or removed, "the value of the
    // vanished column" and "the value of the new column" get mixed into the
    // full-text comparison, and the identity text (the first cell) shifts
    // just from a column being inserted at the front -- making even
    // unchanged rows look like different records. Measured: just adding one
    // column at the front split a row entirely into deletion + addition.
    // Judge instead by matching only the columns that remain in both tables.
    function rowPairTexts(oldTr, newTr){
      if (hasSpans(oldTr) || hasSpans(newTr)) return null;
      const oldTable = oldTr.closest('table'), newTable = newTr.closest('table');
      if (!oldTable || !newTable) return null;
      const cm = columnMap(oldTable, newTable);
      if (!cm) return null;
      // The raw cell list, before any marks are applied. Not using cellsOf here since it excludes marked cells.
      const raw = tr => {
        const out = [];
        for (let c = tr.firstElementChild; c; c = c.nextElementSibling)
          if (c.tagName === 'TD' || c.tagName === 'TH') out.push(c);
        return out;
      };
      const ca = raw(oldTr), cb = raw(newTr);
      const ta = [], tb = [];
      for (const col of cm.cols){
        if (col.o < 0 || col.n < 0) continue;
        if (!ca[col.o] || !cb[col.n]) continue;
        ta.push(norm(ca[col.o].textContent));
        tb.push(norm(cb[col.n].textContent));
      }
      if (!ta.length) return null;
      return { ia: ta[0], ib: tb[0], fa: ta.join(' '), fb: tb.join(' ') };
    }

    function nodeSimilarity(a, b){
      if (!sameTagFamily(a, b)) return 0;
      // Between table rows, identity text and full-text overlap are counted
      // using only the columns that remain in both tables. For a table whose
      // column count didn't change, "remaining columns" equals "all
      // columns", so this ends up computing nearly the same thing as the
      // general logic below, and the existing behavior (picking the right
      // row out of several similar ones, not pairing a row whose values were
      // entirely swapped out, etc.) is preserved as-is.
      if (a.tagName === 'TR' && b.tagName === 'TR'){
        const r = rowPairTexts(a, b);
        if (r) return 0.5 * identityOverlap(r.ia, r.ib) + 0.5 * tokenOverlap(r.fa, r.fb);
      }
      const full = tokenOverlap(norm(a.textContent), norm(b.textContent));
      const ia = identityText(a), ib = identityText(b);
      // An element with no separate identity text (same as the full text) is judged by full text alone, as before
      if (!ia && !ib) return full;
      if (ia === norm(a.textContent) && ib === norm(b.textContent)) return full;
      return 0.5 * identityOverlap(ia, ib) + 0.5 * full;
    }
    const PAIR_THRESHOLD = 0.4;

    function markInserted(el, tally){
      el.setAttribute('data-diff-block', 'ins');
      tally.add += norm(el.textContent).length; tally.blocks++;
    }
    function markDeleted(el, tally){
      el.setAttribute('data-diff-block', 'del');
      tally.del += norm(el.textContent).length; tally.blocks++;
    }

    // Whether the parent can structurally hold this child (only falls back to orphanBin when it can't)
    const CHILD_RULES = {
      UL: /^LI$/, OL: /^LI$/, DL: /^(DT|DD)$/,
      TABLE: /^(THEAD|TBODY|TFOOT|CAPTION|COLGROUP|TR)$/,
      THEAD: /^TR$/, TBODY: /^TR$/, TFOOT: /^TR$/, TR: /^(TD|TH)$/
    };
    function canHold(parentTag, childTag){
      // Adding a cell to a row is valid HTML but breaks the table's column
      // count, so it's forbidden. This actually let a deleted cell leak into
      // the new row, producing an 8-cell row in a 6-column-header table
      // (the same kind of breakage as the $2,800/$8,000 fused-cell case).
      if (parentTag === 'TR') return false;
      const r = CHILD_RULES[parentTag];
      return r ? r.test(childTag) : true;
    }

    // Search newParent's descendants for a text node that contains the given
    // string in its entirety. Used to judge "only the wrapping element was
    // removed", so anything already inside a marked element (like a deleted
    // clone) is excluded. When it can't be narrowed down to exactly one, the
    // position is treated as unresolvable, and the caller just suppresses the duplicate.
    function findUnwrapTarget(newParent, needle){
      const hits = [];
      const walk = node => {
        for (let c = node.firstChild; c; c = c.nextSibling){
          if (c.nodeType === 3){ if (c.data.indexOf(needle) >= 0) hits.push(c); }
          else if (c.nodeType === 1){
            if (c.hasAttribute('data-diff') || c.hasAttribute('data-diff-block')) continue;
            walk(c);
          }
        }
      };
      walk(newParent);
      return hits.length === 1 ? hits[0] : null;
    }

    // From the text node found, cut out just the phrase with splitText and
    // mark it as reformatted. Same procedure as wrapRange -- cutting the
    // tail first, then the head, avoids offset drift caused by the splitText
    // calls in between.
    function markUnwrapped(hitText, needle){
      const idx = hitText.data.indexOf(needle);
      let node = hitText;
      if (idx + needle.length < node.data.length) node.splitText(idx + needle.length);
      if (idx > 0) node = node.splitText(idx);
      const span = node.ownerDocument.createElement('span');
      span.setAttribute('data-diff-attr', 'tagName');
      node.parentNode.insertBefore(span, node);
      span.appendChild(node);
    }

    // Restore a deleted child element into the equivalent position within
    // the same parent in the new DOM. Both resolveGroups step 3) and the
    // case in diffNode where a child element has no match at all on the new
    // side funnel through this single path.
    function insertDeletedChild(newParent, oldKid, beforeNode, tally){
      // Check the possibility that the content didn't disappear -- only the
      // wrapping element was removed and the text fell back to plain
      // running text. For <strong>An important sentence pointing something
      // out</strong> where only the <strong> got dropped and it just became
      // plain text, this phrase would find no match in the child-to-child
      // pairing, get treated as deleted, and -- having nowhere else to go --
      // get duplicated in red at the end of the paragraph. The text is
      // clearly still there, so showing it as "deleted" isn't just
      // confusing, it's factually wrong. So the judgment is deliberately
      // conservative and relies only on the following conditions:
      // it's an inline element with no child elements (purely wraps text),
      // and a text node containing that exact string in its entirety can be found uniquely on the new side.
      if (!isBlockEl(oldKid) && !oldKid.firstElementChild){
        const needle = norm(oldKid.textContent);
        if (needle){
          const hit = findUnwrapTarget(newParent, needle);
          if (hit) markUnwrapped(hit, needle);
          // Even when it can't be pinned down uniquely, still avoid showing
          // a phrase that hasn't actually disappeared as a deleted
          // duplicate. Prioritize not falsely showing "deleted" over showing
          // nothing at all, and just leave the "changed" mark on the parent instead.
          else newParent.setAttribute('data-diff-row', 'changed');
          return null; // it hasn't disappeared, so tally.del isn't incremented
        }
      }
      const clone = newParent.ownerDocument.importNode(oldKid, true);
      markDeleted(clone, tally);
      // oldKid is an element from the old document, so closest('table') returns the old table
      padDeletedRow(clone, oldKid.closest('table'), newParent.closest('table'));
      if (!canHold(newParent.tagName, clone.tagName)){
        orphanBin(newParent.ownerDocument).appendChild(clone);
        return null;
      }
      if (beforeNode && beforeNode.parentNode === newParent) newParent.insertBefore(clone, beforeNode);
      else newParent.appendChild(clone);
      return clone;
    }

    // Match a "deletion run + addition run" using "best match". Comparing
    // them in sequential order would mispair everything once one item is
    // off by one, so pairs are settled starting from the highest-scoring combination.
    // The score required for a pair to form is decided by "how easily a
    // mismatch could happen". A spot where several siblings share the same
    // tag (a table row, a card, a list item) is judged strictly, since a
    // mismatch there would collapse two different records into one. On the
    // other hand, where that tag is the only element among its siblings
    // (a header, a footer, a standalone section, etc.), there's no way to
    // mismatch it, so the bar is relaxed. Using a flat PAIR_THRESHOLD for
    // both cases caused a <header> whose heading was merely rewritten to be
    // shown doubled, as a whole deletion + addition.
    const LONE_PAIR_THRESHOLD = 0.1;
    function pairThresholdFor(newParent, tag){
      let n = 0;
      for (let c = newParent.firstElementChild; c; c = c.nextElementSibling){
        if (c.tagName === tag && ++n > 1) return PAIR_THRESHOLD;
      }
      return LONE_PAIR_THRESHOLD;
    }

    // Resolve all the "deletion run + addition run" groups under a single
    // parent together. When these were processed closed off run by run,
    // Myers would sort a move across a distance into separate runs, so an
    // element that both moved and changed content could never be matched up
    // at all. Real example: when a card moved from 2nd to 3rd position while
    // its body and badge also changed, the deleted card and the added card
    // landed in different runs, and the edit's content became completely invisible.
    function resolveGroups(newParent, groups, tally, depth){
      const pairedDel = new Map(), usedIns = new Set();
      const key = (g, k) => g + ':' + k;
      const settle = (list) => {
        list.sort((x, y) => y.sc - x.sc);
        for (const c of list){
          if (pairedDel.has(key(c.gi, c.a)) || usedIns.has(key(c.gj, c.b))) continue;
          const oldEl = groups[c.gi].del[c.a], newEl2 = groups[c.gj].ins[c.b];
          pairedDel.set(key(c.gi, c.a), newEl2); usedIns.add(key(c.gj, c.b));
          diffNode(oldEl, newEl2, tally, depth + 1);
        }
      };

      // 1) First, best match within the same run. The threshold varies with how easily a mismatch could happen.
      const near = [];
      groups.forEach((g, gi) => {
        for (let a = 0; a < g.del.length; a++)
          for (let b = 0; b < g.ins.length; b++){
            const sc = nodeSimilarity(g.del[a], g.ins[b]);
            if (sc >= pairThresholdFor(newParent, g.ins[b].tagName)) near.push({ gi: gi, a: a, gj: gi, b: b, sc: sc });
          }
      });
      settle(near);

      // 2) Next, elements that "moved and also changed content" across
      //    runs. Wrongly linking these would collapse two different things
      //    into one, so this is limited strictly to cases where identity
      //    text like a heading matches exactly. Don't pair them when the
      //    content is also identical (a pure move needs to stay a
      //    deletion + addition, or the fact that it moved becomes invisible).
      const far = [];
      groups.forEach((g, gi) => {
        for (let a = 0; a < g.del.length; a++){
          if (pairedDel.has(key(gi, a))) continue;
          const oldEl = g.del[a], idA = identityText(oldEl);
          if (!idA) continue;
          groups.forEach((h, gj) => {
            if (gj === gi) return;
            for (let b = 0; b < h.ins.length; b++){
              const el = h.ins[b];
              if (usedIns.has(key(gj, b))) continue;
              if (!sameTagFamily(oldEl, el)) continue;
              if (identityText(el) !== idA) continue;
              if (childKey(el) === childKey(oldEl)) continue;
              far.push({ gi: gi, a: a, gj: gj, b: b, sc: nodeSimilarity(oldEl, el) });
            }
          });
        }
      });
      settle(far);

      // 3) Finalize whatever addition elements remain, and restore deletion
      //    elements relying on their adjacency in the old document. Placing
      //    one right after its "new counterpart" -- the element paired with
      //    whatever immediately preceded it -- preserves the original order.
      //    Only when there's no such clue does it get placed before the
      //    element right after the run. Without this, a table where every
      //    row changed a little would have deleted rows all drift to the end.
      groups.forEach((g, gi) => {
        for (let b = 0; b < g.ins.length; b++) if (!usedIns.has(key(gi, b))) markInserted(g.ins[b], tally);
      });
      groups.forEach((g, gi) => {
        let cursor = null;
        for (let a = 0; a < g.del.length; a++){
          const mate = pairedDel.get(key(gi, a));
          if (mate){ cursor = mate; continue; }
          let at = null;
          if (cursor && cursor.parentNode === newParent) at = cursor.nextSibling;
          else {
            for (let k = a + 1; k < g.del.length; k++){
              const nxt = pairedDel.get(key(gi, k));
              if (nxt && nxt.parentNode === newParent){ at = nxt; break; }
            }
            // When not a single element got matched, place it right before
            // the addition element that landed at the same position. The
            // deletion run and addition run point at the same position in
            // the sequence, so this keeps the ordering correct. Without
            // this, it would get appended to the end of the parent, and
            // inside a <p>, just the <em> would jump to the end of the sentence.
            if (!at){
              for (let k = 0; k < g.ins.length; k++){
                if (g.ins[k] && g.ins[k].parentNode === newParent){ at = g.ins[k]; break; }
              }
            }
            if (!at && g.before && g.before.parentNode === newParent) at = g.before;
          }
          cursor = insertDeletedChild(newParent, g.del[a], at, tally) || cursor;
        }
      });
    }

    // Column correspondence for a table. If a column is inserted or removed
    // in the middle, matching by index position drifts entirely, and
    // unrelated columns end up compared against each other (e.g. the old
    // "Status" column ending up matched to the new "Owner" column, fusing
    // values into something like "Yamadaactive"). So columns are matched
    // instead by the header row's cell contents, and that mapping is reused
    // for every row.
    const tableColMaps = new WeakMap();

    // A table with colspan / rowspan doesn't map index to column 1:1, so give up on mapping it
    function hasSpans(tr){
      for (let c = tr.firstElementChild; c; c = c.nextElementSibling){
        if (c.tagName !== 'TD' && c.tagName !== 'TH') continue;
        const cs = parseInt(c.getAttribute('colspan') || '1', 10);
        const rs = parseInt(c.getAttribute('rowspan') || '1', 10);
        if (cs > 1 || rs > 1) return true;
      }
      return false;
    }

    // Build "the merged column order" from the header row's contents. Each
    // element is { o, n }, where o is the column index in the old table and
    // n is the column index in the new table (-1 for the side with no
    // match). Computed once per new table and cached. To avoid clashing with
    // cellsOf's "exclude marked cells" behavior, the raw, not-yet-marked
    // cell list is counted directly here via firstElementChild.
    //
    // When only a new-to-old mapping was kept, there was no way to represent
    // a column that vanished, and a deleted column disappeared with no mark
    // at all (an asymmetric state where a deleted row got restored to its
    // proper position but a deleted column just lost its information).
    // Keeping the merged order lets a deleted column also be restored to its proper position.
    function columnMap(oldTable, newTable){
      let m = tableColMaps.get(newTable);
      if (m !== undefined) return m;
      m = null;
      const oldHead = oldTable.querySelector('tr'), newHead = newTable.querySelector('tr');
      if (oldHead && newHead && !hasSpans(oldHead) && !hasSpans(newHead)){
        const ok = [], nk = [];
        for (let c = oldHead.firstElementChild; c; c = c.nextElementSibling)
          if (c.tagName === 'TD' || c.tagName === 'TH') ok.push(norm(c.textContent));
        for (let c = newHead.firstElementChild; c; c = c.nextElementSibling)
          if (c.tagName === 'TD' || c.tagName === 'TH') nk.push(norm(c.textContent));
        const ops = ok.length && nk.length ? diffSeq(ok, nk, 20000) : null;
        if (ops){
          const cols = [];
          let oi = 0, ni = 0;
          for (const op of ops){
            for (let k = 0; k < op.items.length; k++){
              if (op.op === 0) cols.push({ o: oi++, n: ni++ });
              else if (op.op === 1) cols.push({ o: -1, n: ni++ });   // column that was added
              else cols.push({ o: oi++, n: -1 });                    // column that vanished
            }
          }
          // If a run of vanished columns is immediately followed by a run of
          // added columns of the same length, treat it as "the column at
          // that position got swapped out (a renamed column)" and pair them.
          // Otherwise, rewriting a single heading would split the column
          // into deletion + addition, and an entire row of otherwise
          // identical data cells would get drawn twice.
          const merged = [];
          for (let k = 0; k < cols.length; k++){
            let dEnd = k;
            while (dEnd < cols.length && cols[dEnd].o >= 0 && cols[dEnd].n < 0) dEnd++;
            const dLen = dEnd - k;
            if (dLen > 0){
              let iEnd = dEnd;
              while (iEnd < cols.length && cols[iEnd].o < 0 && cols[iEnd].n >= 0) iEnd++;
              if (iEnd - dEnd === dLen){
                for (let x = 0; x < dLen; x++) merged.push({ o: cols[k + x].o, n: cols[dEnd + x].n });
                k = iEnd - 1;
                continue;
              }
            }
            merged.push(cols[k]);
          }
          if (oi === ok.length && ni === nk.length) m = { cols: merged, oldCols: ok.length, newCols: nk.length };
        }
      }
      tableColMaps.set(newTable, m);
      return m;
    }

    // When the old and new documents have different column counts, putting a
    // deleted row back as-is breaks the column count. Real example: with the
    // old table having 5 columns and the new one 6 (an "Owner" column was
    // added), restoring the mail-01 row shifts its trailing status cell into
    // the new "Owner" column's position, making the whole table look off by
    // one column. Fill empty cells at the positions of newly added columns to line it back up.
    function padDeletedRow(clone, oldTable, newTable){
      if (clone.tagName !== 'TR' || !oldTable || !newTable) return;
      const info = columnMap(oldTable, newTable);
      if (!info) return;
      const cells = [];
      for (let c = clone.firstElementChild; c; c = c.nextElementSibling){
        if (c.tagName === 'TD' || c.tagName === 'TH') cells.push(c);
      }
      if (cells.length !== info.oldCols) return; // leave it alone if the column count is unexpected
      const doc = clone.ownerDocument;
      const tag = cells[0] && cells[0].tagName === 'TH' ? 'th' : 'td';
      // Rearrange into the merged column order. Columns the old row already
      // has are left as-is; empty cells are only added at the positions of columns that were added.
      for (let k = 0; k < info.cols.length; k++){
        if (info.cols[k].o >= 0) continue;
        const pad = doc.createElement(tag);
        pad.setAttribute('data-diff-pad', '');
        const at = clone.children[k] || null;
        if (at) clone.insertBefore(pad, at); else clone.appendChild(pad);
      }
    }

    // Table rows are matched using the header-derived column mapping
    // whenever possible. Adding or removing cells would throw off the
    // column count and break the table, so a row's cell count is never
    // changed. When the column mapping can't be used (there's a colspan, a
    // row's column count disagrees with the header, etc.), fall back to
    // matching by position as before. For columns that were added, mark the
    // new cells as additions; for columns that were removed, just mark the row.
    function cellsOf(tr){
      const out = [];
      for (let c = tr.firstElementChild; c; c = c.nextElementSibling){
        if (c.tagName !== 'TD' && c.tagName !== 'TH') continue;
        if (c.hasAttribute('data-diff') || c.hasAttribute('data-diff-block')) continue;
        out.push(c);
      }
      return out;
    }
    function diffTableRow(oldTr, newTr, tally, depth){
      const oc = cellsOf(oldTr), nc = cellsOf(newTr);
      let changed = false;

      // Match by column when the header-derived mapping is usable and both rows' column counts agree with the header
      const oldTable = oldTr.closest('table'), newTable = newTr.closest('table');
      let cm = null;
      if (oldTable && newTable && !hasSpans(oldTr) && !hasSpans(newTr)){
        const info = columnMap(oldTable, newTable);
        if (info && oc.length === info.oldCols && nc.length === info.newCols) cm = info;
      }

      if (cm){
        // The position to restore a vanished column's cell is right before
        // "the next column that still remains". Scan from the end to record that element.
        const anchors = new Array(cm.cols.length);
        let nextEl = null;
        for (let k = cm.cols.length - 1; k >= 0; k--){
          anchors[k] = nextEl;
          if (cm.cols[k].n >= 0) nextEl = nc[cm.cols[k].n];
        }
        for (let k = 0; k < cm.cols.length; k++){
          const col = cm.cols[k];
          if (col.o >= 0 && col.n >= 0){
            const before = nc[col.n].outerHTML;
            diffNode(oc[col.o], nc[col.n], tally, depth + 1);
            if (nc[col.n].outerHTML !== before) changed = true;
          } else if (col.n >= 0){
            markInserted(nc[col.n], tally); changed = true;   // a newly added column
          } else {
            // A vanished column. Same as a deleted row, restore it to its
            // proper position so it's clear it's gone. Every row (headers
            // included) gains the same single column, so the table stays
            // rectangular. Inserted directly here since insertDeletedChild forbids adding a cell to a row.
            const clone = newTr.ownerDocument.importNode(oc[col.o], true);
            markDeleted(clone, tally);
            const at = anchors[k];
            if (at && at.parentNode === newTr) newTr.insertBefore(clone, at);
            else newTr.appendChild(clone);
            changed = true;
          }
        }
      } else {
        // A table that can't be mapped (has colspan, column-count mismatch, etc.) falls back to matching by position, as before
        const n = Math.min(oc.length, nc.length);
        for (let i = 0; i < n; i++){
          const before = nc[i].outerHTML;
          diffNode(oc[i], nc[i], tally, depth + 1);
          if (nc[i].outerHTML !== before) changed = true;
        }
        for (let i = n; i < nc.length; i++){ markInserted(nc[i], tally); changed = true; }
        if (oc.length > nc.length) changed = true; // for removed columns, mark only (don't remove the cell)
      }

      if (changed) newTr.setAttribute('data-diff-row', 'changed');
    }

    const visitedPairs = new WeakMap();

    function diffNode(oldEl, newEl, tally, depth){
      depth = depth || 0;
      if (depth > MAX_DIFF_DEPTH) return;
      let seen = visitedPairs.get(oldEl);
      if (!seen){ seen = new WeakSet(); visitedPairs.set(oldEl, seen); }
      if (seen.has(newEl)) return;
      seen.add(newEl);

      // 0. Attribute changes (checked first, since meaning or appearance can change even when the text is the same)
      diffAttributes(oldEl, newEl, tally);

      // 1. Inline text directly held by this element
      // ownText only stops at nested blocks -- it still includes text from
      // inline descendants (like span). So if the same child element gets
      // matched again as an element after this diff was already applied to
      // it, a single change gets drawn twice. This actually turned
      // <td><span class="badge">Out of service</span></td> into 3 pieces:
      // <del>Out of service</del> + an inserted badge + a deleted badge.
      // When a text diff was applied, inline children are excluded from the matching below.
      let ownTextEdited = false;
      if (ownText(oldEl).trim() || ownText(newEl).trim()) ownTextEdited = diffOwnText(oldEl, newEl, tally);

      // 1b. Inline children are excluded from the matching below, but their
      // attribute changes are still picked up here. Leaving them excluded
      // entirely would drop href or datetime changes on a link or <time>
      // whose text also changed. Only compares elements at the same
      // position when their order and kind both match.
      if (ownTextEdited){
        const oldInline = [], newInline = [];
        for (let c = oldEl.firstElementChild; c; c = c.nextElementSibling)
          if (!isBlockEl(c) && c.tagName !== 'SCRIPT' && c.tagName !== 'STYLE') oldInline.push(c);
        for (let c = newEl.firstElementChild; c; c = c.nextElementSibling)
          if (!isBlockEl(c) && c.tagName !== 'SCRIPT' && c.tagName !== 'STYLE'
              && !c.hasAttribute('data-diff') && !c.hasAttribute('data-diff-block')) newInline.push(c);
        if (oldInline.length === newInline.length)
          for (let i = 0; i < oldInline.length; i++)
            if (oldInline[i].tagName === newInline[i].tagName) diffAttributes(oldInline[i], newInline[i], tally);
      }

      // 2. Table rows are aligned cell by cell (the cell count is never changed)
      if (oldEl.tagName === 'TR' && newEl.tagName === 'TR'){
        diffTableRow(oldEl, newEl, tally, depth);
        return;
      }

      // 3. Otherwise, match up the list of child elements
      const oldKids = diffableChildren(oldEl, ownTextEdited);
      const newKids = diffableChildren(newEl, ownTextEdited);
      if (!oldKids.length && !newKids.length) return;
      if (!oldKids.length){ for (const k of newKids) markInserted(k, tally); return; }
      if (!newKids.length){ for (const k of oldKids) insertDeletedChild(newEl, k, null, tally); return; }

      const ops = diffSeq(oldKids.map(childKey), newKids.map(childKey), 20000);
      if (!ops){ // when it's too large, settle for matching by position
        const m = Math.min(oldKids.length, newKids.length);
        for (let i = 0; i < m; i++) diffNode(oldKids[i], newKids[i], tally, depth + 1);
        for (let i = m; i < newKids.length; i++) markInserted(newKids[i], tally);
        for (let i = m; i < oldKids.length; i++) insertDeletedChild(newEl, oldKids[i], null, tally);
        return;
      }

      // Don't settle run by run immediately -- gather every run under this parent first, then resolve them all together
      const groups = [];
      let oi = 0, ni = 0, i = 0;
      while (i < ops.length){
        const op = ops[i];
        if (op.op === 0){
          for (let k = 0; k < op.items.length; k++, oi++, ni++) diffNode(oldKids[oi], newKids[ni], tally, depth + 1);
          i++; continue;
        }
        let delRun = [], insRun = [];
        if (op.op === -1){
          delRun = oldKids.slice(oi, oi + op.items.length); oi += op.items.length; i++;
          if (i < ops.length && ops[i].op === 1){ insRun = newKids.slice(ni, ni + ops[i].items.length); ni += ops[i].items.length; i++; }
        } else {
          insRun = newKids.slice(ni, ni + op.items.length); ni += op.items.length; i++;
          if (i < ops.length && ops[i].op === -1){ delRun = oldKids.slice(oi, oi + ops[i].items.length); oi += ops[i].items.length; i++; }
        }
        // Clue for where to restore the deletion = the next remaining child on the new-DOM side
        groups.push({ del: delRun, ins: insRun, before: newKids[ni] || null });
      }
      if (groups.length) resolveGroups(newEl, groups, tally, depth);
    }

    /* ---------- 7. The document as a whole ---------- */

    // Final cleanup. Guarantees the table stays rectangular even along paths
    // that don't go through column mapping (like a wholly added row). If the
    // columns aren't aligned, the table becomes unreadable before you can
    // even tell what changed, so this is guaranteed structurally, separately
    // from fixing the root cause. A table with colspan / rowspan isn't left
    // alone, since column and index aren't 1:1 there.
    function normalizeTables(doc){
      const tables = doc.querySelectorAll('table');
      for (const t of tables){
        // querySelectorAll('tr') also picks up rows from a nested table.
        // Treating those as this table's own rows while aligning columns
        // would pad out the outer table's column count because of a table placed inside a cell, breaking it.
        const rows = Array.from(t.querySelectorAll('tr')).filter(r => r.closest('table') === t);
        if (!rows.length) continue;
        if (rows.some(hasSpans)) continue;
        const widths = rows.map(r => r.children.length);
        const max = Math.max.apply(null, widths);
        for (let i = 0; i < rows.length; i++){
          for (let k = widths[i]; k < max; k++){
            const first = rows[i].firstElementChild;
            const pad = doc.createElement(first && first.tagName === 'TH' ? 'th' : 'td');
            pad.setAttribute('data-diff-pad', '');
            rows[i].appendChild(pad);
          }
        }
      }
    }

    function buildDiff(oldDoc, newDoc){
      const tally = {add:0, del:0, blocks:0, attrs:0};
      diffNode(oldDoc.body, newDoc.body, tally, 0);
      normalizeTables(newDoc);
      return tally;
    }

    function orphanBin(doc){
      let bin = doc.getElementById('__diff_removed__');
      if (!bin){
        bin = doc.createElement('div');
        bin.id = '__diff_removed__';
        bin.setAttribute('data-diff-block', 'del');
        const h = doc.createElement('p');
        h.textContent = '── 新版で削除され、挿入位置を特定できなかったブロック ──';
        bin.appendChild(h);
        doc.body.appendChild(bin);
      }
      return bin;
    }

    /* ---------- 8. Styles for the diff display ---------- */
    // If the marker is layered on while staying semi-transparent, the color
    // that actually appears on screen becomes a composite with whatever's
    // behind that element -- "the pasted document's own background color" --
    // so on a white background you get the intended red, but on a pale
    // yellow background it turns salmon, on a dark code block it turns
    // brown... and the color fractures across the document (the cause of a
    // report that the same del looked like 3 to 6 different colors

    let beforeFocused = false;
    let afterFocused = false;
    // The single-column / side-by-side choice is held in this one variable, shared across
    // Monaco / Markdown View / HTML View (toggled with the toolbar's Inline / Split button.
    // false = side-by-side, true = single-column/inline).
    let isInlineView = false;
    let isRichDiffView = false;
    let richViewMode = null; // 'markdown' | 'html' | null -- which Rich View is open (null when none is)
    let mdDiffedHtml = null; // sanitized diff HTML, built once by openMarkdownView; reused across single/split
    let htmlDiffedDocs = null; // {single, left, right}, built once by openHtmlView; reused across single/split

    const showToast = (msg) => {
      const t = document.getElementById('toast');
      t.innerText = msg || 'Diff URL copied to clipboard!';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    };

    // ===== Auto Save (sessionStorage: per-tab, so parallel tabs don't clobber each other) =====
    const AUTO_SAVE_KEY = 'diffToolAutoSave';
    let autoSaveTimer = null;

    function saveAutoSave() {
      try {
        sessionStorage.setItem(AUTO_SAVE_KEY, JSON.stringify({
          b: beforeModel.getValue(),
          a: afterModel.getValue(),
          l: document.getElementById('langSelect').value,
          m: isRichDiffView,
          vm: richViewMode
        }));
      } catch (e) {}
    }

    function scheduleAutoSave() {
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(saveAutoSave, 500);
    }

    function clearAutoSave() {
      clearTimeout(autoSaveTimer);
      try { sessionStorage.removeItem(AUTO_SAVE_KEY); } catch (e) {}
    }

    function restoreAutoSave() {
      let raw;
      try { raw = sessionStorage.getItem(AUTO_SAVE_KEY); } catch (e) { return; }
      if (!raw) return;
      try {
        const d = JSON.parse(raw);
        beforeModel.setValue(d.b || '');
        afterModel.setValue(d.a || '');
        if (d.l) {
          document.getElementById('langSelect').value = d.l;
          monaco.editor.setModelLanguage(beforeModel, d.l);
          monaco.editor.setModelLanguage(afterModel, d.l);
        }
        if (d.m) {
          // An old payload with no vm is treated as 'html' if the restored language is html,
          // otherwise as 'markdown'.
          const mode = d.vm || (d.l === 'html' ? 'html' : 'markdown');
          setTimeout(() => {
            if (isRichDiffView) return;
            const btn = document.getElementById(mode === 'html' ? 'htmlViewBtn' : 'richDiffBtn');
            if (btn) btn.click();
          }, 150);
        }
      } catch (e) {}
    }

    // ===== Markdown View Width Resizer Logic =====
    const mdResizers = document.querySelectorAll('.md-resizer');
    let isMdResizing = false;
    let activeResizerDir = null;

    mdResizers.forEach(resizer => {
      resizer.addEventListener('mousedown', (e) => {
        isMdResizing = true;
        activeResizerDir = resizer.getAttribute('data-dir');
        resizer.classList.add('dragging');
        document.body.classList.add('is-resizing');
      });
    });

    document.addEventListener('mousemove', (e) => {
      if (!isMdResizing) return;
      // Whenever the table of contents is showing, the "center" of the readable column isn't
      // the exact center of the screen -- it shifts right by half the TOC's width. This is
      // kept in sync with the calculation on the .md-resizer CSS side (see that comment).
      const tocW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--md-toc-w')) || 0;
      const center = (window.innerWidth + tocW) / 2;

      const dist = activeResizerDir === 'left' ? (center - e.clientX) : (e.clientX - center);
      let newWidth = dist * 2;

      if (newWidth < 400) newWidth = 400;
      if (newWidth > window.innerWidth - tocW - 64) newWidth = window.innerWidth - tocW - 64;

      document.documentElement.style.setProperty('--md-width', `${newWidth}px`);
    });

    document.addEventListener('mouseup', () => {
      if (isMdResizing) {
        isMdResizing = false;
        mdResizers.forEach(r => r.classList.remove('dragging'));
        document.body.classList.remove('is-resizing');
      }
    });

    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      
      const commonColors = {
        'scrollbar.shadow': '#00000000', 'editor.lineHighlightBorder': '#00000000',
        'sash.hoverBorder': '#00000000', 'diffEditor.diagonalFill': '#00000000'
      };

      monaco.editor.defineTheme('custom-vs-dark', { base: 'vs-dark', inherit: true, rules: [], colors: { ...commonColors, 'editor.background': '#1e1e1e' }});
      monaco.editor.defineTheme('custom-vs-light', { base: 'vs', inherit: true, rules: [], colors: { ...commonColors, 'editor.background': '#fffffe' }});
      monaco.editor.defineTheme('custom-github-dark', { base: 'vs-dark', inherit: true, rules: [], colors: { ...commonColors, 'editor.background': '#0d1117' }});
      monaco.editor.defineTheme('custom-noctis-hc', { 
        base: 'vs-dark', inherit: true, rules: [ { background: '000000' } ], 
        colors: { 
          ...commonColors, 'editor.background': '#000000', 'editor.foreground': '#ffffff',
          'diffEditor.insertedTextBackground': '#183a21', 'diffEditor.removedTextBackground': '#4b181a',
          'editorLineNumber.foreground': '#4f4f4f'
        }
      });
      
      applyTheme(document.getElementById('themeSelect').value);

      const savedFontSize = localStorage.getItem('diffToolFontSize') || '12';
      if (document.getElementById('fontSizeSelect')) document.getElementById('fontSizeSelect').value = savedFontSize;

      // Correction: apply "Monaco size + 2px" for standard proportional fonts
      const initialMdFontSize = parseInt(savedFontSize, 10) + 2;
      document.documentElement.style.setProperty('--md-font-size', `${initialMdFontSize}px`);

      const commonOptions = {
        language: 'markdown', wordWrap: 'on', automaticLayout: true, fontSize: parseInt(savedFontSize, 10),
        fontFamily: "'Source Han Mono', '源ノ等幅', 'Source Han Code JP', '源ノ角ゴシック Code JP', 'JetBrains Mono', 'Noto Sans Mono', Consolas, Menlo, monospace",
        fontLigatures: true, scrollBeyondLastLine: false, padding: { top: 16, bottom: 16 },
        lineNumbersMinChars: 2, lineDecorationsWidth: 12, folding: false, glyphMargin: false,               
        scrollbar: { verticalScrollbarSize: 8, horizontal: 'hidden', useShadows: false }, 
        hideCursorInOverviewRuler: true, renderLineHighlight: 'none',
        minimap: { enabled: false }, renderOverviewRuler: true,
        occurrencesHighlight: false,
        selectionHighlight: false,
        unicodeHighlight: { ambiguousCharacters: false, invisibleCharacters: false },
        smoothScrolling: true,
        cursorSmoothCaretAnimation: 'on',
      };

      beforeModel = monaco.editor.createModel('', 'markdown');
      afterModel = monaco.editor.createModel('', 'markdown');

      diffEditor = monaco.editor.createDiffEditor(document.getElementById('diffEditor'), {
        ...commonOptions, originalEditable: true, readOnly: false, renderSideBySide: true, ignoreTrimWhitespace: false,
        splitViewDefaultRatio: 0.5, enableSplitViewResizing: true, renderMarginRevertIcon: false, renderIndicators: false, diffCodeLens: false
      });

      diffEditor.setModel({ original: beforeModel, modified: afterModel });
      diffOrig = diffEditor.getOriginalEditor();
      diffMod = diffEditor.getModifiedEditor();
      
      diffOrig.updateOptions({ wordWrap: 'on', renderOverviewRuler: true });
      diffMod.updateOptions({ wordWrap: 'on', renderOverviewRuler: true });

      // Focus the before field so pasting can start right away after opening.
      diffOrig.focus();

      // Wait for the web font to finish loading, then force a character-width remeasure
      document.fonts.ready.then(() => {
        monaco.editor.remeasureFonts();
        if (diffEditor) diffEditor.layout();
      });

      document.getElementById('fontSizeSelect').addEventListener('change', (e) => {
        const size = parseInt(e.target.value, 10); localStorage.setItem('diffToolFontSize', e.target.value);
        diffEditor.updateOptions({ fontSize: size }); diffOrig.updateOptions({ fontSize: size }); diffMod.updateOptions({ fontSize: size });
        
        // Correction: keep "Monaco size + 2px" in sync for standard proportional fonts
        document.documentElement.style.setProperty('--md-font-size', `${size + 2}px`);
        rebuildChangeActions();
        // Changing the font size changes how many lines a block wraps to, which changes its
        // height too. Unlike a window-width change, ResizeObserver doesn't catch this (since
        // #richDiffViewer's own width doesn't change), so remeasure explicitly here.
        scheduleMdRealign();
        // The table of contents entries also change size in sync with --md-font-size, and
        // their line height changes too. The current-position highlight is decided by actually
        // measuring entry positions, so without remeasuring here it would look off right after
        // changing the font size.
        scheduleMdTocHighlight();
        if (htmlRealignHook) htmlRealignHook();
      });

      function updateLineNumberWidth(editor) {
        const lineCount = editor.getModel().getLineCount();
        const minChars = Math.max(2, String(lineCount).length + 1);
        editor.updateOptions({ lineNumbersMinChars: minChars });
      }

      [diffOrig, diffMod].forEach(editor => {
        updateLineNumberWidth(editor); editor.getModel().onDidChangeContent(() => updateLineNumberWidth(editor));
      });

      let changeElements = [];

      function rebuildChangeActions() {
        const container = document.getElementById('changeActions');
        if (!container) return;
        container.innerHTML = ''; changeElements = [];
        if (isInlineView) return;

        const changes = diffEditor.getLineChanges();
        if (!changes || changes.length === 0) return;

        changes.forEach((change) => {
          const group = document.createElement('div'); group.className = 'change-action-group';

          const btnAcceptRight = document.createElement('button'); btnAcceptRight.className = 'change-action-btn accept-right';
          btnAcceptRight.innerHTML = '&#x276D;'; btnAcceptRight.title = 'Apply original → modified';
          btnAcceptRight.addEventListener('click', (e) => { e.stopPropagation(); applyChangeToModified(change); });
          group.appendChild(btnAcceptRight);

          const btnAcceptLeft = document.createElement('button'); btnAcceptLeft.className = 'change-action-btn accept-left';
          btnAcceptLeft.innerHTML = '&#x276C;'; btnAcceptLeft.title = 'Apply modified → original';
          btnAcceptLeft.addEventListener('click', (e) => { e.stopPropagation(); applyChangeToOriginal(change); });
          group.appendChild(btnAcceptLeft);

          container.appendChild(group); changeElements.push({ change, el: group });
        });
        updateChangeActionsPosition();
      }

      function updateChangeActionsPosition() {
        if (changeElements.length === 0 || isInlineView) return;
        const mainContainer = document.getElementById('mainContainer');
        const mainRect = mainContainer.getBoundingClientRect();
        const origDom = diffOrig.getDomNode(); const modDom = diffMod.getDomNode();
        if (!origDom || !modDom) return;

        const origRect = origDom.getBoundingClientRect(); const modRect = modDom.getBoundingClientRect();
        const sashCenterX = ((origRect.right + modRect.left) / 2) - mainRect.left;
        const modScrollTop = diffMod.getScrollTop(); const origScrollTop = diffOrig.getScrollTop();
        const lineH = diffMod.getOption(monaco.editor.EditorOption.lineHeight);
        const editorTopInContainer = modRect.top - mainRect.top;

        changeElements.forEach(item => {
          const change = item.change; let midY;
          if (change.modifiedEndLineNumber === 0) {
            midY = (diffOrig.getTopForLineNumber(change.originalStartLineNumber) - origScrollTop + diffOrig.getTopForLineNumber(change.originalEndLineNumber) + lineH - origScrollTop) / 2 + editorTopInContainer;
          } else if (change.originalEndLineNumber === 0) {
            midY = (diffMod.getTopForLineNumber(change.modifiedStartLineNumber) - modScrollTop + diffMod.getTopForLineNumber(change.modifiedEndLineNumber) + lineH - modScrollTop) / 2 + editorTopInContainer;
          } else {
            midY = ((diffOrig.getTopForLineNumber(change.originalStartLineNumber) - origScrollTop + diffOrig.getTopForLineNumber(change.originalEndLineNumber) + lineH - origScrollTop + diffMod.getTopForLineNumber(change.modifiedStartLineNumber) - modScrollTop + diffMod.getTopForLineNumber(change.modifiedEndLineNumber) + lineH - modScrollTop) / 4) + editorTopInContainer;
          }
          if (midY < editorTopInContainer - 30 || midY > mainRect.height + 30) {
            item.el.style.display = 'none';
          } else {
            item.el.style.display = 'flex'; item.el.style.left = sashCenterX + 'px'; item.el.style.top = (midY - 10) + 'px';
          }
        });
      }

      let rafId; function onScroll() { cancelAnimationFrame(rafId); rafId = requestAnimationFrame(updateChangeActionsPosition); }
      document.getElementById('mainContainer').addEventListener('mousemove', (e) => {
        if (isInlineView || changeElements.length === 0) return;
        const origDom = diffOrig.getDomNode(); const modDom = diffMod.getDomNode();
        if (!origDom || !modDom) return;
        const origRect = origDom.getBoundingClientRect(); const modRect = modDom.getBoundingClientRect();
        const mouseX = e.clientX; const isNearSash = mouseX >= origRect.right - 40 && mouseX <= modRect.left + 40;
        changeElements.forEach(item => item.el.classList.toggle('visible', isNearSash));
      });
      document.getElementById('mainContainer').addEventListener('mouseleave', () => changeElements.forEach(item => item.el.classList.remove('visible')));

      function applyChangeToModified(change) {
        let textToInsert = ''; if (change.originalEndLineNumber !== 0) textToInsert = getOriginalLines(change.originalStartLineNumber, change.originalEndLineNumber);
        let range;
        if (change.modifiedEndLineNumber === 0) {
          const insertAt = change.modifiedStartLineNumber; const totalLines = afterModel.getLineCount();
          if (insertAt >= totalLines) {
            const lastLine = Math.max(1, totalLines); const lastCol = afterModel.getLineMaxColumn(lastLine);
            range = new monaco.Range(lastLine, lastCol, lastLine, lastCol); textToInsert = (lastLine === 1 && afterModel.getValue() === '' ? '' : '\n') + textToInsert;
          } else { range = new monaco.Range(insertAt + 1, 1, insertAt + 1, 1); textToInsert = textToInsert + '\n'; }
        } else {
          const startLine = change.modifiedStartLineNumber; const endLine = change.modifiedEndLineNumber;
          if (change.originalEndLineNumber === 0) {
            if (endLine < afterModel.getLineCount()) range = new monaco.Range(startLine, 1, endLine + 1, 1);
            else if (startLine > 1) range = new monaco.Range(startLine - 1, afterModel.getLineMaxColumn(startLine - 1), endLine, afterModel.getLineMaxColumn(endLine));
            else range = new monaco.Range(1, 1, endLine, afterModel.getLineMaxColumn(endLine));
          } else range = new monaco.Range(startLine, 1, endLine, afterModel.getLineMaxColumn(endLine));
        }
        afterModel.pushEditOperations([], [{ range, text: textToInsert }], () => null);
      }

      function applyChangeToOriginal(change) {
        let textToInsert = ''; if (change.modifiedEndLineNumber !== 0) textToInsert = getModifiedLines(change.modifiedStartLineNumber, change.modifiedEndLineNumber);
        let range;
        if (change.originalEndLineNumber === 0) {
          const insertAt = change.originalStartLineNumber; const totalLines = beforeModel.getLineCount();
          if (insertAt >= totalLines) {
            const lastLine = Math.max(1, totalLines); const lastCol = beforeModel.getLineMaxColumn(lastLine);
            range = new monaco.Range(lastLine, lastCol, lastLine, lastCol); textToInsert = (lastLine === 1 && beforeModel.getValue() === '' ? '' : '\n') + textToInsert;
          } else { range = new monaco.Range(insertAt + 1, 1, insertAt + 1, 1); textToInsert = textToInsert + '\n'; }
        } else {
          const startLine = change.originalStartLineNumber; const endLine = beforeModel.getLineCount();
          if (change.modifiedEndLineNumber === 0) {
            if (endLine < beforeModel.getLineCount()) range = new monaco.Range(startLine, 1, endLine + 1, 1);
            else if (startLine > 1) range = new monaco.Range(startLine - 1, beforeModel.getLineMaxColumn(startLine - 1), endLine, beforeModel.getLineMaxColumn(endLine));
            else range = new monaco.Range(1, 1, endLine, beforeModel.getLineMaxColumn(endLine));
          } else range = new monaco.Range(startLine, 1, change.originalEndLineNumber, beforeModel.getLineMaxColumn(change.originalEndLineNumber));
        }
        beforeModel.pushEditOperations([], [{ range, text: textToInsert }], () => null);
      }

      function getOriginalLines(start, end) { const lines = []; for (let i = start; i <= end; i++) lines.push(beforeModel.getLineContent(i)); return lines.join('\n'); }
      function getModifiedLines(start, end) { const lines = []; for (let i = start; i <= end; i++) lines.push(afterModel.getLineContent(i)); return lines.join('\n'); }

      diffEditor.onDidUpdateDiff(rebuildChangeActions);
      diffOrig.onDidScrollChange(onScroll); diffMod.onDidScrollChange(onScroll);
      window.addEventListener('resize', rebuildChangeActions);

      setTimeout(() => {
        const origNode = document.querySelector('.editor.original'); const modNode = document.querySelector('.editor.modified');
        if (origNode) origNode.appendChild(document.getElementById('beforePlaceholder'));
        if (modNode) modNode.appendChild(document.getElementById('afterPlaceholder'));
        updatePlaceholders();
      }, 100);

      document.getElementById('langSelect').addEventListener('change', (e) => {
        const lang = e.target.value; monaco.editor.setModelLanguage(beforeModel, lang); monaco.editor.setModelLanguage(afterModel, lang);
        saveAutoSave();
      });

      // ========== 👁️ Markdown View / HTML View functionality ==========
      const richDiffBtn = document.getElementById('richDiffBtn');
      const htmlViewBtn = document.getElementById('htmlViewBtn');
      const diffEditorContainer = document.getElementById('diffEditor');
      const richDiffViewer = document.getElementById('richDiffViewer');
      const htmlDiffFrame = document.getElementById('htmlDiffFrame');
      const htmlSplitContainer = document.getElementById('htmlSplitContainer');
      const htmlDiffFrameLeft = document.getElementById('htmlDiffFrameLeft');
      const htmlDiffFrameRight = document.getElementById('htmlDiffFrameRight');
      const htmlSplitDivider = document.getElementById('htmlSplitDivider');
      const changeActionsContainer = document.getElementById('changeActions');
      const jumpControls = document.querySelector('.jump-controls');

      // Whether to show the diff-jump buttons. The inputs to this decision (which view, single
      // column or side-by-side) are scattered across three things and called from many places,
      // so keep it in one spot.
      //   Monaco     ... only for the side-by-side split. Single-column has no defined
      //                  line-level jump target
      //   Markdown   ... shown for both single-column and side-by-side
      //   HTML View  ... not supported yet, so never shown
      function updateJumpControlsVisibility() {
        if (!jumpControls) return;
        const show = isRichDiffView ? richViewMode === 'markdown' : !isInlineView;
