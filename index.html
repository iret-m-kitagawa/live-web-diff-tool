        // alignSplitPanes below would measure the split view while the panel-width margin
        // has not been applied yet).
        updateMdToc();

        // The single-column / split choice is shared with the toolbar's isInlineView
        // (false = split, true = single-column. The initial value is false, so this
        // defaults to split as well).
        const mdViewSplit = !isInlineView;

        richDiffViewer.classList.toggle('split-mode', mdViewSplit);
        // display is re-specified inline every time. Note that inline styles always take
        // priority over the stylesheet, so a class rule alone -- .split-mode { display:
        // flex } -- does not take effect (it would stay stuck at block).
        richDiffViewer.style.display = mdViewSplit ? 'flex' : 'block';

        if (!mdViewSplit) {
          // Single-column view: pour in the sanitized HTML as-is, but so that the TOC's
          // jump target can be looked up by the same key (data-sync-index) in
          // single-column view too, run it through markSyncIndex before inserting, same as
          // split view (this only adds an attribute and does not affect appearance).
          const inlineWrap = document.createElement('div');
          inlineWrap.innerHTML = mdDiffedHtml;
          markSyncIndex(inlineWrap);
          richDiffViewer.innerHTML = inlineWrap.innerHTML;
          mdResizers.forEach(r => r.style.display = 'flex');
          // Release the split view references. The old leftPane/rightPane get detached
          // from the DOM by the innerHTML swap, so from now on realignMdSplit /
          // ResizeObserver just pass through here (no leftover margin or event
          // subscription).
          mdSplitLeftPane = null;
          mdSplitRightPane = null;
          mdSplitDivider = null;
        } else {
          // Split view: parse the same HTML string twice, stripping additions from one
          // side and deletions from the other. Never strip ins/del by "tag name" -- GFM's
          // ~~strikethrough~~ turns into <del>, so stripping by tag name would also remove
          // strikethrough that was already in the source document. Look only at the
          // classes HtmlDiff attaches (diffins/diffmod/diffdel) and remove() element by
          // element.
          const leftPane = document.createElement('div');
          leftPane.className = 'md-split-pane md-split-left markdown-body';
          leftPane.innerHTML = mdDiffedHtml;
          // Assign indices before filtering -- at the stage where the left and right
          // structures are still completely identical. This becomes the left/right
          // correspondence table as-is, so there is no need to infer correspondence
          // afterward.
          markSyncIndex(leftPane);
          stripMarked(leftPane, 'ins.diffins, ins.diffmod');

          const rightPane = document.createElement('div');
          rightPane.className = 'md-split-pane md-split-right markdown-body';
          rightPane.innerHTML = mdDiffedHtml;
          markSyncIndex(rightPane);
          stripMarked(rightPane, 'del.diffdel, del.diffmod');

          const divider = document.createElement('div');
          divider.className = 'md-split-divider';
          // The panes are rebuilt on every render, so the handle's event binding is also done here every time.
          divider.addEventListener('mousedown', beginMdSplitResize);

          richDiffViewer.innerHTML = '';
          richDiffViewer.appendChild(leftPane);
          richDiffViewer.appendChild(divider);
          richDiffViewer.appendChild(rightPane);

          // The width resizer exists for "a readable single-column width", so it is
          // meaningless in split view. Just hide it and leave --md-width itself untouched
          // (so that switching back to single-column view restores the original width).
          mdResizers.forEach(r => r.style.display = 'none');

          // leftPane/rightPane are newly rebuilt on every call, so the height-alignment
          // target shares their fate with the panes. When switching back to single-column
          // view (the branch above swaps richDiffViewer.innerHTML wholesale), these
          // elements are discarded along with everything else -- no dangling references
          // are left behind.
          mdSplitLeftPane = leftPane;
          mdSplitRightPane = rightPane;
          mdSplitDivider = divider;
          watchImagesForRealign(leftPane);
          watchImagesForRealign(rightPane);
          // On the first render we want it aligned from the moment it opens, so align it
          // synchronously here instead of waiting for rAF (scheduleMdRealign).
          alignSplitPanes(leftPane, rightPane, divider);
          mdLastAlignWidth = richDiffViewer.clientWidth;
        }
      }

      // A function that only redraws htmlDiffedDocs ({single, left, right}, built once)
      // into #htmlDiffFrame / #htmlSplitContainer according to the current mode
      // (single-column / split). This never retakes the diff either. Every single-column
      // <-> split switch only needs to call this.
      function renderHtmlView() {
        if (htmlDiffedDocs === null) return;
        const split = !isInlineView;

        if (!split) {
          // Single-column view: pour single into the single #htmlDiffFrame as before
          htmlDiffFrame.srcdoc = htmlDiffedDocs.single;
          htmlDiffFrame.style.display = 'block';
          htmlSplitContainer.classList.remove('visible');
          htmlDiffFrameLeft.removeAttribute('srcdoc');
          htmlDiffFrameRight.removeAttribute('srcdoc');
          // Leaving split view, so reset the subscription state, generation number, and
          // iframe height settings all back to their defaults (so no leftover margin or
          // event is left behind).
          resetHtmlAlignState();
        } else {
          // Split view: does not use #htmlDiffFrame, and instead places two dedicated
          // frames (left/right) side by side. sandbox is the same as #htmlDiffFrame --
          // allow-scripts allow-popups only (allow-same-origin is not added).
          htmlDiffFrame.style.display = 'none';
          htmlDiffFrame.removeAttribute('srcdoc');
          htmlDiffFrameLeft.srcdoc = htmlDiffedDocs.left;
          htmlDiffFrameRight.srcdoc = htmlDiffedDocs.right;
          htmlSplitContainer.classList.add('visible');
          // Since srcdoc was replaced, 'load' will eventually arrive from both iframes,
          // and each load handler will trigger scheduleHtmlRealign. Here it is enough to
          // just set the flag (at this point the injected script inside has not run yet,
          // so measuring now would be meaningless).
          htmlSplitActive = true;
        }
      }

      // ---- Open the Markdown View ----
      // The order marked.parse -> HtmlDiff.execute -> DOMPurify.sanitize is invariant. In
      // between it only inserts blockPairedHtmlDiff (decide correspondence at the block
      // level before running HtmlDiff) and balanceDiffTags (fix up tag balance --
      // untouched for output that is already balanced).
      function openMarkdownView() {
        try {
          const bText = beforeModel.getValue();
          const aText = afterModel.getValue();

          const bHtml = marked.parse(bText);
          const aHtml = marked.parse(aText);

          if (typeof HtmlDiff === 'undefined') throw new Error("HtmlDiff library is missing");
          // Decide block correspondence first (blockPairedHtmlDiff), then fix tag balance
          // before handing off (kept as a safety net -- see each function's comments).
          const diffedHtml = balanceDiffTags(blockPairedHtmlDiff(bHtml, aHtml));

          if (typeof DOMPurify === 'undefined') throw new Error("DOMPurify library is missing");
          // Build the diff exactly once here and keep it. Every single-column <-> split
          // switch only has renderMarkdownView reuse this -- execution never comes back
          // here.
          mdDiffedHtml = DOMPurify.sanitize(diffedHtml);
          renderMarkdownView();

          // Instead of hiding the Monaco editor with display: none, park it off-screen with absolute positioning
          diffEditorContainer.style.position = 'absolute';
          diffEditorContainer.style.left = '-9999px';
          diffEditorContainer.style.visibility = 'hidden';

          changeActionsContainer.style.display = 'none';
          htmlDiffFrame.style.display = 'none';
          htmlDiffFrame.removeAttribute('srcdoc');
          htmlSplitContainer.classList.remove('visible');
          htmlDiffFrameLeft.removeAttribute('srcdoc');
          htmlDiffFrameRight.removeAttribute('srcdoc');
          resetHtmlAlignState();
          // richDiffViewer.style.display has already been set by renderMarkdownView to
          // match the current mode (block/flex)

          richDiffBtn.classList.add('active');
          htmlViewBtn.classList.remove('active');
          isRichDiffView = true;
          richViewMode = 'markdown';
          updateJumpControlsVisibility();
          saveAutoSave();
        } catch (error) {
          console.error("Markdown View Render Error:", error);
          restoreMonacoView();
          showToast('⚠️ Markdown Viewの生成に失敗しました');
        }
      }

      // ---- Open the HTML View (ported rich-html-diff engine) ----
      let htmlRenderSeq = 0;
      // The return value is "whether it opened". This exists so that when re-opening fails
      // (e.g. because a swap left AFTER with no elements), the caller can clean up so the
      // previous render does not linger. When opening from the button, the return value can
      // be ignored.
      async function openHtmlView() {
        const bText = beforeModel.getValue();
        const aText = afterModel.getValue();

        // Sanity check: only when the AFTER text contains no elements at all (nothing that
        // can be interpreted as HTML) do we leave the View unopened and keep the Monaco
        // display. Fragmentary or broken HTML is left as-is and allowed through, since the
        // browser auto-corrects it.
        const sanityDoc = new DOMParser().parseFromString(aText, 'text/html');
        if (!sanityDoc.body || sanityDoc.body.children.length === 0) {
          showToast('⚠️ HTML として解釈できる要素がありません');
          return false;
        }

        try {
          // Async because rendering involves a wait. On consecutive clicks, only the last request is reflected.
          const seq = ++htmlRenderSeq;
          const docs = await renderHtmlDiffDocument(bText, aText);
          if (seq !== htmlRenderSeq) return;
          // Keep the three variants (single-column/before/after) exactly once here. Every
          // single-column <-> split switch only has renderHtmlView reuse this -- execution
          // never comes back here.
          htmlDiffedDocs = docs;
          // The number of passes height alignment needs to "process deeper flows first".
          // The value buildHtmlDiffOutput brought back as markHtmlSyncIndex's return
          // value.
          htmlSyncMaxDepth = docs.maxFlowDepth || 0;
          renderHtmlView();

          // Instead of hiding the Monaco editor with display: none, park it off-screen with absolute positioning
          diffEditorContainer.style.position = 'absolute';
          diffEditorContainer.style.left = '-9999px';
          diffEditorContainer.style.visibility = 'hidden';

          changeActionsContainer.style.display = 'none';
          richDiffViewer.style.display = 'none';
          hideMdToc(); // Also clear the TOC when moving straight from the Markdown View to the HTML View
          mdResizers.forEach(r => r.style.display = 'none');
          // The display of htmlDiffFrame / htmlSplitContainer has already been set by
          // renderHtmlView to match the current mode

          htmlViewBtn.classList.add('active');
          richDiffBtn.classList.remove('active');
          isRichDiffView = true;
          richViewMode = 'html';
          updateJumpControlsVisibility();
          saveAutoSave();
          return true;
        } catch (error) {
          console.error("HTML View Render Error:", error);
          restoreMonacoView();
          showToast('⚠️ HTML Viewの生成に失敗しました');
          return false;
        }
      }

      richDiffBtn.addEventListener('click', () => {
        if (isRichDiffView && richViewMode === 'markdown') { restoreMonacoView(); return; }
        openMarkdownView();
      });

      htmlViewBtn.addEventListener('click', () => {
        if (isRichDiffView && richViewMode === 'html') { restoreMonacoView(); return; }
        openHtmlView();
      });

      // ==============================================================

      document.getElementById('swapBtn').addEventListener('click', async () => {
        const temp = beforeModel.getValue(); beforeModel.setValue(afterModel.getValue()); afterModel.setValue(temp);
        updatePlaceholders();
        // If the Markdown / HTML View is open, retake its diff too. Switching
        // single-column <-> split (setViewMode) only needs a redraw, but swapping changes
        // the diff itself, so call openMarkdownView / openHtmlView, which amounts to
        // re-opening (both are built so that calling them again while already open is
        // fine).
        if (!isRichDiffView) return;
        if (richViewMode === 'markdown') openMarkdownView();
        // The swap can leave the AFTER side with no elements (e.g. swapping a diff that
        // was a wholesale addition). In that case the HTML View cannot be re-opened, so
        // fall back to Monaco without leaving the old render behind.
        else if (richViewMode === 'html' && !(await openHtmlView())) restoreMonacoView();
      });

      const inlineViewBtn = document.getElementById('inlineViewBtn');
      const splitViewBtn = document.getElementById('splitViewBtn');

      // Select whichever side was pressed. Pressing the same one again does nothing (to
      // avoid the wasted work of redrawing the Markdown / HTML View).
      function setViewMode(inline) {
        if (isInlineView === inline) return;
        isInlineView = inline;
        inlineViewBtn.classList.toggle('active', isInlineView);
        splitViewBtn.classList.toggle('active', !isInlineView);

        diffEditor.updateOptions({ renderSideBySide: !isInlineView });
        updateJumpControlsVisibility();
        updatePlaceholders(); rebuildChangeActions();

        // If the Markdown View / HTML View is open, match its single-column <-> split
        // state as well. Since the state is shared via isInlineView, it is enough to just
        // redraw whichever one is open (the diff is not retaken).
        if (richViewMode === 'markdown') renderMarkdownView();
        else if (richViewMode === 'html') renderHtmlView();
      }

      inlineViewBtn.addEventListener('click', () => setViewMode(true));
      splitViewBtn.addEventListener('click', () => setViewMode(false));

      const updatePlaceholders = () => {
        const beforeHasText = beforeModel.getValue().length > 0; const afterHasText = afterModel.getValue().length > 0;
        const bPh = document.getElementById('beforePlaceholder'); const aPh = document.getElementById('afterPlaceholder');
        if (bPh) bPh.style.opacity = (beforeHasText || beforeFocused) ? '0' : '1';
        if (aPh) {
          if (isInlineView) aPh.style.opacity = (beforeHasText || afterHasText || beforeFocused || afterFocused) ? '0' : '1';
          else aPh.style.opacity = (afterHasText || afterFocused) ? '0' : '1';
        }
        diffOrig.updateOptions({ lineNumbers: (beforeHasText || beforeFocused) ? 'on' : 'off' }); diffMod.updateOptions({ lineNumbers: (afterHasText || afterFocused) ? 'on' : 'off' });
      };

      diffOrig.onDidFocusEditorWidget(() => { beforeFocused = true; updatePlaceholders(); });
      diffOrig.onDidBlurEditorWidget(() => { beforeFocused = false; updatePlaceholders(); });
      diffMod.onDidFocusEditorWidget(() => { afterFocused = true; updatePlaceholders(); });
      diffMod.onDidBlurEditorWidget(() => { afterFocused = false; updatePlaceholders(); });

      beforeModel.onDidChangeContent(updatePlaceholders); afterModel.onDidChangeContent(updatePlaceholders);
      beforeModel.onDidChangeContent(scheduleAutoSave); afterModel.onDidChangeContent(scheduleAutoSave);

      const jump = (dir) => {
        // When the Markdown View is open, walk through the rendered blocks instead of
        // Monaco lines (the HTML View is not supported yet, so the button itself is not
        // shown).
        if (isRichDiffView) {
          if (richViewMode === 'markdown') mdJumpToDiff(dir);
          return;
        }
        if (!diffEditor) return; const changes = diffEditor.getLineChanges(); if (!changes || changes.length === 0) return;
        const modifiedEditor = diffEditor.getModifiedEditor(); const currentLine = modifiedEditor.getPosition().lineNumber;
        let target;
        if(dir === 'next') target = changes.find(c => c.modifiedStartLineNumber > currentLine) || changes[0];
        else { const prevs = changes.filter(c => c.modifiedStartLineNumber < currentLine); target = prevs.length > 0 ? prevs[prevs.length - 1] : changes[changes.length - 1]; }
        modifiedEditor.revealLineInCenter(target.modifiedStartLineNumber); modifiedEditor.setPosition({ lineNumber: target.modifiedStartLineNumber, column: 1 }); modifiedEditor.focus();
      };
      document.getElementById('nextDiffBtn').addEventListener('click', () => jump('next')); document.getElementById('prevDiffBtn').addEventListener('click', () => jump('prev'));

      function setupEditorDrop(editorInstance, model) {
        const container = editorInstance.getContainerDomNode();
        container.addEventListener('dragover', (e) => { e.preventDefault(); container.classList.add('drag-over'); });
        container.addEventListener('dragleave', () => container.classList.remove('drag-over'));
        container.addEventListener('drop', (e) => {
          e.preventDefault(); container.classList.remove('drag-over');
          if (e.dataTransfer.files.length > 0) {
            const r = new FileReader(); r.onload = (ev) => { model.setValue(ev.target.result); updatePlaceholders(); }; r.readAsText(e.dataTransfer.files[0]);
          }
        });
      }
      setTimeout(() => { setupEditorDrop(diffOrig, beforeModel); setupEditorDrop(diffMod, afterModel); }, 100);
      loadFromUrl();
      // When ?token= is present (opened from a local server the CLI started), loadFromServer()
      // pours in the content, so auto-restore is not done (it would overwrite the content
      // that came from the server).
      // When ?token= is absent, the behavior is left completely unchanged from before.
      if (new URLSearchParams(window.location.search).get('token')) {
        loadFromServer();
        // Copy Diff URL builds "the URL of the page currently being viewed + its
        // contents". A page opened via the CLI runs on a one-off port, and once the server
        // stops the link's destination disappears. This would hand out URLs the recipient
        // cannot open, so hide it.
        const share = document.getElementById('shareBtn');
        if (share) share.style.display = 'none';
      } else if (!window.location.hash) {
        restoreAutoSave();
      }
      setTimeout(updatePlaceholders, 150);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      beforeModel.setValue(''); afterModel.setValue('');
      window.history.replaceState(null, null, window.location.pathname);
      beforeFocused = false; afterFocused = false;
      clearAutoSave();
    });

    // Async compression via LZMA
    document.getElementById('shareBtn').addEventListener('click', () => {
      const btn = document.getElementById('shareBtn');
      const originalHtml = btn.innerHTML;
      btn.innerHTML = '⏳ Compressing...';
      btn.style.pointerEvents = 'none';

      const lang = document.getElementById('langSelect').value;
      const data = JSON.stringify({
        b: beforeModel.getValue(),
        a: afterModel.getValue(),
        l: lang,
        m: isRichDiffView,
        vm: richViewMode
      });

      LZMA.compress(data, 9, function(result, error) {
        btn.innerHTML = originalHtml;
        btn.style.pointerEvents = 'auto';

        if (error) {
          showToast('⚠️ 圧縮に失敗しました');
          return;
        }

        let binary = '';
        for (let i = 0; i < result.length; i++) {
          binary += String.fromCharCode(result[i] & 0xff);
        }
        const base64Url = btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        
        const url = window.location.href.split('#')[0] + '#' + base64Url;

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(url).then(() => showToast('Diff URL copied to clipboard!'));
        } else {
          const ta = document.createElement("textarea"); ta.value = url; ta.style.position = "fixed"; ta.style.left = "-9999px";
          document.body.appendChild(ta); ta.focus(); ta.select();
          try { document.execCommand('copy'); showToast('Diff URL copied to clipboard!'); } catch (err) {}
          document.body.removeChild(ta);
        }
      });
    });

    // Async decompression via LZMA
    function loadFromUrl() {
      const h = window.location.hash.slice(1);
      if (h && beforeModel) {
        try {
          let base64 = h.replace(/-/g, '+').replace(/_/g, '/');
          while (base64.length % 4) { base64 += '='; }
          const binary = atob(base64);
          
          const bytes = new Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }

          LZMA.decompress(bytes, function(result, error) {
            if (error || !result) return;
            try {
              const d = JSON.parse(result);
              beforeModel.setValue(d.b || ''); afterModel.setValue(d.a || ''); 
              if (d.l) {
                document.getElementById('langSelect').value = d.l;
                monaco.editor.setModelLanguage(beforeModel, d.l); monaco.editor.setModelLanguage(afterModel, d.l);
              }

              if (d.m) {
                // For old payloads without vm, treat it as 'html' if the restored language is html, otherwise 'markdown'.
                const mode = d.vm || (d.l === 'html' ? 'html' : 'markdown');
                setTimeout(() => {
                  if (isRichDiffView) return;
                  const btn = document.getElementById(mode === 'html' ? 'htmlViewBtn' : 'richDiffBtn');
                  if (btn) btn.click();
                }, 150);
              }
            } catch (e) {}
          });
        } catch (e) {
          console.error("URL Load Error:", e);
        }
      }
    }

    // Detect URL hash changes
    window.addEventListener('hashchange', loadFromUrl);

    // ===== Loading from the server (?token=) =====
    // The path that receives content from the local server the richdiff CLI started. It
    // plays the same "pour content in from outside at startup" role as hash restoration
    // (loadFromUrl), but differs in that the input source is ?token= instead of
    // location.hash, the fetch target is /payload.json, and it can hold multiple files
    // switchable via #fileSelect.
    let serverFiles = null;   // payload.files obtained via ?token=. Stays null when not used via the server

    // Applies one file's worth of content to Monaco / langSelect / the Rich View.
    // Called both from the initial load and from switching via #fileSelect.
    function applyServerFile(file) {
      if (!file || !beforeModel || !afterModel) return;

      // If a Rich View (Markdown/HTML) is open, fall back to Monaco's raw text display
      // once, regardless of what view we are switching to. If only the content is swapped
      // while it stays open, the old View stays as-is and does not reflect the new
      // content.
      if (isRichDiffView) {
        const activeBtn = document.getElementById(richViewMode === 'html' ? 'htmlViewBtn' : 'richDiffBtn');
        if (activeBtn) activeBtn.click();
      }

      beforeModel.setValue(file.before || '');
      afterModel.setValue(file.after || '');

      const lang = file.lang || (file.view === 'html' ? 'html' : file.view === 'markdown' ? 'markdown' : 'plaintext');
      // Monaco can handle more languages than the options listed in langSelect. When a
      // language that is not listed comes in, the select's value becomes empty and the
      // toolbar's language field goes blank, so add the option on the spot before
      // selecting it.
      const langSelect = document.getElementById('langSelect');
      if (!Array.from(langSelect.options).some(o => o.value === lang)) {
        const opt = document.createElement('option');
        opt.value = lang; opt.textContent = lang;
        langSelect.appendChild(opt);
      }
      langSelect.value = lang;
      monaco.editor.setModelLanguage(beforeModel, lang);
      monaco.editor.setModelLanguage(afterModel, lang);

      if (file.view === 'html' || file.view === 'markdown') {
        // Same as the existing hash restoration, check isRichDiffView to avoid clicking twice.
        setTimeout(() => {
          if (isRichDiffView) return;
          const btn = document.getElementById(file.view === 'html' ? 'htmlViewBtn' : 'richDiffBtn');
          if (btn) btn.click();
        }, 150);
      }
      // When view is 'text', press neither button and leave Monaco's raw text display as-is.
    }

    function loadFromServer() {
      const token = new URLSearchParams(window.location.search).get('token');
      if (!token) return;

      // Relative path only. Hit /payload.json as returned by the CLI directly (no absolute URL is used).
      fetch('/payload.json?token=' + encodeURIComponent(token))
        .then((res) => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then((payload) => {
          const files = payload && payload.files;
          if (!Array.isArray(files) || files.length === 0) throw new Error('payload.files が空です');

          serverFiles = files;
          applyServerFile(files[0]);

          // Only show the toolbar's switch select when there is more than one file.
          const fileSelect = document.getElementById('fileSelect');
          if (fileSelect && files.length > 1) {
            fileSelect.innerHTML = '';
            files.forEach((f, i) => {
              const opt = document.createElement('option');
              opt.value = String(i);
              opt.textContent = f.label || ('file ' + (i + 1));
              fileSelect.appendChild(opt);
            });
            fileSelect.value = '0';
            fileSelect.style.display = '';
            fileSelect.addEventListener('change', (e) => {
              const idx = parseInt(e.target.value, 10);
              if (!serverFiles || !serverFiles[idx]) return;
              applyServerFile(serverFiles[idx]);
            });
          }
        })
        .catch((err) => {
          // Even on failure, leave the tool usable with empty state. Just notify via toast.
          console.error('Server Load Error:', err);
          showToast('⚠️ サーバからの読み込みに失敗しました');
        });
    }
  </script>
</body>
</html>
