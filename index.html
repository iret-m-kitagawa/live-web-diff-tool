  <script>
    /* =======================================================================
       Ported from rich-html-diff.html (source of truth, lines 118-418 core
       engine + 420-443 DIFF_CSS). The diff ALGORITHM itself (tokenize/diffSeq/
       unitsOf/sig/similar/textNodes/wrapRange/insertDeleted/inlineDiff/
       diffUnitPair/buildDiff/placeDeleted/orphanBin) is still ported verbatim —
       do NOT hand-edit those function bodies; re-port from the source file if
       changes are needed there. CONTROLLER (lines 445-468) is intentionally
       NOT ported — out of scope for this phase.
       DIFF_CSS はこのツール向けに以下の意図的な差異あり（他は移植元と一致）:
       1. TOKEN_RE のフラグを 'g' → 'gu'（該当箇所のコメント参照）。
       2. del[data-diff="del"] の text-decoration を line-through → none に変更
          （取り消し線を出さず、色/背景のみで削除箇所を示す）。
       3. [data-diff-block="del"] * { text-decoration:line-through; } ルールを削除。
       4. [data-diff-block="ins"/"del"] の box-shadow（変更ブロック左端の色バー）を削除。
       5. a[data-diff-nolink]{ cursor:pointer; } を追加
          （renderHtmlDiffDocument() 側でのフラグメントリンク無害化と対。href は
          外したままだが ANCHOR_SCRIPT でクリックを拾ってスクロールさせるため、
          見た目もクリック可能に戻している）。
       6. マーカー色を DIFF_CSS という固定値ではなく buildDiffCss(base) の
          関数呼び出しに変更。半透明色のままだと祖先要素の背景と合成されて
          文書ごとに実効色がばらつくため、buildHtmlDiffOutput() が
          resolveDiffBase() で求めた地の色の上に焼き込んだ不透明色を都度使う。
       ======================================================================= */
    /* =======================================================================
       Rich HTML Diff — core
       レンダリング済みの見た目を保ったまま、テキストの差分だけを ins/del で
       重ねる。外部依存なし。すべてローカル（ネットワーク送信は一切なし）。
       ======================================================================= */

    /* ---------- 1. トークナイザ（日本語は 1 文字単位） ---------- */
    const TOKEN_RE = new RegExp(
      '[\\u3040-\\u30ff\\u3400-\\u4dbf\\u4e00-\\u9fff\\uf900-\\ufaff\\uff66-\\uff9f]' + // かな/漢字/半角カナ
      '|[A-Za-z]+(?:[\'\u2019][A-Za-z]+)*' +                                            // 英単語
      '|[0-9]+(?:[.,][0-9]+)*' +                                                        // 数値
      '|\\s+' +                                                                          // 空白
      '|[^\\s]',                                                                         // その他 1 文字
      // 移植元からの唯一の意図的な差異: 'g' → 'gu'。
      // u フラグ無しだと最後の [^\s] が UTF-16 コードユニット単位で一致するため、
      // 絵文字などのサロゲートペアが 2 トークンに割れ、後段の splitText() が
      // ペアの途中を切って文字が U+FFFD に破壊される（移植元にも同じ不具合あり）。
      // u フラグを付けるとコードポイント単位になり解消する。かな/漢字/半角カナ/
      // 数値/アポストロフィを含む非アストラル文字の分割結果は完全に不変であることを確認済み。
      'gu');

    function tokenize(s){ return s.match(TOKEN_RE) || []; }

    /* ---------- 2. Myers 差分（トークン列） ---------- */
    // 返り値: [{op:-1|0|1, items:[...]}, ...]  -1=削除 0=同一 1=追加
    function diffSeq(a, b, maxD){
      maxD = maxD || 6000;
      const N = a.length, M = b.length;
      if (N === 0 && M === 0) return [];
      if (N === 0) return [{op:1, items:b.slice()}];
      if (M === 0) return [{op:-1, items:a.slice()}];

      const MAX = Math.min(N + M, maxD);
      const off = MAX + 1;
      let v = new Int32Array(2 * MAX + 3);
      const trace = [];
      let found = -1;

      outer:
      for (let d = 0; d <= MAX; d++){
        trace.push(v.slice());
        for (let k = -d; k <= d; k += 2){
          let x;
          if (k === -d || (k !== d && v[off + k - 1] < v[off + k + 1])) x = v[off + k + 1];
          else x = v[off + k - 1] + 1;
          let y = x - k;
          while (x < N && y < M && a[x] === b[y]) { x++; y++; }
          v[off + k] = x;
          if (x >= N && y >= M){ found = d; break outer; }
        }
      }
      if (found < 0) return null; // 差分が大きすぎる → 呼び出し側でフォールバック

      // バックトラック
      const rev = [];
      let x = N, y = M;
      for (let d = found; d >= 0; d--){
        const vv = trace[d];
        const k = x - y;
        let prevK;
        if (k === -d || (k !== d && vv[off + k - 1] < vv[off + k + 1])) prevK = k + 1;
        else prevK = k - 1;
        const prevX = vv[off + prevK], prevY = prevX - prevK;
        while (x > prevX && y > prevY){ rev.push([0, a[x - 1]]); x--; y--; }
        if (d > 0){
          if (x > prevX) rev.push([-1, a[x - 1]]);
          else           rev.push([1,  b[y - 1]]);
          x = prevX; y = prevY;
        }
      }
      rev.reverse();

      const out = [];
      for (const [op, item] of rev){
        if (out.length && out[out.length - 1].op === op) out[out.length - 1].items.push(item);
        else out.push({op, items:[item]});
      }
      return out;
    }

    /* ---------- 3. 構造単位の抽出 ---------- */
    // 単位 = 「インライン内容を直接持つブロック要素」。
    //
    // 移植元は tr,p,li,h1-h6,pre,blockquote,dd,dt,figcaption,caption という
    // タグのホワイトリストに一致する“葉”だけを単位にしていた。そのため
    // div / span / a / footer が直接持つテキスト（サイドバー目次のリンク、
    // ヘッダの日付、カード内の価格など）の変更が一切検出されず、さらに
    // 削除ブロックがコンテナ境界を越えて無関係なカード・callout・表の中へ
    // ばらばらに挿入される問題があった。
    //
    // ここではブロック要素を単位とし、各単位は「自分自身のインラインテキスト」
    // （入れ子のブロックはそれ自体が別単位なので除外）だけを対象にする。
    // これで単位が入れ子で重複せず、上記のテキストも拾える。
    const BLOCK_TAGS = new Set([
      'ADDRESS','ARTICLE','ASIDE','BLOCKQUOTE','BODY','CAPTION','DD','DETAILS','DIALOG',
      'DIV','DL','DT','FIELDSET','FIGCAPTION','FIGURE','FOOTER','FORM','H1','H2','H3',
      'H4','H5','H6','HEADER','HGROUP','LEGEND','LI','MAIN','NAV','OL','P','PRE',
      'SECTION','SUMMARY','TABLE','TBODY','TD','TFOOT','TH','THEAD','TR','UL'
    ]);
    // 単位の境界は本来タグではなく CSS の display で決まる。BLOCK_TAGS はあくまで
    // フォールバックで、通常は「両ドキュメントを非表示 iframe に描画して
    // getComputedStyle で解決した実際の display」で判定する（classifyBlockBoundaries）。
    //
    // タグ名だけで判定すると、例えば .toc a{display:block} のように CSS でブロック化
    // されたリンクをインライン扱いしてしまい、目次全体が 1 単位に潰れて各リンクの
    // 追加・削除が独立して表現できない。逆に display:inline な div も誤判定になる。
    // なお flex/grid の子要素は CSS 仕様で display がブロック化されるため、
    // 計算値を見るだけで「flex アイテムは独立した単位」も自動的に満たされる。
    //
    // display:none も境界として扱う。単位にはならず親に混ざる、という状態を避けたい
    // （非表示テキストが見える単位の差分に混入してしまう）ため。
    const BLOCKISH_DISPLAY = new Set([
      'block','flow-root','flex','grid','list-item','table','table-row','table-cell',
      'table-header-group','table-row-group','table-footer-group','table-caption','none'
    ]);
    let boundaryEls = null;    // Set<Element> — 境界と判定された要素
    let classifiedDocs = null; // Set<Document> — 判定済みのドキュメント

    function classifyBlockBoundaries(doc){
      const win = doc.defaultView;
      if (!win) return false;
      for (const el of doc.querySelectorAll('*')){
        let d = null;
        try { d = win.getComputedStyle(el).display; } catch (e) { d = null; }
        const isB = d ? BLOCKISH_DISPLAY.has(d) : BLOCK_TAGS.has(el.tagName);
        if (isB) boundaryEls.add(el);
      }
      if (doc.body) boundaryEls.add(doc.body);
      classifiedDocs.add(doc);
      return true;
    }

    function isBlockEl(el){
      if (!el || el.nodeType !== 1) return false;
      // 判定済みドキュメントの要素はその結果を信じる（未収録＝インライン）
      if (classifiedDocs && classifiedDocs.has(el.ownerDocument)) return boundaryEls.has(el);
      return BLOCK_TAGS.has(el.tagName);
    }

    function norm(s){ return (s || '').replace(/\s+/g, ' ').trim(); }
    // その要素が直接持つインラインテキスト（入れ子ブロックの中身は含まない）
    function ownText(el){ return textNodes(el).map(n => n.data).join(''); }

    /* ---------- 4. テキストノード操作 ---------- */
    function textNodes(root){
      const out = [];
      const walk = n => {
        for (let c = n.firstChild; c; c = c.nextSibling){
          if (c.nodeType === 3){ if (c.data.length) out.push(c); }
          else if (c.nodeType === 1){
            const t = c.tagName;
            if (t === 'SCRIPT' || t === 'STYLE') continue;
            if (c.dataset && c.dataset.diff === 'del') continue; // 自分が挿入した del は数えない
            if (isBlockEl(c)) continue; // 入れ子のブロックはそれ自体が別単位なので含めない
            walk(c);
          }
        }
      };
      walk(root);
      return out;
    }

    function wrapRange(root, start, end, cls){
      if (end <= start) return;
      const nodes = textNodes(root);
      const targets = [];
      let acc = 0;
      for (const n of nodes){
        const s = acc, e = acc + n.data.length; acc = e;
        if (e <= start || s >= end) continue;
        targets.push([n, Math.max(start, s) - s, Math.min(end, e) - s]);
      }
      for (let i = targets.length - 1; i >= 0; i--){
        const [n, from, to] = targets[i];
        let node = n;
        if (to < node.data.length) node.splitText(to);
        if (from > 0) node = node.splitText(from);
        const w = node.ownerDocument.createElement('ins');
        w.dataset.diff = cls;
        node.parentNode.insertBefore(w, node);
        w.appendChild(node);
      }
    }

    function insertDeleted(root, at, text){
      if (!text) return;
      const doc = root.ownerDocument;
      const mk = () => { const d = doc.createElement('del'); d.dataset.diff = 'del'; d.textContent = text; return d; };
      // 削除テキストは「単位そのものの流れ」に属するので、挿入位置が
      // インライン要素（<a>/<span>/<code>/<strong> 等）の境界に一致する場合は
      // その要素の“中”ではなく外側へ出す。ここを素直に n.parentNode へ入れると、
      // 例えば末尾の項目を削除したときに直前の <a> の内部に <del> が入り、
      // その <a> の見た目・レイアウト（display:block なら同じ行）を
      // 引き継いでしまう（削除された内容はその <a> の一部ではないのに）。
      const hoistAfter = (node) => {
        let x = node;
        while (x.parentNode && x.parentNode !== root && x.parentNode.lastChild === x) x = x.parentNode;
        return x;
      };
      const hoistBefore = (node) => {
        let x = node;
        while (x.parentNode && x.parentNode !== root && x.parentNode.firstChild === x) x = x.parentNode;
        return x;
      };
      const nodes = textNodes(root);
      let acc = 0;
      for (const n of nodes){
        const s = acc, e = acc + n.data.length; acc = e;
        if (at <= e){
          const local = at - s;
          if (local >= n.data.length){
            const t = hoistAfter(n);
            t.parentNode.insertBefore(mk(), t.nextSibling);
            return;
          }
          let node = n;
          if (local > 0) node = n.splitText(local);
          const t = hoistBefore(node);
          t.parentNode.insertBefore(mk(), t);
          return;
        }
      }
      root.appendChild(mk());
    }

    /* ---------- 5. 1 コンテナ内のインライン差分 ---------- */
    // 要素が自分自身で持つインラインテキストの差分。
    //
    // 全面的な書き換えの場合はインラインで混ぜない。以前は語単位の差分をそのまま
    // 差し込んでいたため、文章がまるごと差し替わったときに
    // 「開発環境 NAT Gatewayバッチ処理の構成変更Spot Instance中断検証テスト」
    // のような判読不能な交互混在になっていた。変化した割合が高いときは
    // 「旧テキストのブロック」＋「新テキストのブロック」として並べて見せる。
    const REPLACE_RATIO = 0.6;

    // 見出しは交互混在の読みにくさが本文より大きく、しかも短いので混ぜても得がない。
    // 実例: 「CP：JSM / JCPアクセスのテナント単位サービスアカウント化」を
    // 「CP：顧客ごとのサービスアカウント切り替え」に書き換えた見出しが
    // 「CP：JSM / JCPアクセス顧客ごとのテナント単位サービスアカウント化切り替え」
    // という読めない 1 行になっていた。見出しだけは早めに旧／新の並置へ切り替える。
    const HEADING_REPLACE_RATIO = 0.3;
    const CELL_REPLACE_RATIO = 0.2;
    const HEADING_TAGS = new Set(['H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'DT', 'CAPTION', 'LEGEND', 'SUMMARY']);

    // 旧要素の見た目を保った削除表示用クローンを作る。ブロックの子要素は
    // それ自体が別の対応対象なので、クローンからは落とす（二重表示を防ぐ）。
    function ownTextClone(oldEl, doc){
      const clone = doc.importNode(oldEl, true);
      const drop = [];
      for (let c = clone.firstElementChild; c; c = c.nextElementSibling){
        if (BLOCK_TAGS.has(c.tagName) || c.tagName === 'SCRIPT' || c.tagName === 'STYLE') drop.push(c);
      }
      drop.forEach(c => c.remove());
      return clone;
    }

    function diffOwnText(oldEl, newEl, tally){
      const oldText = oldEl ? ownText(oldEl) : '';
      const newText = ownText(newEl);
      if (oldText === newText) return false;
      // 空白の入り方だけが違う場合は目に見える変化がないので何も出さない。
      // 入れ子の深さが変わるとインデントだけがずれ、中身が空の ins/del が
      // ぶら下がっていた。ただし pre / code は空白そのものが意味を持つので除く。
      const ws = newEl.tagName === 'PRE' || newEl.tagName === 'CODE' || !!newEl.closest('pre');
      if (!ws && norm(oldText) === norm(newText)) return false;

      const oldToks = tokenize(oldText), newToks = tokenize(newText);
      const ops = diffSeq(oldToks, newToks);
      if (!ops){ // 大きすぎる → ブロックごと置換扱い
        markBlock(newEl, 'ins', tally, newText.length);
        return true;
      }

      // 変化が支配的なら、混ぜずに置換として見せる。
      // ただし親の内容モデル上その要素を兄弟として並べられない場合（表のセルなど）は
      // 使えない。無理に insertBefore すると行のセルが増えて表の桁が崩れる。
      // 変化の割合は空白を除いて数える。トークナイザは空白の連なりも 1 トークンに
      // するので、英文のように語間に空白が入る文章では空白がトークンの半分近くを
      // 占め、しかも必ず一致する。そのぶん変化率が薄まり、まったく無関係な 2 つの
      // 文章でも閾値を超えられずに語単位で交互混在していた。
      const meaningful = t => /\S/.test(t);
      let changedToks = 0;
      for (const op of ops) if (op.op !== 0) for (const t of op.items) if (meaningful(t)) changedToks++;
      const totalToks = oldToks.filter(meaningful).length + newToks.filter(meaningful).length;
      const parent = newEl.parentNode;
      const canSplit = parent && parent.nodeType === 1
        && canHold(parent.tagName, oldEl ? oldEl.tagName : newEl.tagName);
      // 表のセルは短い値であることが多く、文字単位で混ぜると読めなくなる。
      // 「60%以内」→「50%以内」が "6050%以内"、「$980」→「$1,180」が "$9801,180" の
      // ように、旧値と新値が地続きの 1 語に見えてしまっていた。セルの中に旧値と
      // 新値を並べて置き、色で読み分けられるようにする。兄弟セルを増やすと行の桁が
      // 崩れるので、置き換えは必ずセルの内側で完結させる。
      // 閾値を低くできるのは、セルはトークン数が少なく、少しの変更でも変化率が
      // 大きく出るため。長い文が入ったセルは従来どおり文字単位で混ぜる。
      const plainCell = (newEl.tagName === 'TD' || newEl.tagName === 'TH')
        && !newEl.firstElementChild && oldEl && !oldEl.firstElementChild;
      if (plainCell && oldToks.length && newToks.length && totalToks > 0
          && changedToks / totalToks > CELL_REPLACE_RATIO){
        const doc = newEl.ownerDocument;
        const d = doc.createElement('del'); d.dataset.diff = 'del'; d.textContent = oldText;
        const i = doc.createElement('ins'); i.dataset.diff = 'ins'; i.textContent = newText;
        newEl.textContent = '';
        newEl.appendChild(d); newEl.appendChild(i);
        tally.del += oldText.length; tally.add += newText.length; tally.blocks++;
        return true;
      }
      const ratio = HEADING_TAGS.has(newEl.tagName) ? HEADING_REPLACE_RATIO : REPLACE_RATIO;
      if (canSplit && oldToks.length && newToks.length && totalToks > 0
          && changedToks / totalToks > ratio){
        const clone = ownTextClone(oldEl, newEl.ownerDocument);
        clone.setAttribute('data-diff-block', 'del');
        tally.del += norm(oldText).length; tally.blocks++;
        parent.insertBefore(clone, newEl);
        markBlock(newEl, 'ins', tally, newText.length);
        return true;
      }

      const edits = [];
      let pos = 0;
      for (const op of ops){
        const text = op.items.join('');
        if (op.op === 0) pos += text.length;
        else if (op.op === 1){ edits.push({k:'ins', s:pos, e:pos + text.length}); pos += text.length; tally.add += text.length; }
        else { edits.push({k:'del', at:pos, text}); tally.del += text.length; }
      }
      edits.sort((x, y) => (y.k === 'ins' ? y.s : y.at) - (x.k === 'ins' ? x.s : x.at));
      for (const ed of edits){
        if (ed.k === 'ins') wrapRange(newEl, ed.s, ed.e, 'ins');
        else insertDeleted(newEl, ed.at, ed.text);
      }
      if (edits.length){ newEl.setAttribute('data-diff-row', 'changed'); tally.blocks++; }
      return edits.length > 0;
    }

    function markBlock(el, kind, tally, chars){
      el.setAttribute('data-diff-block', kind);
      if (kind === 'ins') tally.add += chars; else tally.del += chars;
    }

    // 属性だけが変わった要素を表現する。テキストが同じだと従来は完全一致扱いで
    // 何も表示されず、class="card" -> class="card recommended" のような
    // 「見た目や意味は変わったがテキストは同じ」変更が丸ごと消えていた。
    // 自分たちが付けた診断用属性は比較対象から除く。
    const DIFF_OWN_ATTRS = new Set([
      'data-diff', 'data-diff-block', 'data-diff-row', 'data-diff-attr', 'data-diff-nolink', 'data-diff-pad',
      'data-diff-old-id'
    ]);

    function attrMap(el){
      const m = new Map();
      const list = el.attributes;
      for (let i = 0; i < list.length; i++){
        const a = list[i];
        if (DIFF_OWN_ATTRS.has(a.name)) continue;
        m.set(a.name, a.value);
      }
      return m;
    }

    function diffAttributes(oldEl, newEl, tally){
      if (!oldEl || !newEl || newEl.nodeType !== 1 || oldEl.nodeType !== 1) return;
      // body 全体に枠を出すと画面全部が囲まれるので対象外
      if (newEl.tagName === 'BODY' || newEl.tagName === 'HTML') return;
      // 要素まるごと追加/削除なら、それだけで伝わるので重ねない
      if (newEl.hasAttribute('data-diff-block')) return;

      const om = attrMap(oldEl), nm = attrMap(newEl);
      const names = new Set();
      // タグ自体が変わった場合（h3 -> h2、ul -> ol）も「この要素が変わった」印を出す。
      // テキストが同じだと他に手掛かりがなく、見出しレベルの昇格が無表示になる。
      if (oldEl.tagName !== newEl.tagName) names.add('tagName');
      om.forEach((v, k) => { if (nm.get(k) !== v) names.add(k); });
      nm.forEach((v, k) => { if (om.get(k) !== v) names.add(k); });
      if (!names.size) return;

      // 値は入れない（style や長い URL で表示が崩れるため）。変わった属性名だけ残す。
      newEl.setAttribute('data-diff-attr', Array.from(names).sort().join(','));
      tally.attrs = (tally.attrs || 0) + 1;
    }

    /* ---------- 6. 階層ごとの再帰差分 ---------- */
    // 以前は DOM を「単位（インラインテキストを持つブロック要素）」の平坦な配列に
    // 潰して Myers 差分をかけ、その後ヒューリスティックで構造を復元していた。
    // これが深刻な破損の原因だった。似たコンテナが並ぶ中で 1 つ挿入/削除されると
    // 平坦な列が 1 つズレ、以降がすべて誤ペアになる（古典的なアラインメント崩壊）。
    // 実例: before=[card1, cardNAT, cardS3] / after=[card1, cardS3', cardSpot] で
    // 「2. NAT Gatewayの集約」と「2. S3 ライフサイクルルールの適用」が
    // 先頭の "2. " や助詞などの共通トークンでペア判定され、1 つのカード枠の中に
    // 新旧のカード名・本文・旧ヘッダが全部詰め込まれた。表でも削除行のセルが
    // 新しい行に流れ込み、2,800 と 8,000 が 1 セルに融合した。
    //
    // そこで階層ごとに子要素を突き合わせ、一致したペアだけ再帰する方式にする。
    // 挿入位置は「同じ親の子リスト内」で自明に決まるので、配置ヒューリスティック
    // （contextKey / levelsToSiblingOf / liftLevels / canContain /
    //  maximalDeletedContainer / placeDeletedBlock）は不要になり全廃した。
    // 再帰の暴走に対する安全網。実際の入れ子の深さに対する制限のつもりではない。
    // 60 にしていたときは、ラッパ div が 150 段重なった文書（生成された HTML では
    // 珍しくない）で最深部の変更が 1 つも表示されなかった。同じペアを二度たどらない
    // ことは visitedPairs が保証しているので、ここは十分に深くしておく。
    const MAX_DIFF_DEPTH = 500;

    // 部分木の同一性キー。全文テキストを使うので「カードはカードと」対応が付く。
    function childKey(el){ return el.tagName + '␀' + norm(el.textContent); }

    function diffableChildren(el, blockOnly){
      const out = [];
      for (let c = el.firstElementChild; c; c = c.nextElementSibling){
        if (c.tagName === 'SCRIPT' || c.tagName === 'STYLE') continue;
        // 自分が差分表示のために挿入した要素は対象外
        if (c.hasAttribute('data-diff') || c.hasAttribute('data-diff-block')) continue;
        // 親のテキスト差分で既に扱ったインライン要素は対象外（下の説明を参照）
        if (blockOnly && !isBlockEl(c)) continue;
        out.push(c);
      }
      return out;
    }

    // 要素の「識別テキスト」。同じレコードが編集されたのか、別のレコードなのかは
    // 全文の重なりではなく見出しやキー列が一致しているかで決まる。
    // 表の行なら先頭セル、カードやセクションなら見出しがそれに当たる。
    function identityText(el){
      const h = el.querySelector('h1,h2,h3,h4,h5,h6,caption,legend,summary,dt,th');
      if (h) return norm(h.textContent);
      // 自分自身が持つテキストを、子要素より優先する。子から先に見ていたため
      // <li>データベース設計<ul>外部インターフェース設計</ul></li> の識別子が
      // 入れ子側の「外部インターフェース設計」になり、旧文書の別項目と一致して
      // しまって「データベース設計外部インデータベーフェース設計」という
      // 判読不能な混在になっていた。
      const own = norm(ownText(el));
      if (own) return own;
      const first = el.firstElementChild;
      if (first) return norm(first.textContent);
      return norm(el.textContent);
    }

    // トークン袋の重なり率
    function tokenOverlap(sa, sb){
      const ta = tokenize(sa), tb = tokenize(sb);
      if (!ta.length && !tb.length) return 1;
      if (!ta.length || !tb.length) return 0;
      const setA = new Set(ta);
      let hit = 0;
      for (const t of tb) if (setA.has(t)) hit++;
      return hit / Math.max(ta.length, tb.length);
    }

    // 識別テキスト専用の重なり率。ハイフンなどの区切り記号だけのトークンは
    // 識別情報を持たないため比較から除く。記号を残したまま比較すると、
    // 表の "mail-01" 行と "app-02" 行のように先頭セルが別レコードを指して
    // いても記号 "-" を共有するだけで重なりが生じてしまう（実測 1/3 ≈ .33）。
    // 行テンプレートの共通語（サーバー/vCPU/GB 等）で全文側の重なりも高いと、
    // 合算が閾値 0.4 をわずかに超えて「変更」に潰れてしまっていた。
    function identityOverlap(sa, sb){
      const isMeaningful = t => /[\p{L}\p{N}]/u.test(t);
      const ta = tokenize(sa).filter(isMeaningful), tb = tokenize(sb).filter(isMeaningful);
      if (!ta.length && !tb.length) return 1;
      if (!ta.length || !tb.length) return 0;
      const setA = new Set(ta);
      let hit = 0;
      for (const t of tb) if (setA.has(t)) hit++;
      return hit / Math.max(ta.length, tb.length);
    }

    // 置換ペアの候補スコア。全文だけで見ると、日本語は文字単位でトークン化される
    // ため「別のレコード」同士でも共通文字が大量に出て閾値を超えてしまう。
    // 実例: 表の Classic 行と Pro Plus 行が $ , 0 ユ ー ザ サ ポ ト を共有するだけで
    // 1 組のペアと判定され、行の削除・追加が「変更」に潰れていた。
    // そこで識別テキスト（見出し／キー列）の一致を同じ重みで見る。
    // 見出しレベルの上げ下げ（h3 -> h2）や箇条書きの種類変更（ul -> ol）は、
    // 「同じ要素の書式が変わった」だけで別物ではない。タグ名の完全一致を求めると
    // 必ず非ペアになり、中身が同一のリストが丸ごと削除＋追加として二重に出ていた。
    // 太字・斜体は要素としては別物だが、文書の差分としては「同じ語句の書式が
    // 変わった」でしかない。別扱いのままだと、見える文字がまったく同じなのに
    // 同じ語句が赤と緑で 2 回出ていた（<i> -> <em>、<b> -> <strong> など）。
    // <ins> / <del> は自分たちが印付けに使う要素なので、族には加えない。
    const TAG_FAMILY = {
      H1: 'heading', H2: 'heading', H3: 'heading', H4: 'heading', H5: 'heading', H6: 'heading',
      UL: 'list', OL: 'list',
      B: 'bold', STRONG: 'bold',
      I: 'italic', EM: 'italic'
    };
    function sameTagFamily(a, b){
      if (a.tagName === b.tagName) return true;
      const fa = TAG_FAMILY[a.tagName];
      return !!fa && fa === TAG_FAMILY[b.tagName];
    }

    // 表の行は、列が増減していると「消えた列の値」と「増えた列の値」が全文比較に
    // 混ざり、識別テキスト（最初のセル）も先頭に列が入るだけでずれるため、
    // 中身の変わっていない行まで別物に見えてしまう。実測では、先頭に列を 1 本
    // 足すだけで行が丸ごと削除＋追加に割れていた。
    // 両方の表に残っている列だけを突き合わせて判断する。
    function rowPairTexts(oldTr, newTr){
      if (hasSpans(oldTr) || hasSpans(newTr)) return null;
      const oldTable = oldTr.closest('table'), newTable = newTr.closest('table');
      if (!oldTable || !newTable) return null;
      const cm = columnMap(oldTable, newTable);
      if (!cm) return null;
      // 印を付ける前の生のセル列。cellsOf は印付きセルを除くので使わない。
      const raw = tr => {
        const out = [];
        for (let c = tr.firstElementChild; c; c = c.nextElementSibling)
          if (c.tagName === 'TD' || c.tagName === 'TH') out.push(c);
        return out;
      };
      const ca = raw(oldTr), cb = raw(newTr);
      const ta = [], tb = [];
      for (const col of cm.cols){
        if (col.o < 0 || col.n < 0) continue;
        if (!ca[col.o] || !cb[col.n]) continue;
        ta.push(norm(ca[col.o].textContent));
        tb.push(norm(cb[col.n].textContent));
      }
      if (!ta.length) return null;
      return { ia: ta[0], ib: tb[0], fa: ta.join(' '), fb: tb.join(' ') };
    }

    function nodeSimilarity(a, b){
      if (!sameTagFamily(a, b)) return 0;
      // 表の行どうしは、両方の表に残っている列だけで識別テキストと全文重なりを
      // 数える。列が増減していない表では残る列＝全列になるので、下の一般ロジック
      // とほぼ同じ計算になり、既存の挙動（似た行の中から正しい 1 行を選ぶ、値が
      // 総取り換えされた行は対にしない等）はそのまま保たれる。
      if (a.tagName === 'TR' && b.tagName === 'TR'){
        const r = rowPairTexts(a, b);
        if (r) return 0.5 * identityOverlap(r.ia, r.ib) + 0.5 * tokenOverlap(r.fa, r.fb);
      }
      const full = tokenOverlap(norm(a.textContent), norm(b.textContent));
      const ia = identityText(a), ib = identityText(b);
      // 識別テキストが取れない（全文と同じ）要素は従来どおり全文だけで判定する
      if (!ia && !ib) return full;
      if (ia === norm(a.textContent) && ib === norm(b.textContent)) return full;
      return 0.5 * identityOverlap(ia, ib) + 0.5 * full;
    }
    const PAIR_THRESHOLD = 0.4;

    function markInserted(el, tally){
      el.setAttribute('data-diff-block', 'ins');
      tally.add += norm(el.textContent).length; tally.blocks++;
    }
    function markDeleted(el, tally){
      el.setAttribute('data-diff-block', 'del');
      tally.del += norm(el.textContent).length; tally.blocks++;
    }

    // 親が構造上その子を持てるか（持てない場合だけ orphanBin へ退避する）
    const CHILD_RULES = {
      UL: /^LI$/, OL: /^LI$/, DL: /^(DT|DD)$/,
      TABLE: /^(THEAD|TBODY|TFOOT|CAPTION|COLGROUP|TR)$/,
      THEAD: /^TR$/, TBODY: /^TR$/, TFOOT: /^TR$/, TR: /^(TD|TH)$/
    };
    function canHold(parentTag, childTag){
      // 行にセルを足すのは HTML としては妥当でも表の桁が崩れるので禁止する。
      // 実際にこれで削除セルが新しい行へ流れ込み、ヘッダ 6 列の表に 8 セルの行が
      // できていた（$2,800 と $8,000 が 1 セルに融合した件と同じ壊れ方）。
      if (parentTag === 'TR') return false;
      const r = CHILD_RULES[parentTag];
      return r ? r.test(childTag) : true;
    }

    // newParent の子孫から、その文字列をまるごと含むテキストノードを探す。
    // 「囲んでいた要素が外れただけ」の判定に使うので、既に印の付いた要素
    // （削除済みの複製など）の中は対象外にする。1 つに絞れないときは
    // 位置を特定できないとみなし、呼び出し側で複製の抑止だけ行う。
    function findUnwrapTarget(newParent, needle){
      const hits = [];
      const walk = node => {
        for (let c = node.firstChild; c; c = c.nextSibling){
          if (c.nodeType === 3){ if (c.data.indexOf(needle) >= 0) hits.push(c); }
          else if (c.nodeType === 1){
            if (c.hasAttribute('data-diff') || c.hasAttribute('data-diff-block')) continue;
            walk(c);
          }
        }
      };
      walk(newParent);
      return hits.length === 1 ? hits[0] : null;
    }

    // 見つけたテキストノードから語句だけを splitText で切り出し、書式が変わった
    // 印を付ける。手順は wrapRange と同じで、後ろを先に切ってから前を切ることで
    // 途中の splitText によるオフセットのずれを避けている。
    function markUnwrapped(hitText, needle){
      const idx = hitText.data.indexOf(needle);
      let node = hitText;
      if (idx + needle.length < node.data.length) node.splitText(idx + needle.length);
      if (idx > 0) node = node.splitText(idx);
      const span = node.ownerDocument.createElement('span');
      span.setAttribute('data-diff-attr', 'tagName');
      node.parentNode.insertBefore(span, node);
      span.appendChild(node);
    }

    // 削除された子要素を、新DOMの同じ親の中の相当位置へ戻す。
    // resolveGroups の 3) と、diffNode で子要素の対応相手が新側に 1 つも無い
    // ケースの両方がここを通る一本道になっている。
    function insertDeletedChild(newParent, oldKid, beforeNode, tally){
      // 中身が消えたのではなく、囲んでいた要素だけが外れて地の文に戻っただけの
      // 可能性を見る。<strong>重要な指摘の一文</strong> の <strong> が外れて
      // 地の文になっただけなのに、この語句は子要素どうしの対応づけでは相手が
      // 見つからず削除扱いになり、しかも置き場所も無いので段落の末尾に赤で
      // 複製されていた。文言はちゃんと残っているのに「削除された」と見えるのは
      // 紛らわしいだけでなく事実と食い違うため、判定は保守的に次の条件だけで行う:
      // インライン要素で、子要素を持たず（純粋にテキストを包むだけ）、
      // その文字列をまるごと含むテキストノードが新側に一意に見つかること。
      if (!isBlockEl(oldKid) && !oldKid.firstElementChild){
        const needle = norm(oldKid.textContent);
        if (needle){
          const hit = findUnwrapTarget(newParent, needle);
          if (hit) markUnwrapped(hit, needle);
          // 一意に特定できないときも、消えていない語句を削除の複製として見せる
          // ことだけは避ける。何も表示されないより、誤って「削除された」と
          // 見せないことを優先し、変わったことだけを親に残す。
          else newParent.setAttribute('data-diff-row', 'changed');
          return null; // 消えていないため tally.del は加算しない
        }
      }
      const clone = newParent.ownerDocument.importNode(oldKid, true);
      markDeleted(clone, tally);
      // oldKid は旧文書側の要素なので closest('table') は旧表を返す
      padDeletedRow(clone, oldKid.closest('table'), newParent.closest('table'));
      if (!canHold(newParent.tagName, clone.tagName)){
        orphanBin(newParent.ownerDocument).appendChild(clone);
        return null;
      }
      if (beforeNode && beforeNode.parentNode === newParent) newParent.insertBefore(clone, beforeNode);
      else newParent.appendChild(clone);
      return clone;
    }

    // 削除ラン + 追加ラン を「最良一致」で突き合わせる。順送りに比べる方式だと
    // 1 つズレたときに全部が誤ペアになるため、スコア最大の組から確定していく。
    // ペア成立に必要なスコアは「取り違えの起きやすさ」で決める。
    // 同じタグの兄弟が複数並ぶ場所（表の行、カード、リスト項目）は取り違えると
    // 別レコード同士が 1 つに潰れるので厳しく見る。一方、兄弟の中でそのタグが
    // 唯一の要素（ヘッダ、フッタ、単独のセクションなど）は取り違えようがないので
    // 緩める。これを一律 PAIR_THRESHOLD にしていたため、見出しを書き換えただけの
    // <header> が丸ごと削除＋追加として二重表示されていた。
    const LONE_PAIR_THRESHOLD = 0.1;
    function pairThresholdFor(newParent, tag){
      let n = 0;
      for (let c = newParent.firstElementChild; c; c = c.nextElementSibling){
        if (c.tagName === tag && ++n > 1) return PAIR_THRESHOLD;
      }
      return LONE_PAIR_THRESHOLD;
    }

    // 1 つの親の下にある「削除ラン + 追加ラン」の組をまとめて解決する。
    // ラン単位で閉じて処理していたときは、位置が離れた移動を Myers が別々のランへ
    // 振り分けるせいで、移動しつつ中身も変わった要素が絶対に出会えなかった。
    // 実例: カードが 2 番目から 3 番目へ動き、同時に本文とバッジも変わったとき、
    // 削除カードと追加カードが別のランに入り、編集内容が一切見えなくなっていた。
    function resolveGroups(newParent, groups, tally, depth){
      const pairedDel = new Map(), usedIns = new Set();
      const key = (g, k) => g + ':' + k;
      const settle = (list) => {
        list.sort((x, y) => y.sc - x.sc);
        for (const c of list){
          if (pairedDel.has(key(c.gi, c.a)) || usedIns.has(key(c.gj, c.b))) continue;
          const oldEl = groups[c.gi].del[c.a], newEl2 = groups[c.gj].ins[c.b];
          pairedDel.set(key(c.gi, c.a), newEl2); usedIns.add(key(c.gj, c.b));
          diffNode(oldEl, newEl2, tally, depth + 1);
        }
      };

      // 1) まず同じラン内での最良一致。取り違えの起きやすさで閾値を変える。
      const near = [];
      groups.forEach((g, gi) => {
        for (let a = 0; a < g.del.length; a++)
          for (let b = 0; b < g.ins.length; b++){
            const sc = nodeSimilarity(g.del[a], g.ins[b]);
            if (sc >= pairThresholdFor(newParent, g.ins[b].tagName)) near.push({ gi: gi, a: a, gj: gi, b: b, sc: sc });
          }
      });
      settle(near);

      // 2) 次にランをまたいだ「移動して中身も変わった」要素。誤って結び付けると
      //    別物同士が 1 つに潰れるので、見出しなどの識別テキストが完全に一致する
      //    ものだけに限る。中身まで同じ場合は対にしない（純粋な移動は削除＋追加の
      //    ままにしておかないと、動いたこと自体が見えなくなる）。
      const far = [];
      groups.forEach((g, gi) => {
        for (let a = 0; a < g.del.length; a++){
          if (pairedDel.has(key(gi, a))) continue;
          const oldEl = g.del[a], idA = identityText(oldEl);
          if (!idA) continue;
          groups.forEach((h, gj) => {
            if (gj === gi) return;
            for (let b = 0; b < h.ins.length; b++){
              const el = h.ins[b];
              if (usedIns.has(key(gj, b))) continue;
              if (!sameTagFamily(oldEl, el)) continue;
              if (identityText(el) !== idA) continue;
              if (childKey(el) === childKey(oldEl)) continue;
              far.push({ gi: gi, a: a, gj: gj, b: b, sc: nodeSimilarity(oldEl, el) });
            }
          });
        }
      });
      settle(far);

      // 3) 残った追加要素を確定し、削除要素を旧文書での隣り合わせを頼りに戻す。
      //    直前に対応が付いた要素の「新しい相手」の後ろへ置けば元の並び順が保たれる。
      //    手掛かりがない場合だけ、ラン直後の要素の前に置く。これがないと、
      //    全行が少しずつ変わった表で削除行だけが末尾へ流れていた。
      groups.forEach((g, gi) => {
        for (let b = 0; b < g.ins.length; b++) if (!usedIns.has(key(gi, b))) markInserted(g.ins[b], tally);
      });
      groups.forEach((g, gi) => {
        let cursor = null;
        for (let a = 0; a < g.del.length; a++){
          const mate = pairedDel.get(key(gi, a));
          if (mate){ cursor = mate; continue; }
          let at = null;
          if (cursor && cursor.parentNode === newParent) at = cursor.nextSibling;
          else {
            for (let k = a + 1; k < g.del.length; k++){
              const nxt = pairedDel.get(key(gi, k));
              if (nxt && nxt.parentNode === newParent){ at = nxt; break; }
            }
            // 対応が付いた要素が 1 つも無い場合は、同じ位置に入った追加要素の直前へ置く。
            // 削除ランと追加ランは同じ並び位置を指しているので、これで前後関係が保たれる。
            // これが無いと親の末尾へ追記され、<p> の中で <em> だけが文末に飛んでいた。
            if (!at){
              for (let k = 0; k < g.ins.length; k++){
                if (g.ins[k] && g.ins[k].parentNode === newParent){ at = g.ins[k]; break; }
              }
            }
            if (!at && g.before && g.before.parentNode === newParent) at = g.before;
          }
          cursor = insertDeletedChild(newParent, g.del[a], at, tally) || cursor;
        }
      });
    }

    // 表の列対応。列が途中に挿入・削除されると index 位置での突き合わせは全部ずれ、
    // 無関係な列同士が比較されてしまう（例: 旧「ステータス」列が新「担当者」列に
    // 対応してしまい「山田稼働中」のような値の融合が起きる）。そこで先頭行（ヘッダ）
    // のセル内容で列を対応付け、その対応を全ての行に使い回す。
    const tableColMaps = new WeakMap();

    // colspan / rowspan がある表は index と列が 1:1 対応しないため対応付けを諦める
    function hasSpans(tr){
      for (let c = tr.firstElementChild; c; c = c.nextElementSibling){
        if (c.tagName !== 'TD' && c.tagName !== 'TH') continue;
        const cs = parseInt(c.getAttribute('colspan') || '1', 10);
        const rs = parseInt(c.getAttribute('rowspan') || '1', 10);
        if (cs > 1 || rs > 1) return true;
      }
      return false;
    }

    // ヘッダ行の内容から「統合後の列並び」を作る。要素は { o, n } で、o は旧表の
    // 列 index、n は新表の列 index（対応しない側は -1）。新表ごとに1回だけ計算して
    // キャッシュする。cellsOf の「印付きセル除外」と噛み合わなくなるのを避けるため、
    // ここでは印を付ける前提の生のセル列を firstElementChild で直接数える。
    //
    // 新→旧の写像だけを持っていたときは、なくなった列を表現する手段がなく、
    // 削除された列が何の印もなく消えていた（行の削除は所定位置に復元されるのに
    // 列の削除だけ情報が落ちる非対称な状態だった）。統合後の並びを持つことで、
    // 削除された列も所定の位置に戻せる。
    function columnMap(oldTable, newTable){
      let m = tableColMaps.get(newTable);
      if (m !== undefined) return m;
      m = null;
      const oldHead = oldTable.querySelector('tr'), newHead = newTable.querySelector('tr');
      if (oldHead && newHead && !hasSpans(oldHead) && !hasSpans(newHead)){
        const ok = [], nk = [];
        for (let c = oldHead.firstElementChild; c; c = c.nextElementSibling)
          if (c.tagName === 'TD' || c.tagName === 'TH') ok.push(norm(c.textContent));
        for (let c = newHead.firstElementChild; c; c = c.nextElementSibling)
          if (c.tagName === 'TD' || c.tagName === 'TH') nk.push(norm(c.textContent));
        const ops = ok.length && nk.length ? diffSeq(ok, nk, 20000) : null;
        if (ops){
          const cols = [];
          let oi = 0, ni = 0;
          for (const op of ops){
            for (let k = 0; k < op.items.length; k++){
              if (op.op === 0) cols.push({ o: oi++, n: ni++ });
              else if (op.op === 1) cols.push({ o: -1, n: ni++ });   // 追加された列
              else cols.push({ o: oi++, n: -1 });                    // なくなった列
            }
          }
          // なくなった列の並びと、その直後に増えた列の並びが同じ長さなら、
          // 「その位置の列が差し替わった（列名の変更）」とみなして対にする。
          // そうしないと、見出しを 1 つ書き換えただけで列が削除＋追加に分かれ、
          // 中身が同一のデータセルまで 1 行ぶん丸ごと二重に描かれていた。
          const merged = [];
          for (let k = 0; k < cols.length; k++){
            let dEnd = k;
            while (dEnd < cols.length && cols[dEnd].o >= 0 && cols[dEnd].n < 0) dEnd++;
            const dLen = dEnd - k;
            if (dLen > 0){
              let iEnd = dEnd;
              while (iEnd < cols.length && cols[iEnd].o < 0 && cols[iEnd].n >= 0) iEnd++;
              if (iEnd - dEnd === dLen){
                for (let x = 0; x < dLen; x++) merged.push({ o: cols[k + x].o, n: cols[dEnd + x].n });
                k = iEnd - 1;
                continue;
              }
            }
            merged.push(cols[k]);
          }
          if (oi === ok.length && ni === nk.length) m = { cols: merged, oldCols: ok.length, newCols: nk.length };
        }
      }
      tableColMaps.set(newTable, m);
      return m;
    }

    // 旧文書と新文書で列数が違う場合、削除行をそのまま戻すと桁が崩れる。
    // 実例: 旧 5 列・新 6 列（「担当者」列が追加）で mail-01 行を戻すと、
    // 行末のステータスセルが新しい「担当者」列の位置にずれ込み、表全体の桁が
    // 1 列分ずれて見える。新しく増えた列の位置に空セルを補って揃える。
    function padDeletedRow(clone, oldTable, newTable){
      if (clone.tagName !== 'TR' || !oldTable || !newTable) return;
      const info = columnMap(oldTable, newTable);
      if (!info) return;
      const cells = [];
      for (let c = clone.firstElementChild; c; c = c.nextElementSibling){
        if (c.tagName === 'TD' || c.tagName === 'TH') cells.push(c);
      }
      if (cells.length !== info.oldCols) return; // 想定外の桁数なら触らない
      const doc = clone.ownerDocument;
      const tag = cells[0] && cells[0].tagName === 'TH' ? 'th' : 'td';
      // 統合後の列順に並べ直す。旧行が既に持っている列はそのまま、
      // 追加された列の位置にだけ空セルを補う。
      for (let k = 0; k < info.cols.length; k++){
        if (info.cols[k].o >= 0) continue;
        const pad = doc.createElement(tag);
        pad.setAttribute('data-diff-pad', '');
        const at = clone.children[k] || null;
        if (at) clone.insertBefore(pad, at); else clone.appendChild(pad);
      }
    }

    // 表の行はできる限りヘッダ由来の列対応で突き合わせる。セルを増減させると桁が
    // ずれて表が壊れるため、行のセル数は一切変更しない。列対応が使えない場合
    // （colspan がある、行の桁数がヘッダと食い違う等）は、従来どおり位置で
    // 突き合わせる。列が増えた分は新しいセルを追加としてマークし、減った分は
    // 行に印を付けるだけ。
    function cellsOf(tr){
      const out = [];
      for (let c = tr.firstElementChild; c; c = c.nextElementSibling){
        if (c.tagName !== 'TD' && c.tagName !== 'TH') continue;
        if (c.hasAttribute('data-diff') || c.hasAttribute('data-diff-block')) continue;
        out.push(c);
      }
      return out;
    }
    function diffTableRow(oldTr, newTr, tally, depth){
      const oc = cellsOf(oldTr), nc = cellsOf(newTr);
      let changed = false;

      // ヘッダから得た列対応が使えて、両行の桁数がヘッダと一致していれば列で対応付ける
      const oldTable = oldTr.closest('table'), newTable = newTr.closest('table');
      let cm = null;
      if (oldTable && newTable && !hasSpans(oldTr) && !hasSpans(newTr)){
        const info = columnMap(oldTable, newTable);
        if (info && oc.length === info.oldCols && nc.length === info.newCols) cm = info;
      }

      if (cm){
        // なくなった列のセルを戻す位置は「次に残っている新しい列」の直前。
        // 後ろから走査してその要素を控えておく。
        const anchors = new Array(cm.cols.length);
        let nextEl = null;
        for (let k = cm.cols.length - 1; k >= 0; k--){
          anchors[k] = nextEl;
          if (cm.cols[k].n >= 0) nextEl = nc[cm.cols[k].n];
        }
        for (let k = 0; k < cm.cols.length; k++){
          const col = cm.cols[k];
          if (col.o >= 0 && col.n >= 0){
            const before = nc[col.n].outerHTML;
            diffNode(oc[col.o], nc[col.n], tally, depth + 1);
            if (nc[col.n].outerHTML !== before) changed = true;
          } else if (col.n >= 0){
            markInserted(nc[col.n], tally); changed = true;   // 新しく増えた列
          } else {
            // なくなった列。行の削除と同じく、消えたことが分かるように所定位置へ戻す。
            // 全ての行（ヘッダ含む）に同じ 1 列が増えるので表は長方形のまま保たれる。
            // insertDeletedChild は行にセルを足すのを禁じているため直接挿入する。
            const clone = newTr.ownerDocument.importNode(oc[col.o], true);
            markDeleted(clone, tally);
            const at = anchors[k];
            if (at && at.parentNode === newTr) newTr.insertBefore(clone, at);
            else newTr.appendChild(clone);
            changed = true;
          }
        }
      } else {
        // 対応が取れない表（colspan あり、桁数不一致等）は従来どおり位置で突き合わせる
        const n = Math.min(oc.length, nc.length);
        for (let i = 0; i < n; i++){
          const before = nc[i].outerHTML;
          diffNode(oc[i], nc[i], tally, depth + 1);
          if (nc[i].outerHTML !== before) changed = true;
        }
        for (let i = n; i < nc.length; i++){ markInserted(nc[i], tally); changed = true; }
        if (oc.length > nc.length) changed = true; // 減った列は印のみ（セルは消さない）
      }

      if (changed) newTr.setAttribute('data-diff-row', 'changed');
    }

    const visitedPairs = new WeakMap();

    function diffNode(oldEl, newEl, tally, depth){
      depth = depth || 0;
      if (depth > MAX_DIFF_DEPTH) return;
      let seen = visitedPairs.get(oldEl);
      if (!seen){ seen = new WeakSet(); visitedPairs.set(oldEl, seen); }
      if (seen.has(newEl)) return;
      seen.add(newEl);

      // 0. 属性の変化（テキストが同じでも意味や見た目が変わるため先に見る）
      diffAttributes(oldEl, newEl, tally);

      // 1. この要素自身が直接持つインラインテキスト
      // ownText は入れ子のブロックで止まるだけで、インラインの子孫（span など）の
      // テキストは含む。そのためここで差分を付けたあとに同じ子要素をもう一度
      // 要素として突き合わせると、1 つの変更が二重に描かれる。実際に
      // <td><span class="badge">故障中</span></td> が
      // <del>故障中</del> ＋ ins のバッジ ＋ del のバッジ の 3 つになっていた。
      // テキスト差分を付けた場合は、インラインの子は下の突き合わせから外す。
      let ownTextEdited = false;
      if (ownText(oldEl).trim() || ownText(newEl).trim()) ownTextEdited = diffOwnText(oldEl, newEl, tally);

      // 1b. インラインの子は下の突き合わせから外すが、属性の変化だけは拾っておく。
      // 外したままだと、テキストも一緒に変わったリンクや <time> で href や datetime の
      // 変更が落ちる。並びと種類が一致するときだけ、同じ位置どうしを見る。
      if (ownTextEdited){
        const oldInline = [], newInline = [];
        for (let c = oldEl.firstElementChild; c; c = c.nextElementSibling)
          if (!isBlockEl(c) && c.tagName !== 'SCRIPT' && c.tagName !== 'STYLE') oldInline.push(c);
        for (let c = newEl.firstElementChild; c; c = c.nextElementSibling)
          if (!isBlockEl(c) && c.tagName !== 'SCRIPT' && c.tagName !== 'STYLE'
              && !c.hasAttribute('data-diff') && !c.hasAttribute('data-diff-block')) newInline.push(c);
        if (oldInline.length === newInline.length)
          for (let i = 0; i < oldInline.length; i++)
            if (oldInline[i].tagName === newInline[i].tagName) diffAttributes(oldInline[i], newInline[i], tally);
      }

      // 2. 表の行はセル単位で位置合わせする（セル数は絶対に変えない）
      if (oldEl.tagName === 'TR' && newEl.tagName === 'TR'){
        diffTableRow(oldEl, newEl, tally, depth);
        return;
      }

      // 3. それ以外は子要素列を突き合わせる
      const oldKids = diffableChildren(oldEl, ownTextEdited);
      const newKids = diffableChildren(newEl, ownTextEdited);
      if (!oldKids.length && !newKids.length) return;
      if (!oldKids.length){ for (const k of newKids) markInserted(k, tally); return; }
      if (!newKids.length){ for (const k of oldKids) insertDeletedChild(newEl, k, null, tally); return; }

      const ops = diffSeq(oldKids.map(childKey), newKids.map(childKey), 20000);
      if (!ops){ // 大きすぎる場合は位置合わせで妥協
        const m = Math.min(oldKids.length, newKids.length);
        for (let i = 0; i < m; i++) diffNode(oldKids[i], newKids[i], tally, depth + 1);
        for (let i = m; i < newKids.length; i++) markInserted(newKids[i], tally);
        for (let i = m; i < oldKids.length; i++) insertDeletedChild(newEl, oldKids[i], null, tally);
        return;
      }

      // ラン単位で即決せず、この親の下の全ランを集めてからまとめて解決する
      const groups = [];
      let oi = 0, ni = 0, i = 0;
      while (i < ops.length){
        const op = ops[i];
        if (op.op === 0){
          for (let k = 0; k < op.items.length; k++, oi++, ni++) diffNode(oldKids[oi], newKids[ni], tally, depth + 1);
          i++; continue;
        }
        let delRun = [], insRun = [];
        if (op.op === -1){
          delRun = oldKids.slice(oi, oi + op.items.length); oi += op.items.length; i++;
          if (i < ops.length && ops[i].op === 1){ insRun = newKids.slice(ni, ni + ops[i].items.length); ni += ops[i].items.length; i++; }
        } else {
          insRun = newKids.slice(ni, ni + op.items.length); ni += op.items.length; i++;
          if (i < ops.length && ops[i].op === -1){ delRun = oldKids.slice(oi, oi + ops[i].items.length); oi += ops[i].items.length; i++; }
        }
        // 削除分を戻す位置の手掛かり = 次に残っている新DOM側の子
        groups.push({ del: delRun, ins: insRun, before: newKids[ni] || null });
      }
      if (groups.length) resolveGroups(newEl, groups, tally, depth);
    }

    /* ---------- 7. ドキュメント全体 ---------- */

    // 最後の掃除。列対応を通らない経路（丸ごと追加された行など）でも表が長方形で
    // あることを保証する。桁が揃っていないと、どこが変わったか以前に表が読めなく
    // なるため、原因側の修正とは別に構造として担保しておく。
    // colspan / rowspan のある表は列と index が 1:1 でないので触らない。
    function normalizeTables(doc){
      const tables = doc.querySelectorAll('table');
      for (const t of tables){
        // querySelectorAll('tr') は入れ子の表の行まで拾う。それを自分の行だと思って
        // 桁を揃えると、セルの中に置いた表が外側の桁まで水増しされて壊れる。
        const rows = Array.from(t.querySelectorAll('tr')).filter(r => r.closest('table') === t);
        if (!rows.length) continue;
        if (rows.some(hasSpans)) continue;
        const widths = rows.map(r => r.children.length);
        const max = Math.max.apply(null, widths);
        for (let i = 0; i < rows.length; i++){
          for (let k = widths[i]; k < max; k++){
            const first = rows[i].firstElementChild;
            const pad = doc.createElement(first && first.tagName === 'TH' ? 'th' : 'td');
            pad.setAttribute('data-diff-pad', '');
            rows[i].appendChild(pad);
          }
        }
      }
    }

    function buildDiff(oldDoc, newDoc){
      const tally = {add:0, del:0, blocks:0, attrs:0};
      diffNode(oldDoc.body, newDoc.body, tally, 0);
      normalizeTables(newDoc);
      return tally;
    }

    function orphanBin(doc){
      let bin = doc.getElementById('__diff_removed__');
      if (!bin){
        bin = doc.createElement('div');
        bin.id = '__diff_removed__';
        bin.setAttribute('data-diff-block', 'del');
        const h = doc.createElement('p');
        h.textContent = '── 新版で削除され、挿入位置を特定できなかったブロック ──';
        bin.appendChild(h);
        doc.body.appendChild(bin);
      }
      return bin;
    }

    /* ---------- 8. 差分表示用スタイル ---------- */
    // マーカーは半透明のまま重ねると、実際に画面に出る色がその要素の背後にある
    // 「貼り付けた文書自身の背景色」との合成結果になり、白地では狙った赤でも
    // 淡い黄地ではサーモン、暗いコードブロックの上では茶色…と文書の中で色が
    // 割れてしまう（同じ del が場所によって 3〜6 色に見えるという報告の原因）。
    // 文書の「地の色」を 1 つ決め、その上に重ねた結果を不透明色として焼き込むことで、
    // 文書のどこに置かれても同じ色になるようにする。
    function resolveDiffBase(doc){
      const win = doc.defaultView;
      const parse = css => {
        const m = /rgba?\(([^)]+)\)/.exec(css || '');
        if (!m) return null;
        const p = m[1].split(',').map(parseFloat);
        const a = p.length > 3 ? p[3] : 1;
        return a > 0 ? { r: p[0], g: p[1], b: p[2], a } : null;
      };
      let bg = null, text = null;
      if (win){
        for (const el of [doc.body, doc.documentElement]){
          if (!el) continue;
          let cs = null;
          try { cs = win.getComputedStyle(el); } catch (e) { cs = null; }
          if (!cs) continue;
          if (!bg){ const c = parse(cs.backgroundColor); if (c && c.a === 1) bg = c; }
          if (!text) text = parse(cs.color);
        }
      }
      if (!text) text = { r: 17, g: 17, b: 17, a: 1 };
      // 背景が画像やグラデーションだと単色として取り出せない。その場合は文字色の
      // 明るさから、白い紙か黒い紙かだけを決める。
      if (!bg){
        const lum = 0.299 * text.r + 0.587 * text.g + 0.114 * text.b;
        bg = lum > 140 ? { r: 26, g: 26, b: 26, a: 1 } : { r: 255, g: 255, b: 255, a: 1 };
      }
      return { bg, text };
    }

    // 半透明色 (r,g,b,a) を地の色の上に重ねた結果を #rrggbb で返す。
    function flattenOver(r, g, b, a, base){
      const ch = (f, k) => Math.round(a * f + (1 - a) * k);
      return '#' + [ch(r, base.r), ch(g, base.g), ch(b, base.b)]
        .map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('');
    }

    // フラグメントリンクは buildHtmlDiffOutput() 側で href を外してあるので、
    // そのままではどこにも飛べない。クリックを拾って自分でスクロールさせることで、
    // srcdoc の base URL 問題を避けたまま目次や「ページ先頭へ」を使えるようにする。
    // 表示用 iframe は sandbox="allow-scripts allow-popups" なので実行できる。
    // 併せて、id を譲った削除ブロックが相手と一緒に出入りするようにする（後半参照）。
    const ANCHOR_SCRIPT = `(function(){
  function findTarget(raw){
    var id = String(raw || '').replace(/^#/, '');
    if (!id) return null;                     // href="#" は先頭へ
    var dec = id;
    try { dec = decodeURIComponent(id); } catch (e) {}
    return document.getElementById(id) || document.getElementById(dec)
        || document.getElementsByName(dec)[0] || document.getElementsByName(id)[0] || null;
  }
  document.addEventListener('click', function(e){
    var el = e.target;
    if (!el || !el.closest) return;
    var a = el.closest('a[data-diff-nolink]');
    if (!a) return;
    e.preventDefault();
    var raw = a.getAttribute('data-diff-nolink') || '';
    var t = findTarget(raw);
    if (!t){
      if (raw === '#' || raw === '') window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    t.classList.add('diff-flash');
    setTimeout(function(){ t.classList.remove('diff-flash'); }, 900);
  }, true);

  // 削除ブロックのうち、id を新しい側に譲ったもの（data-diff-old-id）は、
  // 貼り付けた文書自身のタブ切り替えから見えなくなる。タブを切り替える
  // スクリプトは getElementById で「生き残った方」だけを表に出すため、
  // 消えた方の内容が隠れたままになり、隠しパネルの差分が読めない。
  // 相手の表示状態をそのまま真似させて、対で出入りするようにする。
  var twins = [];
  Array.prototype.forEach.call(document.querySelectorAll('[data-diff-old-id]'), function(dead){
    var live = document.getElementById(dead.getAttribute('data-diff-old-id'));
    if (live && live !== dead) twins.push([live, dead]);
  });
  if (twins.length){
    // 値が変わるときだけ書き込む。同じ値でも書けば属性変更として観測され、
    // MutationObserver が自分の書き込みで再び起動して止まらなくなる。
    var sync = function(){
      for (var i = 0; i < twins.length; i++){
        var live = twins[i][0], dead = twins[i][1];
        var shown = getComputedStyle(live).display !== 'none';
        var want = shown ? (getComputedStyle(live).display || 'block') : 'none';
        if (dead.style.display !== want) dead.style.display = want;
      }
    };
    sync();
    if (window.MutationObserver){
      new MutationObserver(sync).observe(document.documentElement, {
        attributes: true, subtree: true, attributeFilter: ['hidden', 'class', 'style']
      });
    }
  }

  // ---- 左右表示の高さ揃え（HTML View） ----
  // sandbox に allow-same-origin を付けていないため、親はこの文書の中を直接
  // 読み書きできない。ここでは「測って親に伝える」「親に言われたとおり余白を
  // 入れる」の役だけを引き受け、両側を突き合わせて指示を出すのは親側
  // （renderHtmlView まわり）に任せる。1列表示 (#htmlDiffFrame) にも同じ
  // スクリプトが挿し込まれるが、親から指示が来ないかぎり何もしない
  // （待ち受けるだけで副作用は無い）。
  var ALIGN_ATTR = 'data-align-spacer';

  function clearAlignSpacers(){
    var list = document.querySelectorAll('[' + ALIGN_ATTR + ']');
    for (var i = 0; i < list.length; i++){ list[i].parentNode.removeChild(list[i]); }
  }

  // 対応表は「流れ」ごとに分かれている（data-sync-flow）。横に並ぶ器
  // （grid・flex の行・表の行など）は器自身が親の流れの 1 ブロックになり、
  // その中の子はそれぞれ独立した流れとして番号を振り直されている（親側
  // collectHtmlSyncUnits のコメント参照）。ここでは「1 段階ぶん」
  // （data-sync-depth が一致する要素）だけを対象に、流れごとに集計する。
  //
  // 各ブロックが占めている縦方向の量は、「このブロックの上端から、同じ
  // 流れの次のブロックの上端まで」の距離で測る。ブロック自身の高さ＋自分の
  // 上下マージンを足し合わせる方式（Markdown View 側の blockExtent）は、
  // 隣どうしのマージン相殺（margin collapsing）を二重に数えてしまうことが
  // ある。Markdown View は自前の .md-split-pane を flex-direction: column に
  // して相殺そのものを止めているが、ここは貼り付けたページ自身のレイアウトを
  // 一切変えられない（見た目を保つのがこの View の目的なので、対応関係を
  // 取るためだけに body の表示方式を変えるわけにはいかない）。「実際に
  // 描画された位置の差」で測れば、相殺が起きていてもそのまま正しく効く。
  //
  // 流れの終端（最後のブロックが占める分の下端）は、最上位の流れ
  // （flow="0"、body 直下）なら文書全体の高さ、それ以外ならその流れを生んだ
  // 器自身（[data-sync-flow-root]）の下端を使う。器の外へはみ出して次の
  // 兄弟まで食い込むと、器自身の高さを見誤ってしまう。
  function measureLevelBlocks(level){
    var nodes = document.querySelectorAll('[data-sync-depth="' + level + '"]');
    var byFlow = {};
    for (var i = 0; i < nodes.length; i++){
      var el = nodes[i];
      var flow = el.getAttribute('data-sync-flow');
      var idx = Number(el.getAttribute('data-sync-index'));
      if (!byFlow[flow]) byFlow[flow] = [];
      byFlow[flow].push({ index: idx, top: el.getBoundingClientRect().top });
    }
    var blocks = {};
    for (var flow in byFlow){
      var items = byFlow[flow];
      items.sort(function(a, b){ return a.top - b.top; });
      var boundary;
      if (flow === '0'){
        boundary = document.documentElement.scrollHeight;
      } else {
        var root = document.querySelector('[data-sync-flow-root="' + flow + '"]');
        boundary = root ? root.getBoundingClientRect().bottom : items[items.length - 1].top;
      }
      var flowBlocks = {};
      for (var j = 0; j < items.length; j++){
        var next = (j + 1 < items.length) ? items[j + 1].top : boundary;
        flowBlocks[items[j].index] = Math.max(0, next - items[j].top);
      }
      blocks[flow] = flowBlocks;
    }
    return blocks;
  }

  // afterEl が「親の最後の子」である間は祖先をたどり、その連鎖の一番外側を
  // 返す。素朴に afterEl の真後ろへ余白を差し込むと、afterEl（や途中の祖先）
  // の下マージンが本来は外側の兄弟まで素通り（margin collapsing の
  // collapse-through）していたはずなのに、余白という実体がその場に割り込む
  // ことでその素通りが断ち切られ、素通りするはずだった分がそのまま実際の
  // 隙間として上乗せされてしまう（実測で確認済み: ul,li の下マージンが
  // section の下マージンへ素通りしていた箇所に、その内側で余白を差し込んだ
  // ところ、狙った分より約10px 余分に開いた）。boundary（この流れの器）より
  // 外へは出ない。
  function climbLastChildChain(el, boundary){
    var cur = el;
    while (cur !== boundary && cur.parentNode && cur.parentNode !== boundary
      && cur.parentNode.lastElementChild === cur){
      cur = cur.parentNode;
    }
    return cur;
  }
  // 先頭（対応するブロックがまだ 1 つも無い状態）に差し込むときの対称版。
  // boundary の最初の子から、「親の最初の子」である間だけ祖先をたどる。
  function climbFirstChildChain(el, boundary){
    var cur = el;
    while (cur !== boundary && cur.parentNode && cur.parentNode !== boundary
      && cur.parentNode.firstElementChild === cur){
      cur = cur.parentNode;
    }
    return cur;
  }

  // parent の display を調べる（表の行・行群・表そのものかどうかの判定に使う。
  // getComputedStyle が失敗する状況＝要素が既にどこにも繋がっていない等は
  // 起こり得ないはずだが、念のため空文字を返して「表ではない」扱いにする）。
  function alignDisplayOf(el){
    try { return el ? (window.getComputedStyle(el).display || '') : ''; } catch (e) { return ''; }
  }
  // 今までどおりの、地の色に紛れて見えなくなる高さ合わせ用の div。
  function makeAlignSpacer(height){
    var spacer = document.createElement('div');
    spacer.setAttribute(ALIGN_ATTR, '');
    spacer.style.cssText = 'margin:0;padding:0;border:0;height:' + height + 'px;background-color:transparent;';
    return spacer;
  }
  // 器に gap があると、兄弟として余白を 1 つ挿した時点で gap が 1 つぶん
  // 余分に開く（実測: gap 8px で 8px、24px で 24px ずれた。しかも同じ流れに
  // 余白を挿すたび積み上がる）。その分を余白の高さから引いておく。
  // row-gap が 'normal'（＝gap 指定なし）のときは NaN になるので 0 とみなす。
  function alignRowGapOf(el){
    var g = NaN;
    try { g = parseFloat(window.getComputedStyle(el).rowGap); } catch (e) {}
    return (isFinite(g) && g > 0) ? g : 0;
  }
  // 表に border-spacing があると、行を 1 つ挿した時点でその縦幅ぶんが余分に
  // 開く（実測: border-spacing 0 8px で 8px、0 20px で 20px ずれた）。
  // flex/grid の gap とまったく同じ話。border-collapse: collapse の表では
  // border-spacing は効かないので 0 とみなす。
  function alignRowSpacingOf(el){
    var v = 0;
    try {
      var table = el.closest ? el.closest('table') : null;
      if (!table) return 0;
      var cs = window.getComputedStyle(table);
      if (cs.borderCollapse === 'collapse') return 0;
      // border-spacing は "横 縦" の 2 値。縦だけ要る（1 値なら縦横同値）。
      // このソース自体が ANCHOR_SCRIPT というテンプレートリテラル文字列の
      // 中に書かれているため、正規表現リテラル中のバックスラッシュは外側の
      // 文字列リテラルとしても一度解釈される。\s のまま書くと外側で
      // 未知のエスケープシーケンスとして単なる s に潰れ、/s+/ という
      // 別物の正規表現になってしまう（実測: 空白で分割されず追加が丸ごと
      // 素通りし、border-spacing の減算が一切効かなかった）。\\s+ と
      // 二重に エスケープしてはじめて注入先のスクリプトで /\s+/ に戻る。
      var parts = String(cs.borderSpacing || '').split(/\\s+/);
      v = parseFloat(parts.length > 1 ? parts[1] : parts[0]);
    } catch (e) { v = 0; }
    return (isFinite(v) && v > 0) ? v : 0;
  }
  // gap を差し引いた高さの余白を作る。引ききれない（必要な高さが gap より
  // 小さい）ときは高さ 0 にして、足りない分を負の margin で戻す
  //   必要な高さ H、gap G のとき  実際に開く量 = 余白の高さ + G + margin
  //   H >= G: 高さ H-G / margin 0        → H
  //   H <  G: 高さ 0   / margin H-G (負) → H
  // 余白がその器で唯一の子になる場合は gap が発生しないので、既に要素の子が
  // ある場合だけ差し引く。
  function makeGapAwareSpacer(container, height){
    var gap = (container && container.firstElementChild) ? alignRowGapOf(container) : 0;
    var spacer = makeAlignSpacer(Math.max(0, height - gap));
    if (gap > 0 && height < gap) spacer.style.marginBottom = (height - gap) + 'px';
    return spacer;
  }
  // 表の行群（tbody/thead/tfoot）や表そのものの直下に差し込む用の、
  // まるごと 1 行ぶんの空行。td だけが高さを持ち、border も背景も消して
  // 見た目には出さない。tr:hover 等ホスト側のスタイルに反応しないよう
  // pointer-events も切っておく。
  function makeAlignRowSpacer(height, cols){
    var tr = document.createElement('tr');
    tr.setAttribute(ALIGN_ATTR, '');
    tr.style.cssText = 'pointer-events:none;';
    var td = document.createElement('td');
    td.colSpan = cols > 0 ? cols : 1;
    td.style.cssText = 'height:' + height + 'px;padding:0;border:none;background-color:transparent;';
    tr.appendChild(td);
    return tr;
  }
  // 行群の中で最大の列数（各行の colSpan の合計のうち最大のもの）を数える。
  // 空の行スペーサーの colspan をこれに合わせないと、その行だけ列幅が
  // 崩れて見えてしまう。
  function alignColumnsOf(rowGroup){
    var rows = rowGroup.rows ? rowGroup.rows : rowGroup.querySelectorAll(':scope > tr');
    var max = 1;
    for (var i = 0; i < rows.length; i++){
      var cells = rows[i].cells || rows[i].querySelectorAll(':scope > th, :scope > td');
      var n = 0;
      for (var j = 0; j < cells.length; j++){ n += cells[j].colSpan || 1; }
      if (n > max) max = n;
    }
    return max;
  }
  // 子を横に並べる器かどうか。こういう器の直下に余白を置くと、余白そのものが
  // 「並びの1つ」として数えられてしまう ── 表なら無名セル、grid なら余分な
  // グリッドアイテム（実測: 3 列の grid で 3 枚目が次の行へ折り返した）、
  // flex の横並びなら余分なアイテムとして幅を食う。いずれも以降の子が
  // 1 つずつずれる。縦に積む器（flex-direction が column 系）は、子の間に
  // 余白が入るのが正しいので対象にしない。
  function isAlignSideBySide(el, display){
    if (display === 'table-row' || display === 'grid' || display === 'inline-grid') return true;
    if (display === 'flex' || display === 'inline-flex'){
      var fd = 'row';
      try { fd = window.getComputedStyle(el).flexDirection || 'row'; } catch (e) {}
      return fd.indexOf('column') !== 0;
    }
    return false;
  }
  // parent の中の beforeNode の直前へ、parent の display に合った器（div /
  // tr / tbody）で余白を差し込む。
  //
  // 子を横に並べる器（表の行、grid、横方向の flex）は「並びそのもの」が
  // 見た目を作っているので、そこに div を割り込ませると本来 1 個も無いはず
  // の「余分な並びの1つ」が生まれてしまう（並びの外なら div は単に高さを
  // 持つだけの無害な兄弟だが、並びの内側では構造そのものになる）。実測では、
  // tr の中（th と td の間）に割り込んだ div が無名セルになって以降の
  // td を 1 列分右へ押し出し（4 箇所・列がずれる）、tbody の中（tr と tr
  // の間）に割り込んだ div が無名行になって表を横一杯の空白帯で
  // 分断した（3 箇所・不自然な隙間）。grid でも同じ現象が起きる ── 3 列
  // grid の葉要素（子を持たない子）に余白を挟むと div がそのままグリッド
  // アイテムとして数えられ、3 枚目のカードが次のグリッド行へ折り返した
  // （カード左端が 8, 239, 469 になるはずが 8, 239, 8 に）。row-flex でも
  // 幅を食う分だけ以降のアイテムが右へずれるのは同じ理屈。そこで差し込み先
  // の display を見て器を選び分ける。
  //   ・parent が横に並べる器（isAlignSideBySide が true）: 並びの間に
  //     何かを挟むこと自体が構造を壊す（挟んだ時点でそれが並びの1つに
  //     数えられる）ので、高さは「並びの要素自身の中」に持たせる。
  //     cellCandidate（climbLastChildChain 等で辿り着いた target）が
  //     parent の直接の子であれば、その最後の子として div を追加する。
  //     tr の場合、tr の直接の子になれるのは td/th だけなので、これは
  //     従来どおり「セルの最後の子に足す」動作と一致する。同じ並びの
  //     各要素にそれぞれ加えても、並び全体の高さは一番背の高い要素に
  //     合わせて決まるので、二重に伸びることはない。
  //     cellCandidate が特定できない、または parent の直接の子でない
  //     場合は並びの中に余分な1個を避けようがないが、少なくとも並びの
  //     外へ出すよりはまし。フォールバックとして親へ直接足す。
  //   ・parent が table-row-group/table-header-group/table-footer-group:
  //     本物の空行（tr>td）を挿す。td の colspan は行群内の最大列数に
  //     合わせ、border も背景も消して見た目には何も無いままにする。
  //   ・parent が table: thead と tbody の間など、行群をまたいだ位置。
  //     tr は table の直接の子にはなれないので、tbody で包んでから挿す。
  //   ・それ以外（td/ol/ul/body など）は今までどおり div のまま。
  //
  // 兄弟として div を挿す3箇所（並びのフォールバック／並び要素の中／
  // それ以外の div 直挿し）はいずれも器に row-gap が付いていると、余白を
  // 1 個増やしたことで gap も 1 個ぶん余分に開いてしまう（実測: column-flex
  // で gap 0px→ずれ0px, 8px→8px, 24px→24px。gap の値そのままずれ、同じ
  // 流れに余白を挿すたび積み上がる）。table の border-spacing はこの3箇所
  // （div を挿す経路）には含めない ── 実測でずれなかった（外側の流れの
  // 高さ計測が吸収する）ので、ここは今までどおり div のまま。
  // ただし makeAlignRowSpacer が本物の tr を挿す table/行群の分岐は別
  // ── そちらは applyCorrections 経由（実際の描画結果を突き合わせて差分を
  // 押し込む経路）で border-spacing の余分な1個ぶんがそのままずれとして
  // 出ることを実測で確認済み（alignRowSpacingOf 参照）。
  function placeAlignSpacer(parent, beforeNode, height, cellCandidate){
    var display = alignDisplayOf(parent);
    var spacer;
    if (isAlignSideBySide(parent, display)){
      if (cellCandidate && cellCandidate.nodeType === 1 && cellCandidate.parentNode === parent){
        spacer = makeGapAwareSpacer(cellCandidate, height);
        cellCandidate.appendChild(spacer);
        return spacer;
      }
      // 並びの要素が特定できない場合は余分な1個を避けようがないが、
      // 少なくとも並びの外へ出すよりはまし。フォールバックとして親に
      // 直接足す。
      spacer = makeGapAwareSpacer(parent, height);
      parent.insertBefore(spacer, beforeNode);
      return spacer;
    }
    if (/^table-(row-group|header-group|footer-group)$/.test(display)){
      var v1 = alignRowSpacingOf(parent);
      // border-spacing V が必要な高さ H の半分より大きいと、行を挿すこと自体が
      // 生む余分な V の方が H より大きくなり、挿さない方が近似として近い
      // （挿せば最低でも V は開くので、狙いが V の半分未満なら何もしない方が
      // 誤差が小さい）。呼び出し元は補正を何回かに分けて回すので、ここで
      // 何もしなくても無限ループにはならない。
      if (v1 > 0 && height * 2 < v1) return null;
      spacer = makeAlignRowSpacer(Math.max(0, height - v1), alignColumnsOf(parent));
      parent.insertBefore(spacer, beforeNode);
      return spacer;
    }
    if (display === 'table'){
      var v2 = alignRowSpacingOf(parent);
      if (v2 > 0 && height * 2 < v2) return null;
      var tbody = document.createElement('tbody');
      tbody.setAttribute(ALIGN_ATTR, '');
      tbody.appendChild(makeAlignRowSpacer(Math.max(0, height - v2), alignColumnsOf(parent)));
      parent.insertBefore(tbody, beforeNode);
      return tbody;
    }
    spacer = makeGapAwareSpacer(parent, height);
    parent.insertBefore(spacer, beforeNode);
    return spacer;
  }

  function insertSpacerAfter(afterEl, height, boundary){
    if (afterEl && afterEl.parentNode){
      var target = boundary ? climbLastChildChain(afterEl, boundary) : afterEl;
      return placeAlignSpacer(target.parentNode, target.nextSibling, height, target);
    } else if (boundary){
      // 流れの先頭。boundary の最初の子が「親の最初の子」である間たどった
      // 一番外側の直前に差し込む（対称の考え方。既存の最初の子が無ければ
      // boundary 自身の先頭でよい）。boundary 自身が tr/tbody であること
      // もあるので（表の行や行群がそのまま 1 つの流れの器になっている場合）、
      // ここも placeAlignSpacer で display に応じた器を選ぶ。
      var head = boundary.firstElementChild;
      var insertBefore = head ? climbFirstChildChain(head, boundary) : null;
      return placeAlignSpacer(boundary, insertBefore || boundary.firstChild, height, insertBefore);
    } else if (document.body){
      var spacer = makeGapAwareSpacer(document.body, height);
      document.body.insertBefore(spacer, document.body.firstChild);
      return spacer;
    }
  }

  // ある流れの先頭（対応するブロックがまだ 1 つも見つかっていない）に余白を
  // 差し込むときの置き場所と、「この流れが自分の側にそもそも存在するか」の
  // 判定を兼ねる。流れを生んだ器（カードなど）がまるごと片側にしか無い場合、
  // [data-sync-flow-root] はそちら側では見つからない ── その場合は null を
  // 返し、呼び出し側はその流れを丸ごと諦める。器自身の高さの差は、その器を
  // 含む親の流れの処理でまとめて吸収されるので、ここで無理に子を 1 つずつ
  // 埋めようとすると、器の外（document.body の先頭など）へ迷子の余白を
  // 大量に生んでしまう。
  function flowContainer(flow){
    if (flow === '0') return document.body;
    return document.querySelector('[data-sync-flow-root="' + flow + '"]') || null;
  }

  // 親から届いた「相手側の、この段階（level）に属するブロックが占めている
  // 高さ」（まだ 1 度も余白を入れていない、まっさらな状態での値）をもとに、
  // 自分の側へ余白を入れる。流れごとに独立して処理する ── 別の流れの対応表
  // を混ぜて数えると番号が衝突する（各流れは 0 から数え直している）。
  function applyLevelAlign(level, counterpartByFlow){
    var mineByFlow = measureLevelBlocks(level);
    var flows = {}, f;
    for (f in mineByFlow) flows[f] = true;
    for (f in counterpartByFlow) flows[f] = true;

    for (var flow in flows){
      // その流れの器（境界）。余白を差し込む位置を「親の最後（最初）の子」の
      // 連鎖の外側まで持ち上げてよい範囲を、この器の中に留める（climbLastChildChain
      // /climbFirstChildChain 側のコメント参照）。
      var boundary = flowContainer(flow);
      if (!boundary) continue; // この流れは自分の側に存在しない

      var mine = mineByFlow[flow] || {};
      var counterpart = counterpartByFlow[flow] || {};
      var maxIndex = -1, k;
      for (k in mine){ if (Number(k) > maxIndex) maxIndex = Number(k); }
      for (k in counterpart){ if (Number(k) > maxIndex) maxIndex = Number(k); }

      var cursor = null; // 直前まで処理した要素（本物、または直前に入れた余白）
      for (var idx = 0; idx <= maxIndex; idx++){
        var el = document.querySelector('[data-sync-flow="' + flow + '"][data-sync-index="' + idx + '"]');
        var otherH = counterpart[idx];
        if (el){
          if (otherH !== undefined){
            var diff = otherH - mine[idx];
            if (diff > 1) insertSpacerAfter(el, diff, boundary);
          }
          cursor = el;
        } else if (otherH !== undefined){
          // 自分の側に無い（相手にしか無いブロック）: 同じ位置に相手の高さぶんの余白を入れる
          cursor = insertSpacerAfter(cursor, otherH, boundary);
        }
        // どちらにも無い場合（ins/del だけで構成されていたブロックが両方から
        // 消えた場合）は、埋めるものが無いので何もしない。
      }
    }
  }

  function postToParent(msg){
    msg.__htmlAlign = true;
    // targetOrigin は '*' 固定。この文書自身が allow-same-origin 無しの
    // 不透明オリジンなので、親の実オリジンを指定しても届かない
    // （相手が opaque origin だと厳密一致が絶対に成立しないため）。
    parent.postMessage(msg, '*');
  }

  // 読み込みが遅れる画像（画面外にあるうちは取得しない loading="lazy" など）は、
  // この文書の外からは気づけない。読み込み中の <img> にだけ一度きりの
  // load/error 監視を付け、届いたら親へ知らせる。親はこれを合図に、両方の
  // iframe へ改めて測り直しを指示する。
  function watchImagesForRealign(){
    var imgs = document.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++){
      (function(img){
        if (img.complete) return;
        var notify = function(){ postToParent({ type: 'settled' }); };
        img.addEventListener('load', notify, { once: true });
        img.addEventListener('error', notify, { once: true });
      })(imgs[i]);
    }
  }

  // 揃え終えたあとの答え合わせ用。各ブロックが実際にどこに来たかを返す。
  function collectTops(){
    var out = {}, nodes = document.querySelectorAll('[data-sync-index]');
    for (var i = 0; i < nodes.length; i++){
      var el = nodes[i];
      out[el.getAttribute('data-sync-flow') + ':' + el.getAttribute('data-sync-index')]
        = el.getBoundingClientRect().top + (window.scrollY || 0);
    }
    return out;
  }

    // ブロックの対応付け（nodeSimilarity）と表の行の対応付け（mdRowSimilarity）で

    function mdPairSequence(lefts, rights, simOf, onPair, onLeft, onRight) {

      const dp = [];
      for (let i = 0; i <= n; i++) dp.push(new Float64Array(m + 1));

          dp[i][j] = Math.max(dp[i + 1][j], dp[i][j + 1], take);
        }
      }
      let i = 0, j = 0;
      while (i < n && j < m) {
        const take = sim[i][j] >= PAIR_THRESHOLD ? sim[i][j] + dp[i + 1][j + 1] : -1;
        if (take >= dp[i + 1][j] && take >= dp[i][j + 1]) onPair(lefts[i++], rights[j++]);
        else if (dp[i + 1][j] >= dp[i][j + 1]) onLeft(lefts[i++]);

      while (j < m) onRight(rights[j++]);

    // ブロック単位で対を作っても、表の中は 1 本のトークン列のままなので、行が

    // identityText / nodeSimilarity は HTML View も使っているので触らない。

    // あるセルを使う。全部が数字なら先頭セルに戻す（数字そのものが識別子である
    // 表もあるため）。
    function mdRowIdentity(tr) {
      const cells = Array.from(tr.children).filter((c) => c.tagName === 'TD' || c.tagName === 'TH');
      for (const c of cells) {
        const t = norm(c.textContent);
        if (t && !/^[0-9]+([.\-][0-9]+)*$/.test(t)) return t;
      }
      return cells.length ? norm(cells[0].textContent) : '';
    }

    // nodeSimilarity と同じ組み立て（識別テキストと全文を半々で見る）で、識別
    // テキストの取り方だけを行向けに差し替えたもの。
    function mdRowSimilarity(x, y) {
      const full = tokenOverlap(norm(x.textContent), norm(y.textContent));
      const ia = mdRowIdentity(x), ib = mdRowIdentity(y);
      if (!ia && !ib) return full;
      return 0.5 * identityOverlap(ia, ib) + 0.5 * full;
    }

    // 想定は marked の出力（<table> の直下は thead / tbody だけ）。セルの結合
    // （rowspan/colspan）があるものや、想定と違う組み立てのものは行に分けず、
    // 表ごと HtmlDiff に渡す ── 行数と列の対応が単純に決まらないため。
    function mdTableDiff(bTable, aTable) {
      const whole = () => HtmlDiff.execute(bTable.outerHTML, aTable.outerHTML);
      if (bTable.querySelector('[rowspan], [colspan]') || aTable.querySelector('[rowspan], [colspan]')) return whole();
      const sectionsOf = (t) => {
        const out = {};
        for (const el of Array.from(t.children)) {
          if (el.tagName !== 'THEAD' && el.tagName !== 'TBODY') return null; // caption/colgroup/tfoot 等
          if (out[el.tagName]) return null;                                  // 同じ section が複数
          out[el.tagName] = el;
        }
        return out;
      };
      const bs = sectionsOf(bTable), as = sectionsOf(aTable);
      if (!bs || !as) return whole();

      const rowsOf = (sec) => (sec ? Array.from(sec.children).filter((el) => el.tagName === 'TR') : []);
      const build = (tag, bSec, aSec) => {
        if (!bSec && !aSec) return '';
        const parts = [];
        mdPairSequence(
          rowsOf(bSec), rowsOf(aSec), mdRowSimilarity,
          (bTr, aTr) => parts.push(HtmlDiff.execute(bTr.outerHTML, aTr.outerHTML)),
          (bTr) => parts.push(HtmlDiff.execute(bTr.outerHTML, '')),
          (aTr) => parts.push(HtmlDiff.execute('', aTr.outerHTML)));
        return '<' + tag + '>' + parts.join('\n') + '</' + tag + '>';
      };
      // 器は after 側の <table> を属性ごと複製して使う（marked は属性を付けないが、
      // 付いていたときに落とさないため）。
      const shell = aTable.cloneNode(false);
      shell.innerHTML = build('thead', bs.THEAD, as.THEAD) + build('tbody', bs.TBODY, as.TBODY);
      return shell.outerHTML;
    }

    function blockPairedHtmlDiff(bHtml, aHtml) {
      const bodyOf = (html) => new DOMParser().parseFromString(html, 'text/html').body;
      const bEls = Array.from(bodyOf(bHtml).children);
      const aEls = Array.from(bodyOf(aHtml).children);
      // どちらかにブロックが 1 つも無いなら分ける意味が無いので、丸ごと渡す。
      if (!bEls.length || !aEls.length) return HtmlDiff.execute(bHtml, aHtml);

      const out = [];
      // 表だけは行の対応も決めてから渡す（mdTableDiff のコメント参照）。
      const pairOne = (bEl, aEl) => out.push(
        bEl.tagName === 'TABLE' && aEl.tagName === 'TABLE'
          ? mdTableDiff(bEl, aEl)
          : HtmlDiff.execute(bEl.outerHTML, aEl.outerHTML));
      const delOne = (bEl) => out.push(HtmlDiff.execute(bEl.outerHTML, ''));
      const insOne = (aEl) => out.push(HtmlDiff.execute('', aEl.outerHTML));

      // 変わった区間（片側だけの run が続く範囲）の突き合わせ。
      const resolveRegion = (dels, inss) => mdPairSequence(dels, inss, nodeSimilarity, pairOne, delOne, insOne);

      let bi = 0, ai = 0;
      let pendingDel = [], pendingIns = [];
      const flush = () => {
        if (pendingDel.length || pendingIns.length) resolveRegion(pendingDel, pendingIns);
        pendingDel = []; pendingIns = [];
      };
      diffSeq(bEls.map((el) => el.outerHTML), aEls.map((el) => el.outerHTML)).forEach((run) => {
        const len = run.items.length;
        if (run.op === 0) {
          flush();
          // 同一なのでどちらでもよい。after 側をそのまま使う。
          for (let k = 0; k < len; k++) out.push(aEls[ai + k].outerHTML);
          bi += len; ai += len;
        } else if (run.op === -1) {
          for (let k = 0; k < len; k++) pendingDel.push(bEls[bi + k]);
          bi += len;
        } else {
          for (let k = 0; k < len; k++) pendingIns.push(aEls[ai + k]);
          ai += len;
        }
      });
      flush();
      // marked の出力はブロックの間が改行で区切られている。同じ形に戻して繋ぐ。
      return out.join('\n');
    }

    let diffEditor, diffOrig, diffMod;
    let beforeModel, afterModel;
    let beforeFocused = false;
    let afterFocused = false;
    // 1列 / 左右 の選択はこの 1 つで Monaco / Markdown View / HTML View 共通に持つ
    // （ツールバーの Inline / Split ボタンで切り替える。false＝左右、true＝1列/インライン）。
    let isInlineView = false;
    let isRichDiffView = false;
    let richViewMode = null; // 'markdown' | 'html' | null — どちらの Rich View が開いているか（未オープン時は null）
    let mdDiffedHtml = null; // openMarkdownView で 1 回だけ作った sanitize 済み diff HTML。1列⇄左右はこれを使い回す
    let htmlDiffedDocs = null; // openHtmlView で 1 回だけ作った {single, left, right}。1列⇄左右はこれを使い回す

    const showToast = (msg) => {
      const t = document.getElementById('toast');
      t.innerText = msg || 'Diff URL copied to clipboard!';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    };

    // ===== Auto Save (sessionStorage: per-tab, so parallel tabs don't clobber each other) =====
    const AUTO_SAVE_KEY = 'diffToolAutoSave';
    let autoSaveTimer = null;

    function saveAutoSave() {
      try {
        sessionStorage.setItem(AUTO_SAVE_KEY, JSON.stringify({
          b: beforeModel.getValue(),
          a: afterModel.getValue(),
          l: document.getElementById('langSelect').value,
          m: isRichDiffView,
          vm: richViewMode
        }));
      } catch (e) {}
    }

    function scheduleAutoSave() {
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(saveAutoSave, 500);
    }

    function clearAutoSave() {
      clearTimeout(autoSaveTimer);
      try { sessionStorage.removeItem(AUTO_SAVE_KEY); } catch (e) {}
    }

    function restoreAutoSave() {
      let raw;
      try { raw = sessionStorage.getItem(AUTO_SAVE_KEY); } catch (e) { return; }
      if (!raw) return;
      try {
        const d = JSON.parse(raw);
        beforeModel.setValue(d.b || '');
        afterModel.setValue(d.a || '');
        if (d.l) {
          document.getElementById('langSelect').value = d.l;
          monaco.editor.setModelLanguage(beforeModel, d.l);
          monaco.editor.setModelLanguage(afterModel, d.l);
        }
        if (d.m) {
          // vm が無い古いペイロードは、復元後の言語が html なら 'html'、それ以外は 'markdown' とみなす。
          const mode = d.vm || (d.l === 'html' ? 'html' : 'markdown');
          setTimeout(() => {
            if (isRichDiffView) return;
            const btn = document.getElementById(mode === 'html' ? 'htmlViewBtn' : 'richDiffBtn');
            if (btn) btn.click();
          }, 150);
        }
      } catch (e) {}
    }

    // ===== Markdown View Width Resizer Logic =====
    const mdResizers = document.querySelectorAll('.md-resizer');
    let isMdResizing = false;
    let activeResizerDir = null;

    mdResizers.forEach(resizer => {
      resizer.addEventListener('mousedown', (e) => {
        isMdResizing = true;
        activeResizerDir = resizer.getAttribute('data-dir');
        resizer.classList.add('dragging');
        document.body.classList.add('is-resizing');
      });
    });

    document.addEventListener('mousemove', (e) => {
      if (!isMdResizing) return;
      // 目次が出ている分だけ、読みやすい列の「中心」は画面ちょうど中央では
      // なく目次の幅の半分だけ右へ寄る。.md-resizer の CSS 側の計算式と
      // 揃えてある（そちらのコメント参照）。
      const tocW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--md-toc-w')) || 0;
      const center = (window.innerWidth + tocW) / 2;

      const dist = activeResizerDir === 'left' ? (center - e.clientX) : (e.clientX - center);
      let newWidth = dist * 2;

      if (newWidth < 400) newWidth = 400;
      if (newWidth > window.innerWidth - tocW - 64) newWidth = window.innerWidth - tocW - 64;

      document.documentElement.style.setProperty('--md-width', `${newWidth}px`);
    });

    document.addEventListener('mouseup', () => {
      if (isMdResizing) {
        isMdResizing = false;
        mdResizers.forEach(r => r.classList.remove('dragging'));
        document.body.classList.remove('is-resizing');
      }
    });

    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      
      const commonColors = {
        'scrollbar.shadow': '#00000000', 'editor.lineHighlightBorder': '#00000000',
        'sash.hoverBorder': '#00000000', 'diffEditor.diagonalFill': '#00000000'
      };

      monaco.editor.defineTheme('custom-vs-dark', { base: 'vs-dark', inherit: true, rules: [], colors: { ...commonColors, 'editor.background': '#1e1e1e' }});
      monaco.editor.defineTheme('custom-vs-light', { base: 'vs', inherit: true, rules: [], colors: { ...commonColors, 'editor.background': '#fffffe' }});
      monaco.editor.defineTheme('custom-github-dark', { base: 'vs-dark', inherit: true, rules: [], colors: { ...commonColors, 'editor.background': '#0d1117' }});
      monaco.editor.defineTheme('custom-noctis-hc', { 
        base: 'vs-dark', inherit: true, rules: [ { background: '000000' } ], 
        colors: { 
          ...commonColors, 'editor.background': '#000000', 'editor.foreground': '#ffffff',
          'diffEditor.insertedTextBackground': '#183a21', 'diffEditor.removedTextBackground': '#4b181a',
          'editorLineNumber.foreground': '#4f4f4f'
        }
      });
      
      applyTheme(document.getElementById('themeSelect').value);

      const savedFontSize = localStorage.getItem('diffToolFontSize') || '12';
      if (document.getElementById('fontSizeSelect')) document.getElementById('fontSizeSelect').value = savedFontSize;

      // 補正処理: 標準プロポーショナルフォント向けに「Monacoサイズ ＋ 2px」を適用
      const initialMdFontSize = parseInt(savedFontSize, 10) + 2;
      document.documentElement.style.setProperty('--md-font-size', `${initialMdFontSize}px`);

      const commonOptions = {
        language: 'markdown', wordWrap: 'on', automaticLayout: true, fontSize: parseInt(savedFontSize, 10),
        fontFamily: "'Source Han Mono', '源ノ等幅', 'Source Han Code JP', '源ノ角ゴシック Code JP', 'JetBrains Mono', 'Noto Sans Mono', Consolas, Menlo, monospace",
        fontLigatures: true, scrollBeyondLastLine: false, padding: { top: 16, bottom: 16 },
        lineNumbersMinChars: 2, lineDecorationsWidth: 12, folding: false, glyphMargin: false,               
        scrollbar: { verticalScrollbarSize: 8, horizontal: 'hidden', useShadows: false }, 
        hideCursorInOverviewRuler: true, renderLineHighlight: 'none',
        minimap: { enabled: false }, renderOverviewRuler: true,
        occurrencesHighlight: false,
        selectionHighlight: false,
        unicodeHighlight: { ambiguousCharacters: false, invisibleCharacters: false },
        smoothScrolling: true,
        cursorSmoothCaretAnimation: 'on',
      };

      beforeModel = monaco.editor.createModel('', 'markdown');
      afterModel = monaco.editor.createModel('', 'markdown');

      diffEditor = monaco.editor.createDiffEditor(document.getElementById('diffEditor'), {
        ...commonOptions, originalEditable: true, readOnly: false, renderSideBySide: true, ignoreTrimWhitespace: false,
        splitViewDefaultRatio: 0.5, enableSplitViewResizing: true, renderMarginRevertIcon: false, renderIndicators: false, diffCodeLens: false
      });

      diffEditor.setModel({ original: beforeModel, modified: afterModel });
      diffOrig = diffEditor.getOriginalEditor();
      diffMod = diffEditor.getModifiedEditor();
      
      diffOrig.updateOptions({ wordWrap: 'on', renderOverviewRuler: true });
      diffMod.updateOptions({ wordWrap: 'on', renderOverviewRuler: true });

      // 開いた直後にそのまま貼り付け始められるよう、before欄にフォーカスを当てる。
      diffOrig.focus();

      // Webフォントの読み込み完了を待ってから、文字幅を強制再計算させる
      document.fonts.ready.then(() => {
        monaco.editor.remeasureFonts();
        if (diffEditor) diffEditor.layout();
      });

      document.getElementById('fontSizeSelect').addEventListener('change', (e) => {
        const size = parseInt(e.target.value, 10); localStorage.setItem('diffToolFontSize', e.target.value);
        diffEditor.updateOptions({ fontSize: size }); diffOrig.updateOptions({ fontSize: size }); diffMod.updateOptions({ fontSize: size });
        
        // 補正処理: 標準プロポーショナルフォント向けに「Monacoサイズ ＋ 2px」で連動更新
        document.documentElement.style.setProperty('--md-font-size', `${size + 2}px`);
        rebuildChangeActions();
        // 文字サイズが変わるとブロックの折り返し行数が変わり、高さも変わる。
        // ウィンドウ幅の変化と違って ResizeObserver では拾えない（#richDiffViewer
        // 自体の幅は変わらないため）ので、ここで明示的に測り直す。
        scheduleMdRealign();
        // 目次の項目も --md-font-size に連動して大きさが変わり、行の高さも
        // 変わる。現在位置ハイライトは項目の位置を実測して決めているので、
        // ここで測り直しておかないと文字サイズを変えた直後だけずれて見える。
        scheduleMdTocHighlight();
        if (htmlRealignHook) htmlRealignHook();
      });

      function updateLineNumberWidth(editor) {
        const lineCount = editor.getModel().getLineCount();
        const minChars = Math.max(2, String(lineCount).length + 1);
        editor.updateOptions({ lineNumbersMinChars: minChars });
      }

      [diffOrig, diffMod].forEach(editor => {
        updateLineNumberWidth(editor); editor.getModel().onDidChangeContent(() => updateLineNumberWidth(editor));
      });

      let changeElements = [];

      function rebuildChangeActions() {
        const container = document.getElementById('changeActions');
        if (!container) return;
        container.innerHTML = ''; changeElements = [];
        if (isInlineView) return;

        const changes = diffEditor.getLineChanges();
        if (!changes || changes.length === 0) return;

        changes.forEach((change) => {
          const group = document.createElement('div'); group.className = 'change-action-group';

          const btnAcceptRight = document.createElement('button'); btnAcceptRight.className = 'change-action-btn accept-right';
          btnAcceptRight.innerHTML = '&#x276D;'; btnAcceptRight.title = 'Apply original → modified';
          btnAcceptRight.addEventListener('click', (e) => { e.stopPropagation(); applyChangeToModified(change); });
          group.appendChild(btnAcceptRight);

          const btnAcceptLeft = document.createElement('button'); btnAcceptLeft.className = 'change-action-btn accept-left';
          btnAcceptLeft.innerHTML = '&#x276C;'; btnAcceptLeft.title = 'Apply modified → original';
          btnAcceptLeft.addEventListener('click', (e) => { e.stopPropagation(); applyChangeToOriginal(change); });
          group.appendChild(btnAcceptLeft);

          container.appendChild(group); changeElements.push({ change, el: group });
        });
        updateChangeActionsPosition();
      }

      function updateChangeActionsPosition() {
        if (changeElements.length === 0 || isInlineView) return;
        const mainContainer = document.getElementById('mainContainer');
        const mainRect = mainContainer.getBoundingClientRect();
        const origDom = diffOrig.getDomNode(); const modDom = diffMod.getDomNode();
        if (!origDom || !modDom) return;
