<h1>テストケースを HTML View で開く</h1>
<p>下のボタンは <code>all-cases-before.html</code> と <code>all-cases-after.html</code> を
正しい向き（左=BEFORE / 右=AFTER）で読み込んだ状態の Diff URL です。
ファイルをエディタへ入れる手順が要らないので、左右を入れ違える余地がありません。</p>
<p>開いたら先頭の「diff の向き確認」を見てください。
<strong>BEFORE が赤・AFTER が緑</strong>なら正しい向きです。</p>
